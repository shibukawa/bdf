id: requirement:print
type: requirement
title: 印刷 — プリンタへの出力、スプール、プリントサーバー（print/）
summary: >-
  BDF の 4 つ目の出口。.bdf（と converter が読める入力）を、OS のドライバに頼らず Go だけで紙にする。
  印刷指示（チケット）・スプール（キュー）・接続（出力先）の 3 層に分け、ローカルの bdf print と
  複数台のリモートプリンタを束ねるプリントサーバーで 1 と 3 を共有する。最初の出力先は IPP（driverless）、
  最初の文書形式は PDF（ベクタのまま。pdfbdf）で、PDF を受けないプリンタには PWG Raster（imagebdf の帯から流す）。Windows / macOS / Linux。
  叙述は knowledge-inputs/print-plan/print-requirements.ja.md（2026-10-19）。
lifecycle: proposed
authority: authored
aliases:
- 印刷
- bdf print
- プリントサーバー
- print server
- スプール
- IPP
constraints:
- 出力先の第 1 はプリンタ直結の IPP（IPP/2.0 の操作、ipps、DNS-SD の探索）。macOS / Linux の CUPS のキューも同じクライアントで扱う。OS のスプーラ経由（Windows の winspool）と古いプロトコル（9100、LPD）は補助で、後の段階（2026-10-19 利用者「新しいプロトコルから」）
- 文書形式の第 1 は PDF（ベクタのまま。pdfbdf の出力をそのまま送り、部数・両面・合わせ方はプリンタに任せる）。プリンタが PDF を受けないときだけ PWG Raster に落とす（imagebdf の PagesRows の帯を行の符号化に直結し、ページ全体の画像を持たない）。URF と PCLm は第 2（2026-10-19 利用者「ベクトルデータもあるのでそちらで印刷できるならそれを優先したい」）
- チケットの名前は IPP の属性に合わせる（copies、sides、media、media-col、print-color-mode、print-quality、printer-resolution、page-ranges、print-scaling、finishings、job-name …）。Windows の DEVMODE も CUPS のオプションもここから写す
- ジョブの状態は IPP の job-state（pending / pending-held / processing / processing-stopped / canceled / aborted / completed）と job-state-reasons の語彙をそのまま使う
- cgo なし。OS 固有のコードは print/internal/osspool に OS ごとの build tag。wasm / TinyGo のビルドには入れない
- スプールはディレクトリとファイル（制御ファイルは JSON、文書は .bdf のまま、内容アドレスで同じ文書は 1 回）。一時ファイル＋改名。データベースは使わない
- 再起動の後に同じジョブを二重に刷らない。送る前にプリンタの job-id を記録し、再開時は Get-Jobs で状態を確かめてから再送する
- 同じ文書・同じチケット・同じフォントなら同じバイト列（golden と再送の照合）
- 暗号化した .bdf はスプールに暗号化のまま置く。描いた結果は既定で残さない。ログに文書の中身・パスワード・資格情報を書かない
- IPP の符号化・DNS-SD は自前で書く方針（推奨。未決 open_questions）
non_goals:
- プリンタドライバ（Windows の v4 / Print Support App、CUPS のフィルタ / Printer Application）を書くこと
- 各社固有の PDL（PCL 5/6、PostScript、ESC/Page 系）の生成
- ラベル・レシート・ドットインパクトの PDL（ZPL / SBPL / TPCL / ESC/POS / ESC/P）は print-m5 まで
- クラウド印刷サービス（Universal Print など）との連携、IPP INFRA の代理（後の論点）
- ブラウザ（wasm）からの印刷（window.print() の領分。ビューアはサーバーに投げる）
- 課金・部門管理・認証印刷の運用（履歴は出す）
- スキャン（eSCL）、FAX、プリンタの管理（ファームウェア、消耗品、SNMP の詳細監視）
open_questions:
  ipp-codec:
    text: IPP の符号化を自前で書くか、OpenPrinting/goipp（BSD-2、符号化のみ、搬送は net/http）を使うか。推奨は自前（repo の流儀、fuzz しやすい。goipp はテストの参照実装に）
    state: open
  dns-sd:
    text: DNS-SD（mDNS）を自前で書くか、grandcat/zeroconf・brutella/dnssd・hashicorp/mdns を使うか。推奨は自前の最小実装（golang.org/x/net/dns/dnsmessage は既に依存にある）。m4 の広告も同じ土台
    state: open
  default-format:
    text: 既定の文書形式を PWG Raster 優先（絵がプリンタに依らない、モノクロ 2 値で小さい）にするか PDF 優先（ベクタで小さい、プリンタの解像度で文字が出る）にするか
    state: answered
    resolution: PDF（ベクタのまま）優先。2026-10-19 利用者が決定（「ベクトルデータもあるのでそちらで印刷できるならそれを優先したい」）。文書がもともとベクタで、ラスタ化はプリンタの解像度でプリンタがする方がよい。PWG Raster は PDF を受けないプリンタの後ろ盾。残る点は pdfbdf が書けない命令を含む文書を自動で Raster に落とすか（案は既定で警告のみ、キューの設定 raster-if-lossy で落とす）
  lossy-pdf-fallback:
    text: FILTER や Canvas 固有の合成など pdfbdf が書けない命令を含む文書を、auto のときに自動で Raster に落とすか。案は既定で警告のみ（ベクタ優先）、キューの設定 raster-if-lossy で落とす
    state: open
  server-shape:
    text: サーバーを bdf printd のサブコマンドにするか cmd/bdfprintd の別コマンドにするか。推奨は別コマンド（cmd/bdf を常駐の依存で重くしない）
    state: open
  persistence:
    text: スプールの永続化をファイルだけにするか、組み込みの KV を使うか。推奨はファイルだけ
    state: open
  accept-converter-inputs:
    text: サーバーが converter の入力（PDF、Office、画像 …）を受けて変換してから印刷するか。推奨は受ける（「何でも紙にする」入口）
    state: open
  ipp-server-priority:
    text: サーバーを IPP プリンタとして見せる段階（print-m4）を m2 の直後に前倒しするか。Windows の他社製ドライバの更新停止（2027-07）が近いなら価値がある
    state: open
  windows-os-path:
    text: Windows の OS 経由の経路を winspool の RAW 素通し（IPP クラスドライバに PDF / PWG Raster を渡せるか要検証）にするか、GDI の StartDoc / StretchDIBits に描いた画像を渡す（どのドライバでも動く）か
    state: open
  password-storage:
    text: 暗号化文書のパスワードを、サーバーの鍵で暗号化して制御ファイルに置く（再起動後も流せる）か、メモリにだけ持つ（再起動で pending-held、理由 password-required）か
    state: open
  package-name:
    text: 最上位のパッケージ名を print/ にするか printing/ にするか。print は組み込み関数と同名だがパッケージ名が隠すだけで害はない
    state: open
  vector-writers:
    text: PDF 以外のベクタの書き手の順。推奨は PostScript → EMF（Windows の OS 経由が要るなら先）→ HP-GL/2（CAD の現場があれば）→ OpenXPS（Universal Print を扱うとき）。PCL XL と各社の PDL は作らない
    state: open
  remote-proxy:
    text: NAT の向こうの拠点のプリンタのために置く代理を、独自の「上流から取りに行く」型にするか、IPP INFRA（Fetch-Job / Fetch-Document）の操作に合わせるか
    state: deferred
facts:
  layers:
    ticket: 何を、何部、どの用紙に、両面か、モノクロか、どのレイヤーを省くか。IPP の属性の名前
    spool: 受け付け、永続化、キュー、状態機械、再送、履歴、アカウンティング。bdf print はメモリ上、サーバーはディスク
    destination: プロトコル（IPP、OS のスプーラ、9100、LPD、USB、シリアル）× 文書形式（PWG Raster、PDF、URF、PCLm、PDL）
  goals:
    g1: bdf print で手元の 1 台に .bdf を、OS のドライバなしに Go だけで印刷する
    g2: Windows / macOS / Linux で同じコード。cgo なし
    g3: 'プリントサーバー: 複数のキュー、再起動をまたぐスプール、CLI と HTTP API。後に IPP プリンタとして見える'
    g4: '帳票の印刷指示が通る: 部数・丁合・両面・用紙（JIS B・はがき・封筒）・トレイ・モノクロ・ページ範囲・合わせ方・SkipRoles・仕上げの素通し'
    g5: 失敗の区別と再送、二重印刷の防止、理由の表示
    g6: 新しいプロトコル（IPP）から始める
    g7: ラベル・レシート・連帳への道を塞がない（文書形式 × 搬送路の抽象）
  formats:
    pwg_raster: 'image/pwg-raster。IPP Everywhere 必須、Mopria。ページごとに 1796 バイトのヘッダー＋行単位の RLE。sgray_1 / sgray_8 / srgb_8。pwg-raster-document-resolution-supported、-type-supported、-sheet-back（裏面の向き）'
    pdf: application/pdf。pdfbdf。ベクタのまま、ジョブが小さく、文字と線はプリンタの解像度で出る。絵はプリンタの解釈器次第。第 1 の形式
    urf: image/urf。AirPrint。UNIRAST ヘッダー＋ページごと 32 バイト。urf-supported（W8、SRGB24、DM1〜4、RS300、IS1 …）
    pclm: application/PCLm。Mopria / Wi-Fi Direct。帯の画像を並べた制限付き PDF
    raw: application/octet-stream。9100 と同じ素通し。後の段階
    default_policy: auto = PDF があればそれ（ベクタのまま）、なければ PWG Raster、どちらも無ければ URF → PCLm。キューごと・ジョブごとに -format で上書き。Raster に落とす場面は、プリンタが PDF を受けない、pdfbdf が書けない命令を含む文書でビューアの絵を優先したい（raster-if-lossy）、機種の PDF 解釈器に癖がある、の 3 つ
    vector_formats:
      driverless: ベクタのまま渡せるのは PDF だけ（URF / PWG Raster / PCLm はラスタ）
      direct_pdls: PostScript 3（公開。業務機の純正 PS と互換 KPDL / BR-Script、大判）、PCL XL（HP。仕様は非公開扱い、機種ごとの癖）、PCL 5（文字＋ラスタ＋HP-GL/2）、HP-GL/2（公開。大判プロッタの共通語）、OpenXPS（ECMA-388。Windows の v4 と Universal Print）、各社の PDL（LIPS / ESC/Page / ART / RPCS / NPDL / PRESCRIBE。非公開）、PDF/VT と JDF（商業印刷）
      os_pipelines: Windows は GDI（v3 はそのまま、v4 と IPP クラスドライバは MXDC が XPS に変換。ベクタのまま）と XPS（IPrintDocumentPackageTarget）。RAW は v3 の PS / PCL 素通し用で v4 では 0 バイト。XPS_PASS はパイプラインを飛ばす直送（使わない）。macOS / Linux は CUPS に PDF（PS 機には pdftops がベクタのまま、透明は画像）
      decision: 第 2 のベクタ経路は PostScript の書き手（vector/psbdf。pdfbdf の構造を写す）。Windows の OS 経由は GDI（＋GDI+）に描く（EMF の書き手 vector/emfbdf を PlayEnhMetaFile で再生、converter/emf で往復テスト）。HP-GL/2 の書き手（vector/hpglbdf）は CAD の出口として価値が高く、converter/hpgl で往復テスト。OpenXPS の書き手は Universal Print を扱うとき。PCL XL と各社の PDL は作らない（PS エミュレーション、Raster、PCL 5 ラスタで逃げる）
      flatten: vector/internal/flatten。透明グループ・ソフトマスク・ブレンド・FILTER の部分だけを画像にし残りをベクタのまま残す。pdfbdf の影の手法の一般化。PS・HP-GL/2・EMF が共有
      selection_order: 搬送路と独立に、プリンタが名乗る形式の中から PDF → PS → PWG Raster → URF → PCLm → PCL 5 ラスタ
    pdf_details:
      delegated: copies、sheet-collate、sides、print-scaling、page-ranges は IPP の属性でプリンタに任せる。unsupported なら送信側で肩代わり（ページの選択を pdfbdf に足す、部数は文書を繰り返す）
      layers: プレ印刷用紙向けのレイヤー省略は pdfbdf の SkipRoles
      fonts: pdfbdf が埋め込む。名前で参照するフォントは送信側のマシンで探す。埋め込みを許さないフォントはアウトライン
      encrypted: pdfbdf はまだ PDF の暗号化を書かないので、ipps の上を平文の PDF で送る。スプールには暗号化のまま置く
      fidelity: pdfbdf は書いた PDF を読み直して同じ絵になることをラスタライザで確かめている（Ghostscript と Quartz でも）。実機の解釈器の差は機種ごとに記録
    raster_details:
      when: プリンタが PDF を受けないとき、raster-if-lossy のとき、機種の表で Raster が既定のとき、-format pwg-raster のとき
      resolution: printer-resolution-supported から。既定 600 dpi（モノクロ）/ 300 dpi（カラー）
      mono: print-color-mode=monochrome で sgray_8。線画で black_1 / sgray_1 があれば Bilevel＋AntialiasOff
      duplex_back: pwg-raster-document-sheet-back（normal / flipped / rotated / manual-tumble）に従って裏面を回して描く
      copies: copies-supported が 1 の機種では送信側で繰り返し、丁合もその中で
      scaling: fit / actual / shrink＋自動回転。既定は shrink＋自動回転
      size_note: 600 dpi カラーの A4 は生で 100 MB 超（RLE で縮む）、2 値は 4 MB。PDF の帳票は 100 KB 程度
  ipp:
    operations: Validate-Job、Create-Job → Send-Document（last-document）または Print-Job、Get-Printer-Attributes、Get-Jobs、Get-Job-Attributes、Cancel-Job、Hold-Job / Release-Job、Identify-Printer。任意で Create-Printer-Subscriptions＋Get-Notifications（ippget）。CUPS 固有の CUPS-Get-Printers
    transport: HTTP の chunked で描きながら送る。Expect 100-continue。ipps を優先。プリンタの証明書は自己署名が普通なので初回の指紋を記録（CUPS の TrustOnFirstUse と同じ）。-insecure は明示のときだけ
    auth: なし / Basic（uri-authentication-supported）。OAuth は後
    discovery: DNS-SD の _ipp._tcp / _ipps._tcp を mDNS と単一 DNS で。TXT の rp、pdl、URF、TLS、Color、Duplex、UUID、adminurl、ty、kind、air。URL の直接指定 ipp://host:631/ipp/print、CUPS は ipp://localhost:631/printers/<名前>、CUPS 3 の cups-local はドメインソケット
    capabilities: Get-Printer-Attributes をキューの設定として保存し、printer-config-change-time で更新を検知
    status: printer-state（idle / processing / stopped）と printer-state-reasons（media-empty、media-jam、toner-low、door-open …）を定期に取る
    completion: Get-Job-Attributes のポーリングで job-state が 7・8・9 になるまで
    dedupe: 送る前に job-id を記録。再開時に Get-Jobs（which-jobs=completed 含む）で確かめ、プリンタが知っていれば再送しない
  spool:
    layout: 'spool/jobs/<id>/ に制御ファイル（JSON: チケット、出力先、状態、プリンタ側の job-id、時刻、警告）と文書（.bdf のまま。内容アドレスで 1 回）'
    queue: 出力先ごとに 1 本。FIFO に job-priority と job-hold-until。一時停止と再開、並べ替え、別のキューへの移動
    class: 複数の出力先を 1 キューに。空いている方に流す（負荷分散）か順に試す（故障時の切り替え）。CUPS のクラスと同じ
    retry: 接続の失敗は指数バックオフで pending のまま。プリンタが stopped ならキューを止めて見張り idle で再開。プリンタ側で aborted になったジョブは自動で再送しない（利用者が retry）
    render_cache: 既定で残さない。キューごとに「描いた Raster を残す」を選べる
    retention: 完了・中止の制御ファイルは一定期間残し、参照の無くなった文書は消す。件数・バイト数・日数の上限
    accounting: 利用者・キュー・印象数（job-impressions-completed）・用紙・時刻を JSON Lines に追記
    local: bdf print は同じ実装をメモリ上で使い 1 ジョブの完了まで待つ。-spool dir でディスクのスプールに置いて帰る
  server:
    process: 常駐。設定は YAML＋環境変数
    http_api: ジョブの投入（multipart で文書＋チケット、または参照）、一覧、詳細、取消、保留、再送、キューとプリンタの一覧、発見。既定は localhost。外に開けるときは TLS とトークンとキューごとの許可
    cli: bdf print -server …、bdf jobs、bdf printers
    ipp_server_later: キューごとに IPP Everywhere のプリンタとして見せ DNS-SD で広告。受ける形式は PDF・PWG Raster・URF（macOS の AirPrint に要る）・JPEG・PNG と converter の形式。Windows の IPP クラスドライバ / AirPrint / CUPS からドライバなしで投げられる
    remote_sites: 直接届くなら IPP 直結。NAT の向こうは拠点側に代理（同じサーバーを上流から取りに行く設定で）
    observability: 構造化ログ（文書の中身は書かない）、任意の /metrics（Prometheus のテキスト）、状態の HTTP ページ
  platforms:
    windows: 直結の IPP はそのまま。WPP の環境では IPP プリンタしか無い。OS 経由は GDI（＋GDI+）にベクタのまま描く（golang.org/x/sys/windows の syscall、cgo なし。EMF の書き手を PlayEnhMetaFile で再生）。v3 はそのまま、v4 と IPP クラスドライバは MXDC が XPS に変換。v3 には winspool の RAW で PS を素通しする経路も。XPS_PASS は使わない。一覧は EnumPrinters、チケットは DEVMODE
    macos: AirPrint 直結（URF か PDF）。CUPS に IPP（localhost:631）、一覧は CUPS-Get-Printers。mDNS は自前（Bonjour と共存）
    linux: 直結。CUPS 2.x に IPP（localhost:631 か /run/cups/cups.sock）、CUPS 3 の cups-local はドメインソケット。USB は ipp-usb の localhost。mDNS は Avahi と 5353 を共有（SO_REUSEADDR / SO_REUSEPORT）
    build: print/internal/osspool に OS ごとの build tag。cmd/bdfwasm と converter/all から import しない。CI は 3 OS の go vet と go test
  budgets:
  - 1 ジョブの大きさ、ページ数、印象数に上限。描画は imagebdf の限界
  - 同時に描くジョブ（キューごとに 1、全体で CPU 数）と同時の接続数
  - IPP の応答の属性数とバイト数に上限。偽の DNS-SD 応答で止まらない
  - スプールの合計容量。超えたら受け付けを断る
  package_layout:
    print: チケット、出力先のインターフェース、形式の選択、用紙の名前（PWG 5101.1）
    print/ipp: メッセージの読み書き、クライアント、DNS-SD、CUPS 固有の操作
    print/raster: PWG Raster の書き手。後で URF と PCLm
    print/spool: ジョブ、キュー、状態機械、再送、履歴、アカウンティング
    print/server: HTTP API、設定、監視。後で IPP サーバーと DNS-SD の広告
    print/internal/osspool: GDI と winspool、CUPS。OS ごとの build tag
    vector/psbdf: PostScript 3 の書き手（pdfbdf の兄弟）
    vector/emfbdf: EMF の書き手（Windows の GDI に再生）
    vector/hpglbdf: HP-GL/2 ＋ HP RTL の書き手（大判、CAD）
    vector/xpsbdf: OpenXPS の書き手（後）
    vector/internal/flatten: 透明の平坦化の共通部
    cmd: cmd/bdf の print / printers / jobs と、cmd/bdfprintd（または bdf printd）
  delivery:
    proposed_order:
    - print-m1 IPP で手元／LAN の 1 台に印刷（bdf print）。PDF（既定、ベクタのまま）と PWG Raster（後ろ盾）、形式の自動選択、DNS-SD、ipps、主要なチケット
    - print-m2 スプールとサーバー。キューと組、再送と二重印刷の防止、履歴、HTTP API と CLI、監視、converter の入力、examples/print-server
    - print-m3 PostScript の書き手（第 2 のベクタ経路）と平坦化、URF と PCLm、Windows の GDI（EMF の書き手と再生、v3 の RAW）、一覧、9100 と LPD の素通し、IPP USB。CAD の現場があれば HP-GL/2 の書き手
    - print-m4 サーバーを IPP Everywhere のプリンタとして見せる。DNS-SD の広告、受ける形式、PWG の自己認証テスト、拠点の代理
    - print-m5 ラベル・レシート・連帳の PDL と USB・シリアル・Bluetooth の搬送路
    independence: m1 と m2 は独立に価値がある。m3 以降は現場の機種で順を変える
  verification:
    unit: IPP の符号化の往復と fuzz、PWG Raster の書き手（自前の読み手で戻して imagebdf の画像と一致、golden）、チケット → 属性、スプールの状態機械（落ちた時点ごとの再開）
    integration: ippeveprinter（libcups、Ubuntu の cups-ipp-utils）を偽のプリンタに。自前の偽プリンタ（Go）で依存なしのテスト。Ubuntu の runner の CUPS に localhost:631 経由
    manual: 国内で多い機種（Canon、Epson、Brother、Kyocera、Ricoh、Fujifilm BI、Konica Minolta、HP）で PDF（ベクタ）と PWG Raster、両面、JIS B5、はがき、トレイを確かめ、PDF の絵が Raster の絵と違う機種は癖として記録し必要なら Raster を既定に
    m4: PWG の IPP Everywhere 自己認証（ippeveselfcert、ipptool）、Windows の IPP クラスドライバ・macOS の AirPrint・CUPS からの印刷
  risks:
  - 実機の IPP 実装の癖（copies-supported が 1、media-col-database が巨大、Get-Notifications 非対応、自己署名証明書の期限切れ）。機種ごとの表で吸収する
  - プリンタの PDF 解釈器の差（フォント、透明、ブレンド）で絵が変わる。pdfbdf は既にフォームをページ座標で定義して Ghostscript / Quartz の差を吸収している。機種ごとに確かめ、癖のある機種は Raster を既定にする
  - Raster に落ちる機種ではカラーの大量印刷のジョブが大きい。解像度の既定（カラー 300 dpi）とモノクロで逃がす
  - Windows の OS 経由は GDI に描くので、埋め込みフォントを AddFontMemResourceEx でプロセスに足すか、文字をパスにする必要がある。α とグラデーションは GDI+ か平坦化
  - mDNS は OS の責務と重なる（Bonjour、Avahi）。5353 の共有と、企業の網での多播の遮断。単一 DNS の DNS-SD と URL の直接指定を常に残す
  - 調査の一次資料（pwg.org、learn.microsoft.com）が作業環境から開けず、日付と必須形式は二次資料による（system:ipp-driverless の unverified）
