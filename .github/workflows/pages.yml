name: pages
# Builds the demo site (examples/viewer/site.mjs) and publishes it on GitHub
# Pages from main: the viewer with the converters built as wasm, which
# convert the files opened on the page inside the browser, and the
# documentation as HTML (docs/). Pull requests build and test the site
# without publishing it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # Free fonts that stand in for the ones Office documents name
      # (Liberation for Arial, Times New Roman and Courier New, Carlito for
      # Calibri, Caladea for Cambria, IPAex for Japanese, DejaVu for symbols),
      # published with their licenses. The page fetches the ones a document uses.
      - name: fonts
        run: |
          pkgs="fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-ipaexfont-gothic fonts-ipaexfont-mincho fonts-dejavu-core"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $pkgs
          dir="$RUNNER_TEMP/fonts"
          mkdir -p "$dir"
          for pkg in $pkgs; do
            dpkg -L "$pkg" | grep -E '\.(ttf|otf|ttc)$' | xargs -r cp -L -t "$dir"
            cp "/usr/share/doc/$pkg/copyright" "$dir/$pkg.copyright.txt"
          done
          ls -l "$dir"
      - run: npm ci
      - run: npm run site
        env:
          BDF_SITE_FONTS: ${{ runner.temp }}/fonts
      - run: node test/site.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: examples/viewer/.site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
