id: milestone:form-m2
type: milestone
title: form-m2 — Word と PowerPoint のテンプレート、BDF から PDF への書き出し
summary: 2 つ目の実装のまとまり。Excel と同じタグとデータで Word（流れるページ）と PowerPoint（固定のスライド）のテンプレートを穴埋めし、できた .bdf を PDF に書き出す。2026-10-14
  に実装し、Go のテスト・fuzz・Ghostscript と Quartz での描画確認・自前の PDF 読み込みでの往復が通った。利用者向けの説明は docs/forms.ja.md、設計は docs/design.md
  §3.34・§3.35。
lifecycle: active
authority: authored
scope:
  milestone: form-m2
  input: docx, pptx
  output: bdf, pdf
constraints:
- 出力は .bdf。穴埋め済みの Office ファイルは作らない。PDF は .bdf から書く
- タグとデータは Excel と共通。計算はしない（Word と PowerPoint に数式はない）
- Word の流れる文章は組版エンジンに任せる。PowerPoint の図形は動かさない
non_goals:
- フォントの対応規則ファイル（別トラック）
- QR・バーコード、列方向の繰り返し
- タグ付き PDF・PDF/A・PDF の暗号化
- PDF 読み込み側（converter/pdf）のパターン行列の不具合の修正（別タスクに切り出した）
capabilities:
  pptx-fill:
    state: implemented
    about: capability:form/pptx-fill
  docx-fill:
    state: implemented
    about: capability:form/docx-fill
  pptx-refit:
    state: implemented
    about: capability:drawingml/refit
  pptx-table-continuation:
    state: implemented
    about: capability:form/pptx-table-continuation
  section-lifting:
    state: implemented
    about: capability:form/section-lifting
  pdf-export:
    state: implemented
    about: capability:pdfbdf/write
  bdf-pdf-cli:
    state: implemented
    about: capability:cli/pdf
facts:
  section_units:
    pptx: 同じ段落＝文字、同じ図形の別段落＝段落、表の同じ行＝行、別の行＝枠（slots）、同じスライドの別図形＝スライド、別スライド＝その間のスライド
    docx: 同じ段落＝文字、同じ入れ物（本文・セル・テキストボックス）の別段落＝段落と表、表の同じ行＝行、別の行＝枠。| pages は改ページつきの繰り返し
    lifting: 繰り返し方を書いた区間はタグが同じ段落（セル）にあっても行・段落・スライドを繰り返す。Excel にも入れた。逆の区間にも繰り返し方を書ける
  pptx_variables: '{{_slide}} / {{_slides}} は a:fld にして描くときに値を入れる（表の続きでスライドが増えた後の番号）'
  pdf_structure: グループ・ソフトマスク・共有レイヤーのフォームはすべてページの既定の座標系で定義し、変換をフォームの中に持つ。Quartz がフォーム内のパターン行列をページ基準で読み、別の座標系で設定したソフトマスクをページの矩形で切るため
  pdf_text: CID フォント（Identity-H）＋ ToUnicode。グリフ番号を保つ刈り込み。埋め込めないフォントはアウトライン＋ ActualText
  reader_bug_found: converter/pdf は convertPage で base を 2 回掛けていて、水平でないグラデーションのパターンがずれる。Chrome の PDF と Ghostscript
    で確認。1 行の修正を確かめたうえで別タスクにした（task_8de9a90e）
acceptance:
  pptx-forms:
    text: 3 つの形態（1 枚の帳票、行が増えて続きのスライドに流れる表、ページごとのデータで複製する 10 行の伝票）の .pptx が、Excel と同じ JSON で穴埋めされる。文字の自動調整が効き、画像が差し替わる
    verified_by:
    - pptx-unit
    - office-form-tests
    - office-golden
  docx-forms:
    text: 同じ 3 形態の .docx が同じ JSON で穴埋めされる。表は見出し行を繰り返して次のページへ流れ、ヘッダー・フッター・テキストボックスも穴埋めされる
    verified_by:
    - docx-unit
    - office-form-tests
    - office-golden
  pdf:
    text: testdata の全文書が PDF になり、Ghostscript がエラーなく読んで imagebdf と同じ絵を描く。文字は検索できる。同じ文書からは同じバイト列ができる
    verified_by:
    - pdf-roundtrip
    - pdf-sweep
    - pdf-viewers
  unchanged:
    text: 既存の pptx・docx・xlsx の出力は変わらない
    verified_by:
    - fixtures-identical
verification:
  pptx-unit:
    state: passed
    method: unit
    test: go test ./converter/pptx (TestFill*, TestInspectFields, FuzzFill 40 秒)
    authority: observed
    evidence:
      path: converter/pptx/template_test.go
      locator: 値・段落・表の行と枠・スライド・画像・自動調整・表の続き・誤りの報告・上限
  docx-unit:
    state: passed
    method: unit
    test: go test ./converter/docx (TestFill*, TestInspectFields, FuzzFill 40 秒)
    authority: observed
    evidence:
      path: converter/docx/template_test.go
      locator: 値（分かれた run・ブックマーク・ハイパーリンク）・ブロック・表・改ページ・ヘッダーとテキストボックス・画像・誤りの報告
  office-form-tests:
    state: passed
    method: integration
    test: TestFillOffice (form)
    authority: observed
    evidence:
      path: form/form_test.go
      locator: 6 つのテンプレートを test/xlsx/data の JSON で穴埋め。.bdft 経由の結果が元のテンプレートの結果とバイト単位で同じ
  office-golden:
    state: passed
    method: integration
    test: npm run test:golden（Docker node:24-bookworm linux/amd64）と TestGoldenPages
    authority: observed
    evidence:
      path: testdata/golden/form-pptx-rows-4.png
      locator: form-docx-fixed-1, form-docx-rows-2, form-pptx-fixed-1, form-pptx-rows-4, form-pptx-pages-3
  pdf-roundtrip:
    state: passed
    method: integration
    test: go test ./vector/pdfbdf (TestRoundTrip, TestGroupsRoundTrip, TestText, FuzzWrite 60 秒)
    authority: observed
    evidence:
      path: vector/pdfbdf/pdfbdf_test.go
      locator: 13 文書を PDF にして converter/pdf で読み直し、imagebdf の絵を比べる。グラデーションのある pptx/basic の 3 ページ目だけ読み込み側の不具合のため許容を広げている
  pdf-sweep:
    state: passed
    method: manual
    test: testdata の 109 文書を bdf pdf → Ghostscript 10 → bdf render と比較
    authority: observed
    evidence:
      path: vector/pdfbdf/pdfbdf.go
      locator: エラー 0 件。差の大きいページは細い線と小さな文字のアンチエイリアスの違いだけ（スクリプトはリポジトリに入れていない）
  pdf-viewers:
    state: passed
    method: manual
    test: ソフトマスク・グループ・グラデーションの小さな PDF を Ghostscript と Quartz（sips）で描いて突き合わせ
    authority: observed
    evidence:
      path: vector/pdfbdf/content.go
      locator: stream.base のコメントに Quartz の挙動を記録。9 ケースが両方で一致
  fixtures-identical:
    state: passed
    method: integration
    test: GOARCH=amd64 のビルドで pptx・docx・xlsx の 14 文書と xlsx の帳票 3 文書を再生成して cmp
    authority: observed
    evidence:
      path: testdata/pptx/basic.bdf
      locator: すべてバイト単位で同じ
