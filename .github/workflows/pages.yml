name: pages
# Builds the demo site (site/build.mjs) and publishes it on GitHub
# Pages from main: the viewer with the converters built as wasm, which
# convert the files opened on the page inside the browser, and the
# documentation as HTML (docs/). Pull requests build and test the site
# without publishing it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FONT_PACKAGES: fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-ipaexfont-gothic fonts-ipaexfont-mincho fonts-dejavu-core
      STIX: 2.13b171
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/go
        with:
          go-version: "1.27.3" # the patch with the fix of GO-2026-6809 (crypto/x509), after 6617 and 6612/6613, which the runner's cache lacks; the same as ci.yml and publish.yml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # Free fonts that stand in for the ones Office documents name
      # (Liberation for Arial, Times New Roman and Courier New, Carlito for
      # Calibri, Caladea for Cambria, IPAex for Japanese, DejaVu for symbols,
      # STIX Two Math for Cambria Math), published with their licenses. The
      # page fetches the ones a document uses. They are kept in the cache of
      # Actions: the Ubuntu mirror of the runners now and then sends the
      # packages at 40 kB/s, which took minutes.
      - id: fonts-key
        run: |
          . /etc/os-release
          echo "key=site-fonts-$ID-$VERSION_ID-$(echo "$FONT_PACKAGES $STIX" | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - id: fonts-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fonts
          key: ${{ steps.fonts-key.outputs.key }}
      - name: fonts
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $FONT_PACKAGES
          dir="$RUNNER_TEMP/fonts"
          mkdir -p "$dir"
          for pkg in $FONT_PACKAGES; do
            dpkg -L "$pkg" | grep -E '\.(ttf|otf|ttc)$' | xargs -r cp -L -t "$dir"
            cp "/usr/share/doc/$pkg/copyright" "$dir/$pkg.copyright.txt"
          done
          # STIX Two Math, the formula font: formulas are laid out with
          # the parameters and glyph variants of its OpenType MATH table
          stix=stixfonts-$STIX
          curl -fsSL -o "$RUNNER_TEMP/stix.zip" "https://github.com/stipub/stixfonts/archive/refs/tags/v$STIX.zip"
          unzip -j -o "$RUNNER_TEMP/stix.zip" "$stix/fonts/static_otf/STIXTwoMath-Regular.otf" -d "$dir"
          unzip -p "$RUNNER_TEMP/stix.zip" "$stix/OFL.txt" > "$dir/STIXTwoMath.OFL.txt"
          ls -l "$dir"
      - run: npm ci
      - run: npm run site
        env:
          BDF_SITE_FONTS: ${{ runner.temp }}/fonts
      - run: node test/site.mjs
      - if: "!cancelled()"
        uses: ./.github/actions/go-save
        with:
          path: ${{ steps.go.outputs.path }}
          key: ${{ steps.go.outputs.key }}
          since: ${{ steps.go.outputs.since }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
