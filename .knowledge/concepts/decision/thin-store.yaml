id: decision:thin-store
type: decision
title: 保存は SDK を使わない薄い層（store/）を通し、約束は楽観ロックの 5 操作と Blob だけにする
summary: >-
  スプール（と後のサーバー機能）の保存を、外部キーなしの Get・Insert（無いときだけ）・Update（版が同じときだけ）・Delete（墓標）・
  Scan（更新順）と、書いた後に変えない大きなバイト列の Blob だけの約束に置く。並べ替えと絞り込みは使う側がメモリで行う。
  ドライバは各保存先を HTTP で薄く話し（AWS の SigV4 と資格情報も自前）、SDK を同梱しない。既定は bbolt の 1 ファイル、
  その上に S3 互換のオブジェクトストレージ、GCS・Azure Blob・DynamoDB・RDB。叙述は knowledge-inputs/print-plan/store.ja.md。
  2026-10-19 に後へ回した（利用者「store レイヤーは一旦頑張らずに bbolt 前提で良い」）。print-m2 は bbolt を直接使い、
  bbolt に触るのを print/spool/db.go だけにして、この案に替える位置を残す。
lifecycle: proposed
authority: authored
aliases:
- store
- 薄い保存層
- thin storage layer
constraints:
- 約束は Get、Insert、Update、Delete、Scan、Purge と Blob の Put・Open・Delete・List だけ。外部キー、表をまたぐトランザクション、副索引、更新順以外の問い合わせは持たない
- 1 つのキーの上の条件付き書き込みは線形化可能。Scan は遅れてよく、使う側が重なりの窓と (Key, Ver) の重複除去で吸収する
- 値は 256 KiB まで（DynamoDB の 400 KB に収まる）。大きいものは Blob
- 条件が外れた 412 と同時の書き込みの 409 はどちらも ErrConflict
- 条件付きのヘッダーを黙って無視する保存先を使わない。オブジェクトストレージは起動時に実際の振る舞いを確かめ、外れたら起動しない
- 各社の SDK を同梱しない。go.mod に足すのは bbolt だけ
facts:
  rejected:
    go_cdk: gocloud.dev の blob と docstore。SDK を同梱し、blob に If-Match の置き換えが無く、docstore はオブジェクトストレージと RDB を持たない
    gokv: 版も比較交換も一覧も無い
    sdk_per_service: AWS SDK for Go v2 などを使う案。バイナリが重くなり、束ねる層は結局要る
    content_addressed_documents: 文書を内容アドレスで共有する案。複数の持ち主が同時に消すと、消した Blob を指すジョブができる。ジョブごとに置く
  mapping: 'bbolt はバケットと連番の索引。S3 互換は If-None-Match: * / If-Match と ListObjectsV2。GCS は generation。Azure Blob は ETag。DynamoDB は ConditionExpression と GSI（tbl, upd）。RDB は 1 つの表 bdf_rows(tbl, k, ver, upd, del, val) と UPDATE … WHERE ver=?'
  auth: AWS は環境変数、credential_process、共有ファイル、Web identity、コンテナ、IMDSv2 の順。GCS はメタデータサーバーとサービスアカウントの鍵（JWT RS256）。Azure は SAS、共有キー、マネージド ID、クライアントシークレット
  cost_note: S3 Standard の概算で、1 日 1000 ジョブなら書き込みと保存を合わせて月数ドル。サーバーも容量の計画もバックアップも要らない
  phases:
  - print-m2 では作らない（bbolt を直接使う。db.go だけが bbolt に触る）
  - 作るときは store（約束、storetest）、mem、bolt（db.go の載せ替え）、s3（S3 互換）と awsauth、S3 の偽物。スプールのジョブに借りを足す
  - 続けて gcs、azblob、dynamodb、sql。複数台と Lambda
open_questions:
  package-location:
    text: 汎用の store/ に置くか、print/spool/store に閉じるか
    state: open
    resolution: 暫定で store/（印刷以外のサーバー機能も使える）
  rdb-access:
    text: RDB を database/sql とビルドタグで選ぶ純 Go のドライバ（pgx、MySQL、SQLite）で話すか、HTTP で SQL を受けるもの（Amazon RDS Data API、PostgREST、libSQL / Turso、Neon）で話すか
    state: open
  next-drivers:
    text: S3 互換の次に足すドライバの順（GCS と Azure Blob、DynamoDB、RDB）
    state: open
relations:
- relation: informed_by
  to: system:conditional-storage
- relation: serves
  to: requirement:print
history:
  deferred:
    summary: 2026-10-19 利用者「store レイヤーは一旦頑張らずに bbolt 前提で良い」。print-m2 から外し、案として残す（lifecycle proposed）。いつ作るかは m2 の後（requirement:print の scale-out）
  asked:
    summary: 2026-10-19 利用者「bbolt、Dynamo、その他の KVS を包む仕組みは無いか。SDK を同梱すると思うので HTTP の API を呼ぶ薄い仕組みがよい。外部キーなしの insert・update・select（更新順のみ）・delete ができれば多くのストレージに対応できるはず」「KVS だけでなく RDB も含めてよい」「楽観ロックのオブジェクトストレージに対応できれば費用も運用の楽さもだいぶ上がる」。既存の仕組みを調べ（system:conditional-storage）、約束と写し方を store.ja.md に書いた
