id: milestone:print-m2
type: milestone
title: print-m2 — スプールとプリントサーバー（print/spool、print/server、bdf printd、bdf jobs）
summary: >-
  印刷の 2 つ目の実装のまとまり。ジョブを受け付けて組み込みの KV（bbolt）の 1 ファイルに永続化し、キュー（と複数のプリンタの組）ごとに
  順に流し、失敗を再送し、再起動をまたいで二重に刷らず、履歴と実績を残すスプールと、それを HTTP API・CLI・状態のページで見せる
  bdf printd。変換器の入力を受けて変換してから印刷する。保存は yuruidb（decision:thin-store。bbolt ドライバのレコードと bbolt の Blob の文書を
  同じ spool.db に、写しは Store.Backup）を通し、yuruidb に触るのは print/spool/store.go だけにする。叙述の実装案は knowledge-inputs/print-plan/print-m2.ja.md（2026-10-19）。
lifecycle: active
authority: authored
scope:
  milestone: print-m2
constraints:
- ジョブの状態は IPP の job-state と job-state-reasons の語彙（無いものだけ bdf- を付ける）。m4 で IPP サーバーとして見せるとき写すだけで済む
- サーバーは bdf printd（cmd/bdf のサブコマンド）。cmd/bdfprintd は作らない（2026-10-19 利用者）
- 永続化は組み込みの KV（go.etcd.io/bbolt）の 1 ファイル spool.db。ジョブの記録、文書（受けたままと変換した .bdf。ジョブごと、yuruidb の bbolt の Blob）、連番、実績、キューの状態、証明書の指紋を全部入れる。設定（YAML）だけ別のファイル（2026-10-19 利用者「組み込みの KV で良い」）
- 保存は yuruidb を通す（2026-10-20 利用者「作れそうということなので実装の開始をお願いしたい」）。コレクションは jobs・done・meta・queues・trust、文書は Blob の docs（<10 桁の id>.original、<10 桁の id>.bdf）。yuruidb を import するのは print/spool/store.go だけ。ジョブの借りは作らない（1 プロセスなので要らない）
- 写しは Store.Backup でいったんローカルの一時ファイルに書いてから流す（bbolt の長い読み取りがファイルを広げる書き込みを待たせるため）
- 1 つの spool.db を開けるのは 1 プロセス（bbolt のファイルのロック）。共有のファイルシステムに置かない
- 処理は短い段（convert・send・watch）と次に動かす時刻。記録に書くのは状態・理由・段が変わったときだけ。再起動の後は send と watch で残ったジョブを照合する
- 二重に刷らない。Create-Job の応答の直後、文書を送る前にプリンタの job-id を記録し（print.Options.OnCreated）、送り終えた印を書き（OnSent）、持ち主が替わったジョブ（再起動の後を含む）は Get-Job-Attributes と Get-Jobs で照合してから続けるか再送する
- プリンタ側で aborted になったジョブは自動で再送しない
- プリンタの中に溜めるジョブの数 max-inflight の既定は 2（2026-10-19 利用者）。送るのは 1 ジョブずつ順番どおり
- 既定は loopback に束縛。loopback 以外は TLS とトークンが無ければ起動しない
- ログに文書の中身・パスワード・トークンを書かない
- spool は converter に依らない（変換はインターフェース spool.Converter として受ける）。converter に依るのは cmd/bdf と examples だけ
- 足す依存は github.com/shibukawa/yuruidb（と、それが引く go.etcd.io/bbolt、golang.org/x/sys）だけ。設定の YAML は既にある go.yaml.in/yaml/v3。/metrics は自前のテキスト
non_goals:
- IPP サーバーとして見せること、DNS-SD の広告（m4）
- Apple Raster、PCLm、PostScript、9100 と LPD（m3）
- サービスとしての登録（Windows の x/sys/windows/svc を含む）。前面のプロセスとして正しく動くことだけを受け持ち、常駐は systemd・launchd・NSSM・WinSW などの外の道具に任せる（2026-10-19 利用者「サービス化は別ツールもあるので自分自身で持たなくても良い」）
- 保存の層（オブジェクトストレージ・DynamoDB・RDB に置く薄い層。decision:thin-store）、複数台で 1 つのスプールを回すこと、Lambda で動かすこと（m2 の後）
- 設定の再読み込み（m2 は再起動で反映）
- 課金・部門管理・IC カードでの解放の運用
- bdf print -spool dir（スプールに直接置く。要件から外した）
