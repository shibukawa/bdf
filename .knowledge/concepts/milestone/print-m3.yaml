id: milestone:print-m3
type: milestone
title: print-m3 — 第 2 の形式と古い搬送路（vector/psbdf、Apple Raster と PCLm、9100 と LPD、IPP USB）
summary: >-
  印刷の 3 つ目の実装のまとまり。PDF を受けないプリンタ、IPP を話さないプリンタに届かせる。PostScript の書き手 vector/psbdf
  （Level 3、DSC、文字は Type 3 のフォント）と、透明な所だけを矩形の絵にする平坦化 vector/internal/flatten、AirPrint だけの機種の
  Apple Raster と Mopria だけの機種の PCLm の書き手、形式の順 PDF → PostScript → PWG Raster → Apple Raster → PCLm、9100 と LPD の
  搬送路 print/raw（bdf print、スプール、bdf printd）と二重に刷らない照合、IPP USB の機種をループバックの DNS-SD で見つけること。
  叙述の実装案は knowledge-inputs/print-plan/print-m3.ja.md（2026-10-20）。
lifecycle: active
authority: authored
scope:
  milestone: print-m3
constraints:
- PostScript は Level 3、DSC に従う。ページの外のものは setpagedevice を 1 つずつ stopped で囲む（持たないプリンタは飛ばす）
- 文字は Type 3 のフォント（使うグリフのアウトラインを setcachedevice の手続きに。1 つに 256 グリフ）。Type 42 と CFF は使わない（互換機の差）
- ファイルは 7 ビットのテキスト（画像と絵とフォントは ASCII85 の Flate、JPEG はそのまま DCTDecode）。行は 255 バイトまで、% で始まる行はデータに無い
- 透明は描けるところまでベクタで、描けない所（α、合成、α・合成・ソフトマスクのあるグループ、影、FILTER、α のある画像、α の止まりのグラデーション、パターン、円錐）は、その矩形だけを imagebdf.Region の絵にする（既定 300 dpi）。矩形の外はベクタのまま
- IPP では両面と用紙だけを PostScript に書き、ページは PWG Raster と同じ配置（raster.Fit）で用紙に置く。9100 と LPD ではチケットをファイルに書く（PostScript は setpagedevice、PDF は PJL）
- 9100 と LPD のプリンタは能力を聞けない。形式は URL か設定（既定 PostScript）。PDF には PJL の見出し（既定、pjl=false で外す）
- 二重に刷らない。プリンタが刷り始めうる所（9100 は最初のバイト、LPD は制御ファイル）の直前に「始めた」を記録し、その前で止まったら送り直し、後で止まったら bdf-duplicate-check で保留、送り終えたら刷ったとみなす
- 足す依存は無い（Ghostscript はテストと CI でだけ使う。無ければテストを飛ばす）
non_goals:
- HP-GL/2 の書き手（CAD の現場の声を待つ。flatten を共有して vector/hpglbdf に置ける）
- PCL XL と各社の PDL、PCL 5 のラスタ
- Windows の OS 経由（GDI・XPS）
- PJL による状態の取得（9100 の見張り）
- Type 42・CFF のフォントの埋め込み（Type 3 で困る解釈器が出たら psbdf.Options に足す）
