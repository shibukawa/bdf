acceptance:
  public-api:
    text: 新パッケージだけを import して、SVG のバイト列から要素木（名前・属性・子・親・id 表）、 適用済みスタイルシート、警告を得られる。transform・色・長さ・数値列は単独の関数でも読める（パスデータは
      svg-m1 では d 属性の文字列のまま）
    scope:
      milestone: svg-m1
    verified_by:
    - unit-tests
  no-rasterizer-import:
    text: 新パッケージの import グラフに raster/imagebdf が含まれない（go list -deps で確認）
    scope:
      milestone: svg-m1
    verified_by:
    - deps-check
  imagebdf-unchanged:
    text: raster/imagebdf が新パッケージを使うように書き換えた後、golden テストとショートカット検査がピクセル差なしで通る
    scope:
      milestone: svg-m1
    verified_by:
    - golden
  limits-kept:
    text: 深さ・要素数・照合回数の上限が既定で現状と同じ値で効き、超過時は警告つきで読めた分を返す
    scope:
      milestone: svg-m1
    verified_by:
    - unit-tests
  tests-moved:
    text: TestCSSAndColors・TestSVGLimitsOfReading（読み取り部）・TestStyleSheetIndex 相当のテストが新パッケージにあり、imagebdf 側には描画と TestPathData
      が残る
    scope:
      milestone: svg-m1
    verified_by:
    - unit-tests
  fuzz-target:
    text: 新パッケージに Parse の fuzz ターゲットがあり、既存のテスト SVG をシードにして短時間走る
    scope:
      milestone: svg-m1
    verified_by:
    - fuzz
  no-new-deps:
    text: ルートの go.mod の require に新しい直接依存が増えない
    scope:
      milestone: svg-m1
    verified_by:
    - deps-check
  docs:
    text: docs/api.md の「その他のパッケージ」表に新パッケージの行があり、何を読めて何を読まないかが書かれている
    scope:
      milestone: svg-m1
    verified_by:
    - docs-review
verification:
