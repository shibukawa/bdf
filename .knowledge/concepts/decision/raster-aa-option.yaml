id: decision:raster-aa-option
type: decision
title: AAのDefault／On／Off列挙型
summary: Options.Antialiasの三値列挙型を実装した。ゼロ値・ONは従来AA、OFFは非AA。CLIは-antialias=default|on|off。Renderer単位で解決しdpiによる変更はしない。
authority: authored
lifecycle: active
scope:
  topic: raster-acceleration
facts:
  alternatives:
    bool: falseのゼロ値が既定AA維持と衝突する
    pointer-bool: nilで未指定を表現可能だが列挙型の方が意図を読みやすい
  resolve_once: 描画開始時に一度解決し、オブジェクト倍率で切り替えない
  backend_scope: 最初はGo imagebdf。Canvas 2Dや既存GPU経路へ同じ契約を無条件には適用しない
  presets:
    status: deferred
    examples:
    - Quality
    - Speed
    - PrintFast
    precedence_if_added:
    - explicit AA
    - explicit preset
    - compatible default
    revisit: 実測で複数設定をまとめる必要が生じた時
  independent_settings:
  - 画像補間
  - soft mask
  - 元のalphaとblend
  - 影とblur
  - 色空間・画素形式・網点
  - 細線の幅補償
  - バックエンド
  api:
    status: implemented
    owner: imagebdf.Options
    field: Antialias AntialiasMode
    values:
      Default: ゼロ値。現行AA、解像度連動なし
      'On': 現行AAを明示
      'Off': 図形・文字・幾何clipの境界を非AAで描く
  cli: bdf render -antialias=default|on|off。未知値は入力を開く前にエラー
  scope:
  - Page
  - PageDPI
  - PageSize
  - Region
  - Object
  - SVGImage
  - 内部SVGとクリップ
  hairlines: 既存の幅→alpha補償を維持。厳密な二値細線は別の検討
open_questions:
  public-names:
    text: 公開API、CLI、列挙値の正式名は何にするか
    state: answered
    resolution: Options.Antialias / AntialiasMode / AntialiasDefault,On,Off / -antialiasとして実装
  granularity:
    text: Renderer単位で十分か、描画単位の上書きが必要か
    state: answered
    resolution: Renderer単位のOptionsで実装。描画単位の上書きは利用例が生じたら再検討
  hairlines:
    text: 細線補償維持で帳票・コード・CADを満たすか
    state: deferred
    resolution: 初期実装は従来の幅補償を維持。厳密な二値の必要性は実出力で判断
relations:
- relation: satisfies
  to: requirement:raster-quality-control
- relation: extends
  to: component:imagebdf-rasterization
- relation: selects
  to: technique:binary-scanline-rasterization
