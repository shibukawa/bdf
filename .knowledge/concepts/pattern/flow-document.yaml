id: pattern:flow-document
type: pattern
title: フロー文書の差し込み（契約書・通知書）
summary: >-
  本文が流れる文章で、宛名・金額・条項の有無などを差し込む。段落の条件表示や可変長の本文で行数が変わり、ページが動く。
  Word の差し込み印刷の領域。2026-10-13 時点では対象外だが、docx 変換器が改ページを自前で計算しているため、技術的な障害は小さい。
lifecycle: proposed
authority: authored
aliases:
- 流れる文章
- 差し込み印刷
- mail merge letter
facts:
  status: 利用者「流れる文章は今の所不要で良い」（2026-10-13）
  if_needed: wordproc の読む段階（測り済みの文字 item）と組む段階（flow）の継ぎ目で、段落の item を置換し、段落・セクションを複製してから flow を走らせる。モデルの直列化は割に合わないので、.bdft に docx 本体を私的 Part として持ち、穴埋めのたびに読む段階から回す
  not_this: 固定の箱（テキストボックス・表のセル）に値を入れる Word 帳票は pattern:fixed-page-form。表の行の増減は pattern:growing-detail。流れる文章の差し込みだけがこのパターン
relations:
- relation: member_of
  to: taxonomy:form-layout-axes
- relation: enabled_by
  to: component:wordproc-pagination
