id: decision:ooxml-rewrite-fill
type: decision
title: （撤回）OOXML を書き換えてから変換する穴埋め方式
summary: >-
  マークアップ入りの Office ファイルの XML をトークン位置で切り貼りして穴埋め済み Office ファイルを作り、既存の変換器に通す案。
  Office ファイルを出力したいわけではないため撤回。記録のために残す。
lifecycle: superseded
authority: authored
facts:
  merits_noted:
  - 3 変換器が XML から組むので再レイアウトが無料
  - Excel で開いて確認できる副産物
  - 触らないバイトは変わらず往復の忠実度の問題がない
  demerits_noted:
  - 出力に Office ファイルが混ざる。利用者の目的は .bdf だけ
  - Excel の sharedStrings、Word の run 分断、mc:AlternateContent の両枝保持など XML 層の罠を全部踏む
relations:
- relation: superseded_by
  to: decision:fill-at-converter-seams
