facts:
  file:
    container: BDF コンテナ。Part は src（テンプレートのバイト列。.bdft と同じハッシュ）と tpl（記述の JSON）とページ
    tpl_additions: >-
      spec §4.5 の tpl に 3 つ足す。filled（埋めた値。データと同じ JSON の木）、open（残りの名前の配列。ドットの道）、
      from（元の .bdft の tpl の source とスキーマのハッシュ。どのテンプレートの版かを照合する）。schema は残りの欄だけの JSON Schema にする（フォームの画面はこれだけで組める）。sample は持たない
    pages: 埋めた値で穴埋めし、残りの欄は空で描く（Strict でない穴埋めと同じ見た目）。残りの欄を目立たせる印（MARK の role）は後で
    completion: 残りを全部埋めると tpl を持たないふつうの .bdf。残りの一部なら残りの少ない .bdff
  api_sketch:
    go: 'form.Options に Open []string を足す。Fill は Open があれば .bdff の Document と Template（Filled・Open）を返す。.bdff を Fill に渡すと filled とデータを合わせ、src を穴埋めする（ReadTemplate が filled を読む）'
    cli: 'bdf fill -data mine.yaml -open party_b,sign_b contract.bdft contract.bdff、bdf fill -data theirs.yaml contract.bdff contract.bdf、bdf template schema contract.bdff（残りだけ）'
    wasm_site: サイトのフォームのページが .bdff を受け取り、残りの欄だけの入力を出す。埋めた値は読むだけで見せる
  signature_field:
    current: >-
      2026-10-22 時点で画像の欄は {{%photo}}（fit: contain / cover / stretch）。pdfme の signature の型は画像の欄に読み替えている（converter/pdfme/pdfme.go）。
      PDF フォームの署名の欄（/FT /Sig）は FormSignature として読むが、穴埋めでは飛ばしている（converter/pdfform/pdfform.go の shows）
    proposal: >-
      画像の欄に入力の種類（tag.Field の input、スキーマの x-bdf.input）を足す: signature（描画パッド）と seal（画像を選んで白を抜く）。
      タグは {{%sign_a | signature}}、{{%seal_a | seal}}。PDF の /Sig と pdfme の signature は input: signature の画像の欄になり、/Sig の欄の箱に画像を描く
    site: フォームのページで input が signature の欄に描画パッド（canvas、やり直し、消す）を出し、SVG を data URL で値にする。seal はファイル選択と白抜き
  web_flow: >-
    ウェブサイトで残りを埋める流れは Docflow（requirement:document-flow）の人の操作のノードで作れる: 送る側の .bdff を受け、相手に URL を送り、相手の残りの値で完成させて
    archive に入れる。サーバーが .bdff を持つので埋めた値は相手から書き換えられない
  delivery:
    next_milestone: form-m7（2026-10-22 実装済み、milestone:form-m7）
    outcome: >-
      Excel・Word・PDF フォームの .bdft から -open で .bdff を作り、サイトのフォームのページで残りを埋めて .bdf と PDF にする。
      サインの欄（signature の描画パッド）が Excel の {{%sign | signature}} と PDF の /Sig で動く
    approaches:
      tpl_filled: 推奨。.bdft の tpl に filled・open を足すだけ。穴埋めの核は変わらず、合わせたデータで 1 回穴埋め。決定性がそのまま保てる
      overlay: .bdff のページを土台に、残りの欄だけを上に描く。穴埋めは速いが、行の増える区間やあふれで配置が変わる帳票では成り立たない（採らない）
      separate_part: 埋めた値を別の Part の型（t は fill）にする。tpl を書き換えずに済むが、Part の型が増え、tpl は 1 つまでの規則と二重になる
    acceptance_draft:
    - .bdft＋全部のデータの .bdf と、.bdft →（一部）.bdff →（残り）.bdf が同じバイト列
    - 埋めた名前をもう一度与えた穴埋めと、残りに無い名前を与えた穴埋めが誤りになる
    - .bdff のスキーマが残りの欄だけを持ち、サイトのフォームが残りだけを出す
    - signature の欄に描いた SVG が .bdf と PDF の両方で欄の箱に収まる
history:
  proposed:
    summary: 2026-10-22 利用者がチャットで提案（「bdft に規定のパラメータセット、残りのパラメータ名を組み合わせたファイルで bdff みたいな名前はどうか」「絵（サイン）を入れる欄」）。Claude が既存の tpl・画像の欄・pdfme と PDF の署名の欄を読んで設計案を書いた
