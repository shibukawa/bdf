objective: AA以外の施策をすべて検証する
status: completed_bounded_evaluation
baseline: 現在のimagebdf。AA方式・解像度を揃えた対比較
method:
- Go overlayで試作を隔離し、通常の描画コードを変更しない
- 既存3文書を72/300dpi・AA on/offで比較する
- 速度、alloc、画素差、実行プロセスのCPU時間とpeak RSSを区別する
- microbenchmarkと文書全体の効果、coldとwarmを混同しない
- 外部rendererは対応機能と転送費用を記録して共通入力で比較する
items:
- id: glyph-mask-cache
  scope: グリフ単位cacheと、厳密互換なtext-run cacheの比較
  state: evaluated
  result: max-union glyph masks reject exact run semantics; run-cache measured with
    baseline brackets
- id: sparse-coverage
  scope: 行RLE・疎な被覆率と直接スパン合成
  state: evaluated
  result: exact on 12 fixture outputs; no stable whole-document win for this RLE prototype
- id: small-mask
  scope: 小A8 maskとfloat32 maskの品質・速度・容量
  state: evaluated
  result: A8 quantization changes pixels; speed benefit not established
- id: specialized-pixels
  scope: 単色融合・不透明一括塗り・単純形状
  state: evaluated
  result: rect specialization and convex/solid/opaque prototypes evaluated; frequent-case
    benefit is workload-dependent
- id: simd-fusion
  scope: ARM64 NEONカーネルと文書全体
  state: evaluated
  result: ARM64 full-coverage solid kernel measured; FMA corrected; strict float and
    document checks pass
- id: rgba8-storage
  scope: 全面とgroup/maskの4B画素store、丸め差、float層との混用案
  state: evaluated
  result: memory reduced; scalar packed and hybrid slower on two high-dpi documents;
    200-layer precision counterexample
- id: geometry-cache
  scope: flattenの再利用、stroke展開cache、適応的分割
  state: evaluated
  result: flatten/stroke cache exact in bounded cases; mutation/width invalidation
    checked; adaptive geometry changes pixels
- id: parallel-tiles
  scope: 帯・タイル・独立ページ、影のhalo、画質とメモリ
  state: evaluated
  result: independent pages faster and exact; Region partitioning shows rounding/shadow
    seams even with fixed halo
- id: rendered-image-cache
  scope: ページ・領域・Objectの再利用、コピー費用と容量
  state: evaluated
  result: page/region/object owned-copy upper-bound reuse benefit measured; production
    eviction/invalidation not implemented
- id: native-backends
  scope: Skia CPU、Blend2D、Vello CPUの共通入力・初期化・対応範囲
  state: evaluated
  result: actual Skia CPU/Blend2D/Vello CPU common-scene measurements and pixel differences;
    no full BDF adapter
- id: gpu-hybrid
  scope: 実GPU、upload/readbackを含む比較、対応範囲
  state: evaluated
  result: Metal Apple M3 compute/hybrid static-scene replay including submission/sync/readback
    measured
- id: vector-pdf
  scope: ベクタPDFの生成時間・容量・後段ラスタライズとの比較
  state: evaluated
  result: vector generation/time/size and Ghostscript downstream PNG path measured;
    no physical printer
exclusions:
- AA方式変更そのものは今回のAA以外の対象から外す
- 100dpi自動切替を追加しない
- 実測前に試作を通常backendへ採用しない
result: knowledge-inputs/raster-acceleration/results-non-aa.ja.md
limitations:
- single machine and bounded inputs; not universal rankings
- production adoption and native BDF feature parity remain separate work
- physical print and dynamic GPU preprocessing not tested
