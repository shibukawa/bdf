id: milestone:fl-1
type: milestone
title: fl-1 — 型のある図とペイロード：辺と口の種類（bdf・data・any）、PUT の型検査、ジョブのペイロードの列とメタデータ、入口の accept と output、テンプレート変換とコンバートのノード、filter の meta と kind の規則、キャンバスの色
summary: >-
  requirement:document-flow の最初の段。2026-10-22 利用者「fl-1 の実装を始めてください。暫定の既定はそのままで」。print/manager に
  kinds.go（PayloadBDF・PayloadData・PayloadAny、takes・emits、inferKinds、typed）、meta.go（claimedMeta・metaOfRequest・jobMeta・metaView）、
  transform.go（テンプレートの CRUD とノード、fill・readData・convertPayload・keepDocument・continueWith）を足し、Job に Kind・Meta・Payloads、
  Leg に Payload・Made、Slip・Item・Delivery に Payload を持たせた。入口（endpoint・cups）は accept（file / data）と output（bdf / file）と
  formats と meta を持ち、テンプレートはテンプレート変換ノードの持ち物（エンドポイントの accept template と JSON の封筒は無くなった。移行なし）。
  変換（template・convert）は Delivery の段で、できた .bdf は <ジョブ>.<足跡> の新しいペイロードとして足され、ノードの to へ続く。
  キャンバスは takes・emits で口と辺に色を付け、サイドバーに Accepts・Sends on・Metadata added・Template・Convert の欄。同日実装。
lifecycle: active
authority: authored
scope:
  milestone: fl-1
constraints:
- requirement:document-flow の制約のまま（3 つの種類、printer・display は bdf だけ、template は data だけ、PUT の型検査と実行時の確かめ、既定で今の図が動く、送り手のメタデータは名乗り、256 KiB の記録、SDK なし）
- テンプレートの移行はしない（2026-10-22 利用者）。pm-5 のエンドポイントのテンプレートの記録（templates コレクションの <endpoint>.<id>）は読まれない
