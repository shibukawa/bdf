history:
  decisions:
    summary: 2026-10-19 利用者が 5 つを決めた。幅は可変で超過は警告 / cut / wrap、倍角は入れる、画像とバーコードは許さない、等幅は BIZ UDゴシックを Google Fonts から（ローカルのフォントも明示可）、区間の既定は slots。印字像の Part / MARK は説明して判断待ち
  proposed:
    summary: 2026-10-19 利用者「ESC/P 用に、プレーンテキストのテンプレートも用意した方が良さそう」。印刷の要件整理（requirement:print の escp-text-mode）で「行 × 桁の格子の印が要る」と分かった直後の提案。同日に要件を整理
