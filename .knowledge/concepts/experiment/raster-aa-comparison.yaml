id: experiment:raster-aa-comparison
type: experiment
title: 既定互換と明示非AAの比較実験
summary: 明示AAのAPI・CLIと非AA経路を実装・テストし、既存3文書の72/300dpi warm描画を測定した。実機印刷、cold、ピークメモリ、他dpi等は追加評価として残る。
authority: observed
lifecycle: active
scope:
  topic: raster-acceleration
facts:
  first_slice:
  - AAの三値指定
  - 真のX/Y非AA
  - 既定互換と設定伝搬
  - 少数文書の比較
  later:
  - span直接合成
  - glyph cache
  - analytic AA
  - SIMD/RGBA8
  - 別backend
  dpi_samples:
  - 72
  - 96
  - 100
  - 144
  - 300
  - 600
  optional_1200: MaxPixelsとピークメモリを確認して追加
  inputs:
  - 日本語と欧文の小文字
  - 細罫線と斜線
  - 複雑な曲線と大きな塗り
  - clip・group・soft mask
  - 画像と影
  - QR/バーコード
  metrics:
  - cold/warm drawing
  - wall timeとCPU時間
  - alloc bytes/count
  - peak memory
  - PNG込みのend-to-end
  - 境界差と実寸印刷
  - コードの読み取り
  checks:
  - 未指定とONは現行goldenを維持
  - dpi/DPRで自動変更しない
  - OFFのfill rule、端点、共有辺
  - 矩形・SVG・文字・clip・画像外周の伝搬
  - 元alpha・blend・画像補間・blur・細線方針の維持
  dpi_100_meaning: 品質観察の候補。自動切替閾値としての受け入れ条件ではない
  record_after_run:
  - 測定結果と環境はbenchmark.json、生データはbenchmark.txt
  - 非AAの速度効果を確認。残るmask確保と合成負荷を次の候補にする
  - 実機出力を評価してから用途別の画質説明を追加する
  results:
    date: '2026-10-14'
    environment:
      cpu: Apple M3
      os: darwin
      arch: arm64
      go: go1.27.0
      cpu_flag: 1
      benchtime: 200ms
      count: 3
    command: go test ./raster/imagebdf -run ^$ -bench ^BenchmarkRenderAntialias$ -cpu=1
      -benchtime=200ms -count=3
    scope: warm Renderer PageDPI, first page, decoded resources retained; drawing
      and RGBA conversion included, PNG encoding excluded
    limitations:
    - short indicative runs; chrome-doc 300dpi/off has an 84ms outlier
    - B/op is allocation volume, not peak memory
    - cold start, CPU-seconds, peak memory, PNG end-to-end and physical print are
      not measured
    results:
    - document: drawio/showcase
      dpi: 72
      'on':
        median_ns_op: 2806896
        median_bytes_op: 1077129
        median_allocs_op: 1868
        samples: 3
      'off':
        median_ns_op: 1352689
        median_bytes_op: 1049049
        median_allocs_op: 1858
        samples: 3
      speedup: 2.075049031965219
    - document: drawio/showcase
