id: system:oracle-reports
type: system
title: Oracle Reports（レガシー）の報告書スタイルと弾性レイアウト
summary: >-
  帳票の形態の古典的な分類を製品が持っていた例。Tabular、Group Above（親子）、Group Left、Form-like（1 レコード 1 ページ）、Form Letter、Mailing Label（多段）、Matrix。
  レイアウトはフレームと繰り返しフレーム（データモデルのグループごと、入れ子可）、フィールド、固定文、アンカー。部品の伸縮は Elasticity（Fixed / Variable / Expand / Contract）。
lifecycle: retired
authority: observed
aliases:
- Oracle Reports
- Reports Builder
facts:
  files: .rdf（バイナリ）、.rex（ASCII）、.jsp、.xml、.rep（コンパイル済み）、.tdf（テンプレート）。rwconverter で相互変換
  styles: [Tabular, Group Above, Group Left, Form-like, Form Letter, Mailing Label, Matrix, Matrix with Group]
  layout: frame、repeating frame、field、boilerplate、anchor。Horizontal / Vertical Elasticity。Print Object On、Page Protect、Maximum Records per Page、Print Direction Down / Across。Form Letter と Mailing Label のフィールドは既定で Fixed（切り詰め）
  outputs: PDF、HTML、HTMLCSS、RTF、XML、DELIMITED、SPREADSHEET、PCL、PostScript、ASCII。キャラクタモードは文字セル単位でプリンタ定義ファイルを使う（連帳向け）
  relevance_to_bdft: 「Form-like = 1 レコード 1 ページ」「Maximum Records per Page」「Fixed で切り詰め」は、固定ページ式と固定行数明細の語彙として古くからあったことの証拠。キャラクタモードは pattern:continuous-text-form の商用実装
relations:
- relation: exemplifies
  to: pattern:fixed-page-form
- relation: exemplifies
  to: pattern:continuous-text-form
assertions:
- predicate: report_styles
  value: [Tabular, Group Above, Group Left, Form-like, Form Letter, Mailing Label, Matrix, Matrix with Group]
  authority: observed
  evidence:
    url: https://docs.oracle.com/middleware/12213/formsandreports/build-reports/orbr_concepts1003.htm
- predicate: character_mode_output
  value: PCL / PostScript / ASCII with printer definition files
  authority: observed
  evidence:
    url: https://docs.oracle.com/cd/E17904_01/bi.1111/b32121/pbr_uxprt001.htm
