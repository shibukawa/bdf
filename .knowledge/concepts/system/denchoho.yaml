id: system:denchoho
type: system
title: 電子帳簿保存法 — 自己がコンピュータで作成した書類の控えの電子保存と、電子取引の保存の要件（設計の手がかり。法令の判断ではない）
summary: >-
  2026-10-20 の調べ。国税庁のパンフレット（令和元年 7 月）では、自己がコンピュータを使用して作成して取引相手に交付する書類の写し
  （見積書・請求書・納品書・領収書の控え）を、プリントアウトせずに電子データのまま保存できる。書類にかかる要件は、システム関係書類の備付け、
  見読可能装置と速やかな出力、取引年月日その他の日付での検索（日付の範囲を含む）。令和 4 年の改正で事前承認は無くなり、要件にも緩和がある
  （最新の一問一答で確かめる）。電子取引（電子で渡す・受け取る）は別の条で、2024-01 から電子のまま保存が義務。
  requirement:print-manager の保管庫が「刷った控え」を残す根拠と、検索項目（日付・金額・取引先）の理由。
lifecycle: active
authority: observed
aliases:
- 電帳法
- 電子帳簿保存法
- 国税関係書類
- 電子取引
- 書類の控え
facts:
  documents_4_2:
    target: 自己がコンピュータを使用して作成する決算関係書類（損益計算書、貸借対照表）と、取引相手に交付する書類の写し（見積書、請求書、納品書、領収書の控え）
    requirements_r1_pamphlet:
    - システム関係書類等（システム概要書、システム仕様書、操作説明書、事務処理マニュアル等）を備え付ける
    - 保存場所に電子計算機・プログラム・ディスプレイ・プリンタと操作マニュアルを備え付け、画面・書面に整然とした形式・明瞭な状態で速やかに出力できる
    - 取引年月日その他の日付で検索できる
    - 日付の範囲を指定して検索できる
    not_for_documents: 訂正・削除の事実の確認、入力履歴、帳簿間の関連は帳簿の要件で、書類には付かない（同じパンフレットの表）
    consistency: 一貫してコンピュータを使用して作成しないもの（一部を手書き）は対象外
  e_transactions_7:
    obligation: 2024-01-01 から電子取引は紙の保存が認められず、電磁的記録を保存する（TKC の解説）
    authenticity: タイムスタンプ、訂正削除の記録が残るか訂正削除できないシステム、事務処理規程のいずれか（記憶による。原文未確認）
    search: 取引年月日・取引金額・取引先、日付と金額の範囲、組み合わせ（記憶による。ダウンロードの求めに応じる場合の緩和あり）
  design_implications:
  - 刷った .bdf を控えとして保存する使い方は 4 条 2 項の書類（控え）に入りうる。仮想プリンタで作って取引先へ電子で渡すなら電子取引にも入る
  - 検索項目の最低は日付（範囲つき）。電子取引も扱うなら金額と取引先も
  - 訂正削除できない保存（WORM）は電子取引の真実性の手段の 1 つになりうる
  - システム概要書と操作説明書のひな形を docs に用意する。事務処理マニュアル・規程は利用者の会社が作る
  unverified:
  - 令和 4 年（2022）の改正後の、書類（4 条 2 項）の検索要件の緩和の正確な条件（国税庁の一問一答の最新の版で確かめる）
  - 電子取引の真実性・検索の要件の現行の条文（今回は二次資料と記憶による）
  - 印刷のストリームから作った .bdf が「作成した電子データ」として認められるか（税理士・税務署に確かめる事柄）
  evidence_sources:
  - 国税庁 パンフレット（令和元年 7 月）https://www.nta.go.jp/law/joho-zeikaishaku/sonota/jirei/pdf/0021012-095_01.pdf（gs で本文を取り出して読んだ）
  - TKC の解説（2024-01 の電子取引の義務化）https://tkc.jp/consolidate/lp/denshichobo/denshitorihiki/（検索の抜粋）
relations:
- relation: informs
  to: requirement:print-manager
history:
  surveyed:
    summary: 2026-10-20 利用者が Print Manager に「電子帳簿保存法対応」を求めたので、国税庁のパンフレットを読み、検索の抜粋で 2024 年の電子取引の扱いを確かめた。現行の細部は未確認として残した
