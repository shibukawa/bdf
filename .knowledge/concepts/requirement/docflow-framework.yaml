facts:
  request:
    text: >-
      2026-10-26 利用者「docflow はひととおりできた。docflow をベースに、static import でちょっとアレンジして独自ノードを追加するなどして、
      アレンジできるようなフレームワーク化をしたい。また、popcornweb ベースなので、構造体を登録するだけで設定は自由に足せるはず。
      S3 の接続先のような設定も、そこで定義した設定をプルダウンで選べたりする、トポロジーもプリセットのを組み込んでスタンドアロンアプリと
      できる、独自管理画面やユーザー向け画面を足せる、みたいなことが実現できると良いと思う。/knowledge-memory で設計して欲しい」
  current_state:
    base: main 66bcd7e6（#165 まで）。2026-10-26 にコードで確かめた
    kinds: RegisterKind（df-1）。芯は kinds_core.go、入出力は docflow/io/{ipp,http,smtp,s3,notify} と docflow/render の init。cmd/docflow/handlers が blank import。外のモジュールの登録自体は今でもできる
    settings: 種類ごとの設定は平らな Node（df-1 の利用者の答え）。url・credential・path・text・headers を使い回す。外の種類は自分の欄を持てない
    editor: topology.js（2078 行）の switch で種類ごとの欄。アダプタは JSON の textarea（ADAPTER_SETTINGS・SETTINGS）。パレットは pages.pw.html に固定（kind-xxx）。アイコンと役割の色は canvas.js の表（ICONS・ROLE_OF・PASSES_ON・MAKES_BDF）。GET /api/kinds は名前・題・役割・受ける種類・required まで
    config: handlers.RegisterConfig が docflow と oidc を pwconfig に登録。アプリは pw.RegisterConfig[T] で足せる（生成の束縛は自分のディレクトリ）
    pages: handlers.App（Open・Handler・StartTimer・StartHTTPS・Outermost・Close）。Handler() は閉じた mux、AppBar のリンクは固定、page・viewer・account は非公開、Shell・AppBar は export されていない。公開の木と pw の manifest は package main（cmd/docflow）。catalog は cmd/docflow/messages、help は固定の章
    store: 外向きは Store.PutState/TakeState/PruneStates だけ。種類が自分のコレクションを持つ口は無い
    tests: docflow/internal/flowtest（Env の Put・Submit・Tick・Delivery・Required）は外から使えない
    engine_deps: docflow・docflow/io/...・docflow/render は popcornweb に依存しない（go list -deps）
    popcornweb_limits: RegisterPublicManifest は 1 つの表だけ（2 度目は置き換え）。RegisterLocales は同じ集合なら no-op、違えば panic。pw.WriteHTML は登録された document で葉を包む。document.pw.html は 1 プロジェクトに 1 つ。[]T の設定は配列の表（TOML だけ、${NAME} で環境変数）。pw は直下に go.mod を求める。pw.ConfigContext[T](nil) は ParseConfig の後なら読める（main が使っている）
  design:
    layout:
      docflow: 芯。足すのは Settings・Fields・Text・カタログ・プリセット。popcornweb に依存しないまま
      docflow_web: cmd/docflow/handlers・messages・help・public を移す。Config・RegisterConfig・Main・Run・Options・App・Page・API・BindShell・BindAppBar・RegisterNav・RegisterRole・RegisterHelp
      docflow_flowtest: internal から出す
      docflow_io_all: 標準の入出力をまとめて blank import する便宜
      cmd_docflow: 参照アプリ。web.RegisterConfig(); web.Main(web.Options{}) だけ
      examples_docflow_custom: 独自のアプリの見本。入れ子のモジュール（replace ../..）。pw は直下に go.mod を求めるので
    main_shape: 'web.RegisterConfig(); pw.RegisterConfig[AcmeConfig]("acme"); web.Main(web.Options{Preset, Routes, Nav, Public})。独自の種類は blank import（init で RegisterKind）'
    kinds:
      settings: 'Node.Settings json.RawMessage（json settings）。芯は Fields に照らして形だけ確かめて Check へ。docflow.SettingsOf[T](n) で読む。辺は to・on_error'
      kind_fields: 'Kind に Titles・Help（Text＝言語の札→文。en 必須）・Group（パレットの見出し。既定は Role から）・Icon（24x24 stroke の path 列）・Fields・Doc（マニュアルの節、Markdown、Text）・Handler（/api/<kind>/{name}/… の自分の API）・Access（Handler の門。既定は役割 topology、viewer・public で緩める）'
      field: 'Field{Key, Type（string・text・int・bool・duration・enum・catalog・credential・nodes・path・json）, Title, Help, Placeholder（Text）, Required, If, Choices, Catalog, Open, Default, Expands}。Required []Required は Fields から作る。保存済みの settings は PUT のときだけ確かめ、SettingsOf が無い鍵を既定で埋める'
      kind_info: 'KindInfo に titles・help・group・icon・fields を足す。エディタは GET /api/kinds だけで種類を知る'
      editor: 'パレットは API から（役割 → source・control・convert・sink、Group で上書き）。ICONS・ROLE_OF・PASSES_ON・MAKES_BDF・TAKES_STOCKED・PRINTS も API から。設定の欄は Fields から作る汎用のフォーム fieldsForm。必須の印は missingOf が fields を見る。芯の種類の専用の欄はそのまま'
      execution: '役割ごとの口は今のもの（Keyed+Fetch・Serve、PassesOn+Step、Step、Send）。独自の分岐 Kind.Pick は fw-4。popcornweb の設定は種類の側で pw.ConfigContext[T](ctx)'
      help: 'Kind.Doc を /help/nodes の末尾に。JS の文は Text で届くので catalog は要らない'
    config:
      app: 'pw.RegisterConfig[T]("acme") を自分のディレクトリで。popcornweb.toml の generate.config に載せる。docflow/web の束縛はコミット済み'
      i18n: 'アプリの [i18n] は en, ja / en、cookie_routes ["/"]。3 つ目の言語は先に docflow/web に足す'
    catalogs:
      api: 'docflow.RegisterCatalog(name, func(ctx) ([]Choice, error))。Choice{Value, Label（Text）, Group}。GET /api/catalogs/<name>（役割 topology）。Field.Type = catalog。PutNode が値を確かめる（Open なら自由入力も）'
      connections: '[[docflow.connections]]（name・url・credential・note）。秘密は ${NAME}。s3・smtp・http・s3-trigger・cups-out・printer に connection の欄（scheme で絞る）。保存は名前、送る時に解決。Node.Connection と Manager.Connection(name)'
      credentials: 'DOCFLOW_CRED_* と credential_dir のファイルの名前だけ。資格の欄の pulldown'
      app_catalogs: 'RegisterCatalog の中で pw.ConfigContext[AcmeConfig](ctx) を読む（見本に書く）'
    preset:
      document: 'version 1、nodes（name・kind・to・…・settings）、layout。YAML（JSON も同じ木）。鍵と資格の値は含めない'
      import: 'Manager.ImportTopology(ctx, doc, mode)。辺の先から順に PutNode。レイアウトも'
      modes: 'seed（ノードが無いときだけ）、managed（毎起動で揃え、違いがあるときだけ書く。Node.Managed のノードは読み取り専用）、locked（全部読み取り専用、パレット無し）。既定 managed'
      io: 'GET /api/topology/export（YAML）、POST /api/topology/import?mode=replace|merge、サブコマンド docflow topology export|import（pw.RegisterSubCommand）。requirement:docflow の topology-yaml を満たす'
      standalone: 'プリセット（locked）+ 自分の画面 + 入口への送りは Manager.Submit（web が公開）か apps'
    pages:
      shell: 'Shell・AppBar を export（BindShell・BindAppBar）。アプリの .pw.html は自分のパッケージで葉を書き、web.Page(role, fn) の中で pw.WriteHTMLChain で包む'
      nav: 'web.RegisterNav(NavItem{Path, Title（Text）, Role, Place（bar・admin）})。AppBar・AdminNav は {for} で表から（今の固定のリンクも同じ表）'
      roles: 'web.RegisterRole(name, Title) と [[oidc.roles]]（name・people・groups）。Viewer.Can(name)。topology・audit も同じ仕組みに載せ、今の topology_admins 等は残す'
      api: 'web.API(role, fn)。docflow.ViewerOf(r)。アプリの API は /api/<prefix>/… で、/api/<kind>/<name> とぶつからない名前（web が確かめる）'
      assets: 'pw の /public はアプリのもの。docflow/web は /_docflow/（暫定の名前）で embed から自分で配る（ETag・no-cache）。cmd/docflow も同じ道にし、bdf の popcornweb.toml から [assets] を外し dist/public と manifest を消す。開発は web.Options.AssetsDir でディスクから'
      css: 'docflow の app.css は docflow/web が持ち Shell が読む。アプリは自分の CSS を web.Options.Stylesheets で足す。1 つにするなら @source に docflow/web/*.pw.html を足して Options.Stylesheet で置き換える'
      help: 'web.RegisterHelp(chapter, lang→Markdown)。Kind.Doc は nodes の章へ'
    tests:
      flowtest: 'docflow/flowtest を公開（Env.Put・Submit・Tick・Delivery・Required・Payload）'
      example: 'examples/docflow-custom：kinds/folder（出口：dir・path（{{meta}}）・overwrite）、[acme] と [[docflow.connections]]、presets/topology.yaml、pages（/acme/dashboard 管理、/acme/portal 利用者向け）。CI で go build・go test・pw generate の差分なし'
  delivery:
    current_milestone: fw-1 implemented（milestone:fw-1、2026-10-26）。次は fw-2 か fw-3（fw-1 の後なら独立）
    outcome: 外のモジュールが独自の種類を 1 つ足した Docflow を pw build で組め、エディタにその種類が欄つきで出て、ジョブが流れる
    later: fw-2（カタログ・接続・プリセット・YAML）、fw-3（画面・ナビ・ロール・help）、fw-4（独自の分岐・コレクション・定期の仕事・独自の口）
    approaches:
      settings_object: '推奨。Node.Settings の 1 オブジェクト + Kind.Fields の宣言。芯の欄と分かれ、YAML・OpenAPI・フォームが素直。今の平らな欄はそのまま残せる'
      flat_extra: 'Node に extra map[string]any。実装は小さいが芯の欄と名前空間が混ざり、YAML と OpenAPI の形が崩れる'
      json_only_editor: '独自の種類は今のアダプタと同じ JSON の textarea だけ。実装は最小だが「プルダウンで選べる」が成り立たない。Fields からのフォームを推す'
    provisional_choices:
      settings_object: Node.Settings（Claude）
      web_in_bdf: docflow/web を bdf の中に（Claude）
      self_served_assets: /_docflow/ を docflow/web が自分で配る（Claude）
      connections_in_toml: 接続は [[docflow.connections]]（Claude）
      preset_default_managed: プリセットの既定は managed（Claude）
      example_nested_module: 見本は examples/docflow-custom の入れ子のモジュール（Claude）
      text_map: 題・説明は Text（言語の札→文、en 必須）。API は全言語を返し、エディタが lang で選ぶ（Claude）
    decisions:
      adapters-to-settings:
        reason: 今のノードがそのまま動くことが先。移すと保存済みのノードの互換が無い
        revisit_when: fw-1 で Fields からのフォームが入り、アダプタの JSON の欄が目立つようになったら
        evidence_needed: アダプタの欄を Fields に書き直す手間と、保存済みの実在のトポロジーの有無
        provisional_choice: fw-1 では移さない
        change_boundary: SettingsOf と Fields は芯の欄と独立。移すときは種類ごとに Check を書き換えるだけ
open_questions:
  settings-shape:
    text: 独自の種類の設定の持ち方。A. Node.Settings のオブジェクト（種類ごとの構造体、Kind.Fields で形を宣言）、B. 平らな Node に extra の map
    state: answered
    resolution: A。2026-10-26 利用者「暫定の答え（1 = A、3 = A、他も既定）のまま milestone:fw-1 を実装してください」
  framework-location:
    text: フレームワークの置き場。A. bdf の docflow/web（cmd/docflow/handlers を移す）、B. 別リポジトリ（bdf を依存に）
    state: answered
    resolution: A。2026-10-26 利用者が暫定のまま進めると答えた。メッセージの catalog は docflow/webmessages（docflow/web の下だと pw が生成物を掃く）
  adapters-to-settings:
    text: 今のアダプタ（smtp・s3・http・notify・render・s3-trigger）の平らな欄を settings に移すか
    state: deferred
    resolution: fw-1 では移さない（facts.delivery.decisions.adapters-to-settings）。移すなら互換なし
  connections-store:
    text: 接続（connections）の持ち場所。A. 設定 TOML（[[docflow.connections]]、秘密は ${NAME}）、B. 保存先と画面（封をした秘密が要る）、C. 両方
    state: open
    resolution: 暫定（Claude）：A。運用の持ち物として設定に。B は requirement:document-flow の credentials-store と一緒に後で
  assets-serving:
    text: docflow/web の JS・CSS の配り方。A. /_docflow/ を docflow/web が自分で配る（embed）、B. アプリの public に写してから pw generate で 1 つの manifest に
    state: answered
    resolution: A（2026-10-26 利用者が暫定のまま進めると答えた）。RegisterPublicManifest が 1 つの表だけなので B は手順が増える。prefix の名前は暫定
  preset-mode:
    text: プリセットの既定のモード。managed・seed・locked
    state: open
    resolution: 暫定（Claude）：managed。スタンドアロンは locked を選ぶ
  example-location:
    text: 見本の置き場。A. examples/docflow-custom（入れ子のモジュール、replace）、B. 別リポジトリ
    state: answered
    resolution: A（2026-10-26 利用者が暫定のまま進めると答えた）。CI で一緒に試せる
  custom-ports:
