<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>BDF viewer demo</title>
<style>
  :root { color-scheme: light; font: 13px system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; background: #e9ecef; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #fff; border-bottom: 1px solid #ccc; }
  header .tabs button { margin-right: 4px; }
  header .tabs button[aria-selected="true"] { font-weight: bold; background: #1f3a5f; color: #fff; }
  #stage { overflow: auto; position: relative; }
  .pages { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px; }
  .page { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .page canvas { display: block; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; }
  /* the selectable text layer's CSS is @bdf/render TEXT_LAYER_CSS, added by main.ts */
  /* highlights sit on the canvas, which forced colors leave alone: keep theirs too */
  .hlLayer { forced-color-adjust: none; }
  .hl { position: absolute; background: rgba(255, 210, 0, .45); outline: 1px solid rgba(200, 140, 0, .8); pointer-events: none; border-radius: 2px; }
  .hl.current { background: rgba(255, 120, 0, .5); outline-color: #c04000; }
  .search { display: flex; gap: 4px; align-items: center; }
  .sheet { position: relative; }
  .sheet canvas { position: sticky; top: 0; left: 0; display: block; }
  .info { color: #666; margin-left: auto; display: flex; gap: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
</style>
<body>
<header>
  <strong>BDF viewer</strong>
  <span class="tabs" id="tabs" role="tablist" aria-label="views"></span>
  <label>zoom <input id="zoom" type="range" min="0.25" max="3" step="0.25" value="1" aria-valuetext="100%"> <span id="zoomv">100%</span></label>
  <label id="modeBox" hidden><input id="continuous" type="checkbox"> continuous</label>
  <span class="search" role="search">
    <input id="q" type="search" placeholder="search…" aria-label="search" size="18">
    <button id="prev" title="previous match" aria-label="previous match">▲</button><button id="next" title="next match" aria-label="next match">▼</button>
    <span id="hits" role="status"></span>
  </span>
  <span class="info">
    <!-- status is announced (loading, what a view holds, errors); timing is not, since it changes on every scroll -->
    <span id="status" role="status"></span>
    <span id="timing"></span>
  </span>
</header>
<div id="stage" role="tabpanel" tabindex="0"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
