# Docflow (cmd/docflow) is a Popcorn Web application; pw
# finds a project by this file, next to go.mod. Each purpose reads only the
# directories listed here: the rest of the module is not pw's.
[project]
name = "docflow"
main = "./cmd/docflow"

# go build names the binary after the main package and writes it to the
# root, where the module's docflow package already is: pw build writes it
# here instead.
[build]
output = "bin/docflow"

# The web application is the package docflow/web, which cmd/docflow
# and a program of its own serve: its pages, its configuration and its
# generated files are there. Its scripts and style are not pw's public
# tree: docflow/web embeds and serves them itself (assets.go), so that a
# program composing it keeps /public for its own (there is no [assets]).
[generate]
handlers = ["docflow/web"]
templates = ["docflow/web"]
config = ["docflow/web"]
queries = []

# The program's own public tree (pw's /public), which cmd/docflow keeps
# empty: pw builds it into dist/public beside public.go of package main,
# which embeds it, as it does for a program composing docflow/web.
[assets]
public = "cmd/docflow/public"
derived = "cmd/docflow/dist/public"
embed = "cmd/docflow/public.go"

# pw dev runs pw's development OpenID Provider (dev only: pw doctor flags
# it in any other environment) and gives Docflow its issuer and a
# client of the run (AUTH_OIDC_*). Its people are cmd/docflow's
# roster; config.dev.toml makes docflow-admins the administrators.
[dev.idp]
enabled = true
config = "cmd/docflow/devidp.toml"

# The pages are in English and Japanese: in the language a person chose
# with the bar's switch (pw's cookie), else the browser's
# (Accept-Language), else English. The texts of the templates are the
# catalog's (docflow/webmessages: beside docflow/web, not under it, as
# pw sweeps a generated file inside a generate directory that its
# purposes did not write); the scripts' are public/ja.js. The
# API is not translated: handlers.App puts only the pages behind the
# negotiation.
[i18n]
locales = ["en", "ja"]
default_locale = "en"
catalog = "docflow/webmessages"
cookie_routes = ["/"]

[i18n.label]
en = "English"
ja = "日本語"
