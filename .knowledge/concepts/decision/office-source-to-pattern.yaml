id: decision:office-source-to-pattern
type: decision
title: Office の 3 形式と帳票の形態の対応（どのテンプレートでどの形態を作れるか）
summary: >-
  Word / Excel / PowerPoint のどの構造が、taxonomy:form-layout-axes のどの形態を表すか。
  同じ形態でも元の形式ごとに穴埋め時の再計算が違う。
lifecycle: proposed
authority: authored
facts:
  excel:
    fixed_page: 印刷範囲 1 ページ分。セルが箱
    fixed_rows_paged: 開始と終了のタグを別の行に置いた明細域、または定義名のブロック。ページ複製
    growing: 開始と終了のタグが同じ行 → 行挿入＋印刷設定でページ分割。印刷タイトルが見出し行の繰り返し
    label_sheet: 印刷範囲に面を並べた表（補助的）
    continuous: 等幅フォント＋固定行高のシートを格子とみなす案（未決）
    needs: 印刷設定の読み取り（requirement:xlsx-print-view）、式の再計算、行挿入時の参照のずらし
  word:
    fixed_page: テキストボックス・表のセルが箱。本文のタグも長さが同じなら同じ扱い
    fixed_rows_paged: 表の中で開始と終了のタグを別の行に。ページ複製はセクション複製
    growing: 表の行の複製 → flow の再実行で下が押し下がりページが割れる
    flow_document: 段落・セクションの差し込み（今は対象外）
    label_sheet: 「ラベル」機能が作る表 = 面
    needs: 読む段階にテンプレートモード、画像フィールドの差し替え経路、page View だけの出力
  pptx:
    fixed_page: 図形のテキスト枠が箱
    slide_repeat: 1 レコード 1 スライド、表のあふれで継続スライド
    fixed_rows_paged: 表の行数 = 明細域の行数 → スライド複製
    needs: normAutofit の再計算、spAutoFit の高さの再計算、run の結合（言語で分かれる）
  not_from_office:
    continuous_text: ドットインパクト向けの格子テンプレートは Office からは作りにくい。専用のテキスト形式か、将来のエディタの領域
    label_printer: ラベルプリンタ向けの出力はプリンタ言語への書き出しが別に要る
relations:
- relation: refines
  to: taxonomy:form-layout-axes
- relation: part_of
  to: requirement:form-template
