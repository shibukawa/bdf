name: ci
# Runs on main too, which saves the caches of Go (.github/actions/go) that
# pull requests restore: a cache saved by a pull request is only for it.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  go:
    if: github.event_name == 'push' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/go
        with:
          go-version: "1.27.3" # the patch with the fix of GO-2026-6809 (crypto/x509), after 6617 and 6612/6613, which the runner's cache lacks
      # Go 1.27's unreachable analyzer flags the goto-shaped bodies of the
      # generated codec (image/imgconv/internal/webpw), so that check is off.
      - run: go vet -unreachable=false ./...
      - name: reachable Go dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test ./...
      # cmd/docflow is a Popcorn Web application. Its generated files
      # are committed, as the module's build runs neither tool: the style
      # (Tailwind CSS with daisyUI, by the standalone CLI of
      # tailwind/VERSIONS), the *_pw_gen.go files, and the public tree pw
      # builds and the binary embeds (dist/public, with its manifest)
      - name: Docflow's generated files are up to date
        run: |
          curl -sSfLo "$RUNNER_TEMP/tailwindcss" https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          echo "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a  $RUNNER_TEMP/tailwindcss" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tailwindcss"
          PATH="$RUNNER_TEMP:$PATH" go generate ./cmd/docflow
          go install github.com/shibukawa/popcornweb/cmd/pw@v0.5.14
          "$(go env GOPATH)/bin/pw" generate
          git status --porcelain -- cmd/docflow
          test -z "$(git status --porcelain -- cmd/docflow)"
      # raster/ebitenginebdf depends on Ebitengine, so it is a module of its
      # own (./... above does not reach it). Its tests compile objects into
      # paths and open no window.
      - name: Ebitengine renderer
        working-directory: raster/ebitenginebdf
        run: go vet ./... && go test ./...
      - name: image codecs over simd/archsimd (GOEXPERIMENT=simd)
        run: go test ./image/imgconv/...
        env:
          GOEXPERIMENT: simd
      - name: build without image codecs (browser / tinygo profile)
        run: go test -tags bdf_noconv ./image/imgconv/ ./converter/... ./font/woff2/
      - name: testdata is up to date
        id: fixtures
        run: |
          stale=0
          check_fixture() {
            if ! cmp "$1" "$2"; then
              mkdir -p "/tmp/regenerated-bdf-fixtures/$(dirname "$2")"
              cp "$1" "/tmp/regenerated-bdf-fixtures/$2"
              stale=1
            fi
          }
          go run ./cmd/bdf demo /tmp/demo.bdf
          check_fixture /tmp/demo.bdf testdata/demo.bdf
          for f in converter/pdf/testdata/*.pdf; do
            n=$(basename "$f" .pdf)
            go run ./cmd/bdf generate -q "$f" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/pdf/$n.bdf"
          done
          for f in converter/pptx/testdata/*.pptx; do
            n=$(basename "$f" .pptx)
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "$f" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/pptx/$n.bdf"
          done
          for f in converter/xlsx/testdata/*.xlsx; do
            n=$(basename "$f" .xlsx)
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "$f" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/xlsx/$n.bdf"
          done
          go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts -param views=print converter/xlsx/testdata/print.xlsx /tmp/print-pages.bdf
          check_fixture /tmp/print-pages.bdf testdata/xlsx/print-pages.bdf
          for n in fixed rows pages; do
            go run ./cmd/bdf fill -q -font-dir converter/pptx/testdata/fonts -no-system-fonts -files test/xlsx/data -data "test/xlsx/data/form-$n.json" "converter/xlsx/testdata/form-$n.xlsx" "/tmp/form-$n.bdf"
            check_fixture "/tmp/form-$n.bdf" "testdata/form/$n.bdf"
          done
          go run ./cmd/bdf template compile -q -font-dir converter/pptx/testdata/fonts -no-system-fonts -files test/xlsx/data -sample test/xlsx/data/form-pages.json converter/xlsx/testdata/form-pages.xlsx /tmp/form-pages.bdft
          check_fixture /tmp/form-pages.bdft testdata/form/pages.bdft
          # the Word and PowerPoint templates, filled with the data of the Excel ones
          for k in docx pptx; do
            for n in fixed rows pages; do
              go run ./cmd/bdf fill -q -font-dir converter/pptx/testdata/fonts -no-system-fonts -files test/xlsx/data -data "test/xlsx/data/form-$n.json" "converter/$k/testdata/form-$n.$k" "/tmp/form-$k-$n.bdf"
              check_fixture "/tmp/form-$k-$n.bdf" "testdata/form/$k-$n.bdf"
            done
          done
          # a form as a PDF file
          go run ./cmd/bdf pdf -q -font-dir converter/pptx/testdata/fonts -no-system-fonts testdata/form/pptx-fixed.bdf /tmp/form-pptx-fixed.pdf
          check_fixture /tmp/form-pptx-fixed.pdf testdata/form/pptx-fixed.pdf
          # the templates whose fields have places: a PDF with form fields, and templates of pdfme
          go run ./cmd/bdf fill -q -font-dir converter/pptx/testdata/fonts -no-system-fonts -data test/pdf/data/application.json converter/pdfform/testdata/application.pdf /tmp/form-pdf-application.bdf
          check_fixture /tmp/form-pdf-application.bdf testdata/form/pdf-application.bdf
          for n in invoice certificate; do
            go run ./cmd/bdf fill -q -font-dir converter/pptx/testdata/fonts -no-system-fonts -data "test/pdfme/data/$n.json" "converter/pdfme/testdata/$n.json" "/tmp/form-pdfme-$n.bdf"
            check_fixture "/tmp/form-pdfme-$n.bdf" "testdata/form/pdfme-$n.bdf"
          done
          # the templates of text: forms on a grid of columns and lines, and one as plain text in Shift_JIS
          for n in slip rows pages receipt; do
            go run ./cmd/bdf fill -q -font-dir converter/textform/testdata/fonts -no-system-fonts -data "test/text/data/$n.json" "converter/textform/testdata/$n.txt" "/tmp/form-text-$n.bdf"
            check_fixture "/tmp/form-text-$n.bdf" "testdata/form/text-$n.bdf"
          done
          go run ./cmd/bdf template compile -q -font-dir converter/textform/testdata/fonts -no-system-fonts -sample test/text/data/slip.json converter/textform/testdata/slip.txt /tmp/form-text-slip.bdft
          check_fixture /tmp/form-text-slip.bdft testdata/form/text-slip.bdft
          go run ./cmd/bdf fill -q -font-dir converter/textform/testdata/fonts -no-system-fonts -param encoding=shift_jis -param newline=crlf -data test/text/data/slip.json converter/textform/testdata/slip.txt /tmp/form-text-slip.txt
          check_fixture /tmp/form-text-slip.txt testdata/form/text-slip.txt
          # a form as a tagged PDF/A file
          go run ./cmd/bdf pdf -q -pdfa 2a -font-dir converter/pptx/testdata/fonts -no-system-fonts testdata/form/pdfme-invoice.bdf /tmp/form-pdfme-invoice.pdf
          check_fixture /tmp/form-pdfme-invoice.pdf testdata/form/pdfme-invoice.pdf
          for f in shapes.vsdx flow.vsdx; do
            n=${f%.*}
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "converter/visio/testdata/$f" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/visio/$n.bdf"
          done
          for n in basic vertical; do
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "converter/idml/testdata/$n.idml" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/idml/$n.bdf"
          done
          go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts converter/idml/testdata/simpleidml/interview.idml /tmp/interview.bdf
          check_fixture /tmp/interview.bdf testdata/idml/interview.bdf
          go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts converter/idml/testdata/simpleidml/magazineA-courrier-des-lecteurs-3pages.idml /tmp/courrier.bdf
          check_fixture /tmp/courrier.bdf testdata/idml/courrier.bdf
          for n in shapes layout r12-sjis; do
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "converter/dxf/testdata/$n.dxf" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/dxf/$n.bdf"
          done
          for n in shapes old; do
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "converter/jww/testdata/$n.jww" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/jww/$n.bdf"
          done
          go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts converter/sxf/testdata/shapes.p21 /tmp/shapes.bdf
          check_fixture /tmp/shapes.bdf testdata/sxf/shapes.bdf
          for n in shapes illustration sjis; do
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "converter/cgm/testdata/$n.cgm" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/cgm/$n.bdf"
          done
          for n in shapes job hpgl1; do
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "converter/hpgl/testdata/$n.plt" "/tmp/$n-hpgl.bdf"
            check_fixture "/tmp/$n-hpgl.bdf" "testdata/hpgl/$n.bdf"
          done
          for f in converter/docx/testdata/*.docx; do
            n=$(basename "$f" .docx)
            go run ./cmd/bdf generate -q -font-dir converter/docx/testdata/fonts -no-system-fonts "$f" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/docx/$n.bdf"
          done
          for f in converter/csv/testdata/*.csv converter/csv/testdata/*.tsv; do
            n=$(basename "${f%.*}")
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "$f" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/csv/$n.bdf"
          done
          for f in converter/drawio/testdata/*.drawio; do
            n=$(basename "$f" .drawio)
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "$f" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/drawio/$n.bdf"
          done
          for f in converter/tiff/testdata/*.tif; do
            n=$(basename "$f" .tif)
            go run ./cmd/bdf generate -q "$f" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/tiff/$n.bdf"
          done
          for f in converter/markdown/testdata/*.md converter/html/testdata/*.html; do
            k=$(basename "$(dirname "$(dirname "$f")")")
            n=$(basename "${f%.*}")
            go run ./cmd/bdf generate -q -font-dir converter/docx/testdata/fonts -no-system-fonts -param remote=false "$f" "/tmp/$k-$n.bdf"
            check_fixture "/tmp/$k-$n.bdf" "testdata/$k/$n.bdf"
          done
          go run ./cmd/bdf generate -q converter/ai/testdata/artboards.ai /tmp/artboards-ai.bdf
          check_fixture /tmp/artboards-ai.bdf testdata/ai/artboards.bdf
          for n in layers artboards; do
            go run ./cmd/bdf generate -q "converter/psd/testdata/$n.psd" "/tmp/$n-psd.bdf"
            check_fixture "/tmp/$n-psd.bdf" "testdata/psd/$n.bdf"
          done
          for f in converter/image/testdata/*; do
            n=$(basename "${f%.*}")
            go run ./cmd/bdf generate -q "$f" "/tmp/$n.bdf"
            check_fixture "/tmp/$n.bdf" "testdata/image/$n.bdf"
          done
          go run ./cmd/bdf generate -q converter/gerber/testdata/board.zip /tmp/board-gerber.bdf
          check_fixture /tmp/board-gerber.bdf testdata/gerber/board.bdf
          go run ./cmd/bdf generate -q converter/gerber/testdata/features.gbr /tmp/features-gerber.bdf
          check_fixture /tmp/features-gerber.bdf testdata/gerber/features.bdf
          for f in converter/epub/testdata/*.epub; do
            n=$(basename "$f" .epub)
            go run ./cmd/bdf generate -q -font-dir converter/docx/testdata/fonts -no-system-fonts "$f" "/tmp/epub-$n.bdf"
            check_fixture "/tmp/epub-$n.bdf" "testdata/epub/$n.bdf"
          done
          for f in converter/parquet/testdata/*.parquet; do
            n=$(basename "$f" .parquet)
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "$f" "/tmp/parquet-$n.bdf"
            check_fixture "/tmp/parquet-$n.bdf" "testdata/parquet/$n.bdf"
          done
          for f in mml/testdata/frere.mml:frere-mml mml/testdata/ode.mml:ode-mml midi/testdata/twinkle.kar:twinkle-kar \
            musicxml/testdata/minuet.musicxml:minuet-musicxml musicxml/testdata/ode_to_joy.mxl:ode-mxl; do
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "converter/${f%%:*}" "/tmp/${f##*:}.bdf"
            check_fixture "/tmp/${f##*:}.bdf" "testdata/music/${f##*:}.bdf"
          done
          for f in demo.zip:demo frame/frame.kicad_pro:frame; do
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "converter/kicad/testdata/${f%%:*}" "/tmp/kicad-${f##*:}.bdf"
            check_fixture "/tmp/kicad-${f##*:}.bdf" "testdata/kicad/${f##*:}.bdf"
          done
          for f in stix.otf:stix restricted.ttf:restricted; do
            go run ./cmd/bdf generate -q -font-dir converter/pptx/testdata/fonts -no-system-fonts "converter/font/testdata/${f%%:*}" "/tmp/${f##*:}-font.bdf"
            check_fixture "/tmp/${f##*:}-font.bdf" "testdata/font/${f##*:}.bdf"
          done
          test "$stale" -eq 0
      - uses: actions/upload-artifact@v7
        if: failure() && steps.fixtures.outcome == 'failure'
        with:
          name: regenerated-bdf-fixtures
          path: /tmp/regenerated-bdf-fixtures/
      - name: conformance suite
        run: |
          go run ./cmd/bdf conformance -testdata testdata /tmp/bdf-conformance
          tar czf /tmp/bdf-conformance.tar.gz -C /tmp bdf-conformance
      - uses: actions/upload-artifact@v7
        with:
          name: bdf-conformance
          path: /tmp/bdf-conformance.tar.gz
      - if: "!cancelled() && (github.event_name == 'push' || github.head_ref == 'claude/ci-package-download-cache-71f74d')"
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.path }}
          key: ${{ steps.go.outputs.key }}
  print:
    # bdf print against printers that are not bdf's own: CUPS's
    # ippeveprinter (an IPP Everywhere printer) and a CUPS queue of it
    if: github.event_name == 'push' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/go
        with:
          go-version: "1.27.3"
      - name: CUPS, ippeveprinter, Avahi and Ghostscript
        uses: ./.github/actions/apt
        with:
          name: print
          run: |
            sudo apt-get update
            sudo apt-get install -y cups cups-ipp-utils cups-filters avahi-daemon ghostscript
            sudo systemctl start avahi-daemon cups
      # the PostScript files drawn by Ghostscript and compared with the pages
      - run: go test ./vector/psbdf/ ./print/...
      - run: test/print/ci.sh
      - if: "!cancelled() && (github.event_name == 'push' || github.head_ref == 'claude/ci-package-download-cache-71f74d')"
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.path }}
          key: ${{ steps.go.outputs.key }}
  print-os:
    # the printing packages build and pass on Windows and macOS too
    if: github.event_name == 'push' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/go
        with:
          go-version: "1.27.3"
      - run: go vet ./print/... && go test ./print/...
      - if: "!cancelled() && (github.event_name == 'push' || github.head_ref == 'claude/ci-package-download-cache-71f74d')"
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.path }}
          key: ${{ steps.go.outputs.key }}
  web:
    if: github.event_name == 'push' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Chromium's libraries
        uses: ./.github/actions/apt
        with:
          name: playwright-chromium
          run: npx playwright-core install-deps chromium
      - id: playwright
        run: echo "version=$(node -p 'require("./node_modules/playwright-core/package.json").version')" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - run: npx playwright-core install chromium
      - run: npm run test:browser
