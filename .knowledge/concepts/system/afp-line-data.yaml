id: system:afp-line-data
type: system
title: IBM AFP（MO:DCA）の PAGEDEF / FORMDEF / オーバーレイと行データ
summary: >-
  メインフレーム以来の高速印刷アーキテクチャ。行データ（1 行ずつのテキスト、1 桁目に改行制御）を PAGEDEF がページ上の位置・回転・フォントに写し、
  FORMDEF が用紙・複写グループ・オーバーレイ（電子的なプレ印刷用紙）を与える。静的なフォームと可変データの分離の原型。
lifecycle: active
authority: observed
aliases:
- AFP
- MO:DCA
- PPFA
- PAGEDEF
- FORMDEF
facts:
  pagedef: 論理ページのレイアウト。行全体または行の中の特定フィールドの位置・回転・抑止・フォント。PageFormat が「どのフィールドをどこに何回印字するか」
  formdef: OVERLAY と SUBGROUP（複写グループ、給紙ビン）。サブグループあたり medium overlay 8 個とプレ印刷用紙オーバーレイ 1 個まで
  overlay: FORMDEF で宣言するか IPO で行内から呼ぶ。行データではオーバーレイを印字行に相対に置ける。PPFA の CONSTANT はオーバーレイだけを印字（定型用紙）
  page_segments: IOCA / GOCA / BCOCA のロゴ・署名・バーコードを IPS で置く
  units: inch / mm / cm / point / pel → L-unit（既定 240/inch）。SETUNITS で LPI と CPI を既定単位にできる
  line_data: 1 桁目の ANSI 改行制御（空白 = 1 行送り、0 = 2 行、- = 3 行、+ = 重ね打ち、1 = チャネル 1 = 用紙先頭、2〜9 / A〜C = FCB のチャネル）。機械コードは 16 進の等価。RECFM=FBA / FBM
  ppfa: 行単位の出力を電子ページに写し、電子フォーム・画像・複写を足すコンパイラ
  relevance: BDF の静的 Object の共有はオーバーレイに、連帳の格子は LPI / CPI の位置指定に対応する
relations:
- relation: exemplifies
  to: pattern:preprinted-overlay
- relation: exemplifies
  to: pattern:continuous-text-form
assertions:
- predicate: separates_static_overlay_from_line_data
  value: true
  authority: observed
  evidence:
    url: https://www.ibm.com/docs/en/SSLTBW_2.1.0/com.ibm.zos.v2r1.apsu000/toc.htm
- predicate: supports_lpi_cpi_units
  value: true
  authority: observed
  evidence:
    url: https://www.ibm.com/docs/SSLTBW_2.2.0/com.ibm.zos.v2r2.ib6p000/ib6p9c9b.htm
- predicate: carriage_control_in_column_1
  value: ANSI and machine codes
  authority: observed
  evidence:
    url: https://docs.precisely.com/docs/sftw/e1-enrichment/7.4.3/en-us/webhelp/DevelopersGuideDITA/PrintStreams/carriage_controls.html
