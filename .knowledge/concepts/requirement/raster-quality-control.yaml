id: requirement:raster-quality-control
type: requirement
title: ラスタライズ品質を明示指定し、既定のAAを維持する
summary: 明示的なAA指定をimagebdfとbdf renderに実装した。未指定・ONは従来AA、OFFは非AA走査を使う。dpi・DPR・ズームによる自動切替は行わない。追加の高速化候補は別に保持する。
authority: authored
lifecycle: accepted
scope:
  topic: raster-acceleration
aliases:
- アンチエイリアス
- antialias
- 印刷向け高速化
- AA off
constraints:
- 明示指定がない既存呼び出しの画質を変えない
- 解像度だけでAAを無効化しない
- 明示的に非AAを選べる設計を検討する
non_goals:
- 100dpiを品質保証の境界にすること
- ブラウザCanvas 2Dの任意パスAA制御を保証すること
capabilities:
  explicit-aa-control:
    state: implemented
    about: capability:imagebdf/explicit-aa-control
    verified_by:
    - compatibility
    - binary-route
acceptance:
  default-compatible:
    text: 未指定／既定と明示ONは低・高dpiのいずれでも現行描画を維持する
    verified_by:
    - compatibility
  explicit-off:
    text: 明示OFFが幾何学的境界の非AA経路を選び、元の半透明・合成・画像補間・影等の処理と設定を無効化しない。幾何マスク変更に由来する影やsoft maskの画素差は許容する
    verified_by:
    - binary-route
