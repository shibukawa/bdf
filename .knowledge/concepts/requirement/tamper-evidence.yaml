facts:
  threat_model:
    protects: >-
      文書を受け取った人・保管した人・途中の経路が、署名した後に文字・画像・ページ・テンプレートの値を変えたこと、Part を差し替えたこと、ページを足し引きしたことを検証で見つける。
      署名の後に別の人が署名し直した（署名を剥がして自分の署名に替えた）ことは、証明書の名前で見分ける
    does_not_protect: 署名の鍵を盗まれること、署名する前の内容が正しいこと、文書を消されること（それは保管の Object Lock）、画面の上での見た目の偽装（署名のないコピーを見せる）
  bdf:
    signed_content: >-
      署名する内容は文書そのものではなく、次を並べた小さな JSON（RFC 8785 の JCS）: 版、manifest の正規形（JSON として読み parts の off を除いて JCS で書いたもの）の SHA-256、
      manifest の parts の順に各 Part の格納バイト列の SHA-256（32 バイト）、前の署名の DER の SHA-256、claims。CMS の SignedData はこれを中に持つ（sig-1 で決めた。当初案の
      「manifest の平文のバイト列」と detached は、分割形式が manifest を書き直すことと claims を運ぶ必要から変えた）。検証は全部の Part を読んで SHA-256 を計算し直す
    block: '1 ファイル形式は Part の領域の後ろに、署名の並び（CMS の DER を n 個）と、"bdfs"・版・長さの 16 バイトの末尾。分割形式は signatures.json（base64 の DER の配列）'
    multiple: 署名は並べて足せる（連署）。後の署名は、前の署名の DER のハッシュも署名する内容に入れて、前の署名を外されたら分かるようにする
    attributes: 署名属性に署名した人の役割（bdf の名前の空間の属性。送り手・受け手・立会人）と、立会人型なら操作した人（OIDC の issuer と sub、メール）を入れる
    cli: 'bdf sign -key key.pem -cert chain.pem [-tsa URL] in.bdf out.bdf、bdf verify [-roots roots.pem] doc.bdf（署名した人、時刻、覆う範囲、壊れた Part の名前を出す）'
  partial_fill_chain:
    summary: >-
      一部を埋めた帳票（.bdff）は、送る側が「値」に署名する。署名する内容は tpl の src のハッシュ・filled・open・schema のハッシュで、絵（ページ）には署名しない。
      完成した .bdf はその署名をそのまま tpl に持ち、受け手か立会人がもう 1 度、文書全体に署名する
    why_values: 送る側の署名を完成品まで運ぶため。ページの絵は残りを埋めると変わるが、送る側の値と元のテンプレートは変わらない。値の署名なら完成品の tpl の上でそのまま検証できる
    check: 検証は (1) 送る側の署名が tpl の値とテンプレートのハッシュに合う、(2) 完成品の filled が送る側の値を全部同じに含み、増えたのは open の名前だけ、(3) 文書の署名が全体に合う、の 3 つ
    recompute: 決定性があるので、同じフォントを持つ検証者は src と filled から穴埋めし直して、完成品の Part と同じバイト列になることも確かめられる（任意の強い検査）
  pdf:
    standard: PAdES（ETSI EN 319 142-1）の B-B と B-T。/Type /Sig、/SubFilter /ETSI.CAdES.detached、/ByteRange で /Contents の外を全部覆う
    writer: >-
      vector/pdfbdf が最後に署名の辞書と /Contents の場所（予約した 16 進の 0）を書き、/ByteRange を埋めてから、その範囲の SHA-256 に CMS で署名して /Contents に入れる。
      増分の保存ではなく最初の書き出しの中で署名する（PDF/A とタグ付きの出力はそのまま）
    certify: 作成者の署名は DocMDP の認証署名（/P 1、変更を一切許さない）にできる。受け手の連署が要るときは /P 2（フォームの入力と署名だけ許す）
    appearance: >-
      見える署名の欄は、テンプレートのサインの欄（requirement:partial-fill の input: signature の画像の欄）の箱に、署名の注釈（/FT /Sig のウィジェット）を重ねる。
      描いたサインの画像が欄の外観になり、Acrobat で欄を押すと電子署名の検証結果が出る
    from_bdf: 署名付きの .bdf を PDF にするときは、PDF に書き出す人（ふつうは Docflow のサーバー）が自分の鍵で PDF に署名する。BDF の署名は PDF に移せないので、PDF の署名属性に元の .bdf の manifest の SHA-256 を入れて対応を残す
  keys:
    signer: crypto.Signer と証明書の鎖を受ける。CLI はファイル（PEM、PKCS#12）。Docflow は AWS KMS の非対称鍵（Lambda に秘密を置かない）を候補にする
    relates_to: Print Manager の根の秘密の置き場の論点（requirement:print-manager-auth の key-storage）と同じ所に決める
  validation_plan:
  - BDF の署名は openssl cms -verify -binary -content で、署名する内容の JSON を外から与えて検証する
  - PDF の署名は pyHanko（スクラッチの venv）の validate、qpdf --check、Adobe Acrobat Reader（手で）。PDF/A の出力は署名の後も veraPDF に通す
  - タイムスタンプは openssl ts -verify
  - 改ざんの検査は 1 バイトずつ書き換えた文書（manifest、各 Part、末尾のブロック、PDF の /ByteRange の内と外）で検証が落ちること
  - CMS の読み取りと末尾のブロックに fuzz の的を足す（fuzz-harnesses の FuzzReader と同じ扱い）
  delivery:
    proposed_milestones:
      sig-1: BDF の署名と検証（CMS の自前の実装、末尾のブロックと signatures.json、bdf sign / bdf verify、ファイルの鍵、連署）
      sig-2: PDF の PAdES B-B / B-T（pdfbdf の署名、TSA、DocMDP、サインの欄を見える署名に）
      sig-3: 一部を埋めた帳票の値の署名の連鎖と、Docflow の署名のノード（立会人型、KMS）
      later: B-LT / B-LTA、ビューアでの検証の表示、区間の文書の署名
    order_note: sig-1 と sig-2 は互いに独立。partial-fill（form-m7）は sig-3 より前に入る
history:
  proposed:
    summary: 2026-10-22 利用者がチャットで要望。Claude が spec §3（Part 名、暗号化）、Go の OpenSingle、vector/pdfbdf を読んで設計案を書いた
