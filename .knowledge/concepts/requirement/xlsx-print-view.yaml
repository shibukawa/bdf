id: requirement:xlsx-print-view
type: requirement
title: Excel の印刷ビュー（印刷範囲・ページ設定からページを組む）
summary: xlsx 変換器は今 sheet View だけで、印刷に関する要素を一切読んでいない。印刷範囲・印刷タイトル・ページ設定・余白・改ページ・ ヘッダーとフッターを読み、Excel と同じ規則でページに切った print View
  を足す。帳票の穴埋めの既定の出力であり、PDF 書き出しの Excel 側の入口。
lifecycle: active
authority: authored
aliases:
- print view
- 印刷範囲
- Print_Area
constraints:
- sheet View の描画結果は変えない（golden テスト）
- bdf generate の既定は今までどおり sheet。print は -param views=sheet|print|both で選ぶ。穴埋めは print を既定にする
facts:
  inputs:
    defined_names: workbook.xml の _xlnm.Print_Area（カンマ区切りで複数、順にページが続く。なければ使用範囲）と _xlnm.Print_Titles（繰り返す行と列）
    page_setup: paperSize / paperWidth / paperHeight、orientation、scale、fitToWidth / fitToHeight（0 はその方向を自動）、firstPageNumber、pageOrder（downThenOver
      / overThenDown）、errors（blank など）。sheetPr/pageSetUpPr の fitToPage で拡大率とページ合わせのどちらが有効か
    margins_options: pageMargins（上下左右とヘッダー・フッター）、printOptions（gridLines、headings、horizontalCentered、verticalCentered）
    breaks: rowBreaks / colBreaks（改ページプレビューの手動改ページ）
    header_footer: headerFooter の oddHeader / oddFooter / evenHeader / evenFooter / firstHeader / firstFooter。&L &C &R、&P
      &N &D &T &F &A、&"フォント,スタイル"、&サイズ
  rules:
  - 用紙から余白を引いた印刷可能域に、拡大率をかけた行と列を順に詰め、行や列の境で切る。1 行が 1 ページより高ければ途中で切る。非表示の行列は入れない
  - ページに合わせる: 横 n 縦 m ページに収まる最大の拡大率を 10% まで下げて探す。0 の方向は自動
  - 手動の改ページは必ず守り、その間を自動で補う
  - 印刷タイトルはそれ自身を含むページでは重ねず、ほかのページの上と左に置く
  - ヘッダー・フッターは 3 区画。奇数・偶数と先頭ページの別
  design:
    view: Word と同じ flow View。body = 印刷可能域、レイヤーは background / header / footer / body。ビューアの紙と連続の両表示、PDF 書き出しがそのまま効く
    drawing: '実装: 領域（ページの本体、タイトル行 × 列の帯、行の帯 × タイトル列、角）ごとの Object を 3 層（罫線の下・罫線・罫線の上）で作り、ページの body が CLIP_RECT + TRANSFORM
      + USE で置く。sheetCtx.tilesIn が印刷のときは printPlan.regionsIn を返すので、セルの描画コードはタイルと共通'
    thumbnail: print があればその 1 ページ目の全体にするのが自然
  template_interactions:
  - 行挿入で印刷範囲は数式と同じ規則で広がり、下の手動改ページはずれる。印刷タイトルは挿入位置が中でなければ不変
  - 縦 1 ページ固定のページ合わせのまま明細が増えると全体が縮む。コンパイルの報告で指摘し、設定で自動に切り替えられるようにする
  - ヘッダーの &D &T は決定性を壊す。データか引数から与え、なければ入れない
  - 印刷範囲のないシートは使用範囲を印刷するのでページ数が跳ねうる。報告に範囲とページ数を出す
  fidelity_caveat: Excel は印刷時に行高・列幅をプリンタ解像度の画素に丸めるので、拡大率が 100% でないときや自動改ページが行の境ぎりぎりのときに 1 行ずれうる。「自動の改ページが行の境の数ポイント以内」を警告し、作者が手動改ページに変えられるようにする
  current_state: 2026-10-14 実装。converter/xlsx/print.go と headerfooter.go。Options.Views（sheet / print / both）と -param views=、-param
    paper=。view の id は print1、print2 …（flow View）。設計の説明は docs/design.md §3.6 の「印刷のページ」、利用者向けは docs/formats/spreadsheet.ja.md
  limits:
    pages_per_sheet: 16384
    print_areas: 256
    fit_entries: 4194304
    scale: 10%〜400%
