id: milestone:pm-4
type: milestone
title: pm-4 — トポロジー：場所・プリンタ・キュー（分岐）・クラス（round-robin / failover）・インボックス・保管を 1 つの名前の空間のノードとして組み替え、どのノードも IPP の宛先に
summary: >-
  requirement:print-manager の束ね方（§4、§10 の pm-4）を、利用者の求め（2026-10-21）で保管庫（pm-2）より前に出し、
  ノードの組み替えに広げた。print/manager に Node（queue・class・inbox・archive）と Job・Leg・Item・Delivery を足し、
  受けた文書は 1 つの Job として宛先から辺をたどる：キューは to のすべてに、クラスは members の 1 つに順に（失敗は次のメンバーへ）、
  インボックスは人が流すまで持ち、保管は .bdf と記録の JSON を 1 回だけ書く。プリンタと保管への送りは Delivery として
  借りの下で tick（またはプロセスの背景）が行い、失敗は伸びる間隔で 20 回まで再試行。/ipp/print は CUPS-Get-Printers で全ノードを
  一覧する。同日の利用者の追加（API エンドポイントの入口、.bdft テンプレートとデータからの印刷、英語の画面、倉庫に限らない
  「ソフトウェア定義の帳票ネットワーク」、GUI のレイアウト）で、endpoint（自分の鍵、argon2id のハッシュ、POST /in/<名前> に文書か
  テンプレート id とデータ）、テンプレートの登録（form.Fill が受けるもの）、英語の画面、SVG のキャンバス（ドラッグで配置、口から
  ドラッグで辺、クリックで外す、位置は /api/layout）を足した。/admin にトポロジー・テンプレート・インボックス・ジョブ・送り待ち。
  叙述は knowledge-inputs/print-plan/print-manager-topology.ja.md。
lifecycle: active
authority: authored
scope:
  milestone: pm-4
constraints:
- pm-1 の制約のまま（インスタンスに状態を持たない、常駐に頼らない、popcornweb に依らない、条件付きの書き込みの保存先だけ）
- 場所・プリンタ・経路のノードは 1 つの名前の空間。辺は名前だけで指す
- ノードの PUT で、名指す先の存在・名前の重なり・閉路を確かめる。送り先にされているノードは消せない
- 文書はジョブに 1 つ。要る記録（伝票・項目・送り待ち）が無くなるまで消さない
- 保管のオブジェクトは Manager が変えも消しもしない（Insert は無いときだけ）
