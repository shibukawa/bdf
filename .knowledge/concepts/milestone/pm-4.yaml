facts:
  delivery:
    plan: knowledge-inputs/print-plan/print-manager-topology.ja.md（2026-10-21）
    implemented:
      date: '2026-10-21'
      packages:
      - 'print/manager：model.go（Node、Job・Leg、Item、Delivery）、nodes.go（PUT・一覧・削除、名前の空間、参照、閉路、Topology）、route.go（routing、クラスの選択、Job の記録、取り消し、宛先ごとの一覧、ジョブの片付け）、inbox.go、deliver.go（借りの下の送り、次のメンバー、保管の書き込み、retry、tick）、submit.go（Submit は宛先と Job）、ipp.go（全ノードが宛先、CUPS-Get-Printers / Classes）、http.go（/api/nodes、/api/topology、/api/destinations、/api/jobs、/api/inboxes、/api/items、/api/deliveries）、store.go（コレクション、保管の Blob の cache）'
      - 'print/manager/endpoint.go：エンドポイントの鍵（argon2id、x/crypto が直接の依存に）、/in/<名前>、テンプレートの登録（form.Describe・Fields）と差し込み（form.Fill → submitDoc）、キャンバスの位置（layout）'
      - 'cmd/printmanager：英語の画面（Home は「software-defined document network」、端末は display board）、/admin のキャンバス（SVG）・テンプレート・鍵の表示・インボックス・ジョブ・送り待ちの節（pages.pw.html、admin.js、tablet.js）、MANAGER_JOB_KEEP、Background（サーバーレスでなければ）、README の Topology'
    changed_from_plan:
      - '伝票の ID は <番号>.<場所>（1 つのジョブが 2 つの場所に出る）。文書のコレクションは job-documents'
      - 'IPP の Cancel-Job はジョブの取り消し（伝票の取り消しは CancelSlip に分けた）。完了したジョブでも伝票が開いていれば取り消せる'
      - 'Get-Jobs の既定は not-completed（RFC 8011。pm-1 は全部を返していた）'
      - 'removeSlip は文書を消さず、ジョブの Live を減らす。ジョブと文書は ended-days（終わった日ごとの ID の記録）から JobKeep の後に消す'
    decisions:
      - 'エンドポイントは to に流す入口で、鍵は 1 つ、argon2id（m=19 MiB、t=2、p=1）の PHC だけを保存。鍵は作ったときと回したときに 1 度だけ返す'
      - 'テンプレートは文書の Blob の保存先のコレクション templates。差し込みの入力は JSON の data だけ。エンドポイントの templates で絞る'
      - 'キャンバスは依存なしの SVG。位置は layout の記録 1 つ。辺の追加・削除は PUT /api/nodes を通す（確かめはサーバー）。パン・ズームなし'
      - '画面の文は英語だけ（多言語の仕組みは作らない）。API と記録の名前（location、slip）は pm-1 のまま'
      - '1 つの名前の空間（CUPS の printers と classes と同じ）。辺は名前だけ'
      - 'どのノードも宛先。見せる相手の制限は認証（requirement:print-manager-auth）に任せ、ノードに可視性を持たせない'
      - 'queue = to のすべてに流す（分岐）。class = members の 1 つ（round-robin はクラスごとの数え、failover は先頭）。失敗の後はどちらも次のメンバーへ'
      - '送りは要求の中で行わず Delivery に。プロセスは背景の goroutine、サーバーレスは tick。借り 5 分、再試行 30 秒〜15 分で 20 回'
      - 'インボックスの流す先は to のうちから（to が空なら自由）。インボックスの to も閉路の辺に数える'
      - '保管の鍵は <日>.<番号>.<ハッシュ 12 桁>.bdf / .json。Insert は無いときだけなので 2 度書かない。保持は S3 のバケットの既定の保持に頼る（Object Lock の見出しは yuruidb に無い）'
    found:
      - 'yuruidb の Blob の ID と Collection に / が使えない。保管の接頭辞はコレクションで'
      - 'yuruidb の blob.Store.Insert は入力を一時ファイルに写してから PUT する（Content-Length が要る S3 でも Reader のまま渡せる）'
      - 'ended-days の ID が日付なので、yuruidb の ID 順の一覧がそのまま古い順になり、片付けは先頭から keep の日までで止められる'
      - 'pw の .pw.html は本文の { を式と読む（&#123; で逃がす）。Content-Type の無い JSON（テストの helper）は本文の { で見分けると楽'
    unverified:
      - 'S3・R2・GCS の保管の保存先（bbolt だけ試した）。S3 のバケットの既定の保持と組み合わせた WORM'
      - 'Lambda（pm-1 と同じく未確認）。背景の送りが無い配置で tick だけで回ること'
      - 'CUPS の本物（lpstat -h）からの CUPS-Get-Printers。ipp.Client と偽物の CUPS の形に合わせてある'
    known_gaps:
      - 'ジョブの記録を書いてから足跡を書くまでに落ちると、伝票や Delivery はあるのにジョブの足跡が無い（pm-1 の伝票と同じ種類の隙間）'
      - 'Live の数えは記録の削除と 1 対 1 だが、削除の後の release が失敗すると文書が残る（JobKeep の後も消えない）。見回りは無い'
      - '宛先ごとの一覧は 500 件まで。古いジョブは /api/jobs/<n> でだけ見える'
      - 'クラスのメンバーがクラス・キュー・インボックスのときは routing の時点で辿るので、プリンタのような失敗の後の乗り換えは無い'
