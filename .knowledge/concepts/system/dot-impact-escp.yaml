id: system:dot-impact-escp
type: system
title: ドットインパクト・連続用紙の制御 — ESC/P、IBM Proprinter、COBOL Report Writer、pr
summary: >-
  連続帳票は「行 × 桁」の格子で、用紙長（行数またはインチ）、行送り（6 / 8 LPI）、桁ピッチ（10 / 12 / 15 / 17.1 CPI）、左右マージン、ミシン目スキップで決まる。
  テキスト式テンプレートの古典は COBOL の Report Writer（PAGE LIMIT、HEADING、FIRST DETAIL、LAST DETAIL、FOOTING）と Unix の pr。
lifecycle: active
authority: observed
aliases:
- ESC/P
- Proprinter
- 連続用紙
- COBOL Report Writer
facts:
  escp:
    page_length: ESC C n（行数 1〜127）、ESC C NUL n（インチ 1〜22）
    perforation: ESC N n でミシン目スキップ（下マージン）、ESC O で解除
    lpi: ESC 2 = 1/6 インチ（6 LPI）、ESC 0 = 1/8 インチ（8 LPI）
    cpi: ESC P 10、ESC M 12、ESC g 15、SI で圧縮（17.1）、DC2 で解除
    margins: ESC l n 左、ESC Q n 右
    canon_notes: 既定 6 LPI、用紙長の設定刻みは 1/6 インチ、既定の右マージン 345.4 mm（13.6 インチ）
  proprinter: 'SI = 17.1 CPI、DC2 = 10 CPI、ESC : = 12 CPI。ESC C は現在位置を用紙先頭にする。行の用紙長 1〜255、インチ 1〜14'
  hardware: Epson LQ-2190 は 136 桁、原本＋5 枚複写
  japanese_multipart: ヒサゴのドットプリンタ用納品書は 3 枚複写（納品書（控）/ 納品書 / 物品受領書）。会計ソフトの FAQ は「連続紙」の用紙種を選ばないと 2 枚目がずれると案内
  cobol_report_writer: RD の PAGE LIMIT（省略で連続ストリーム）、HEADING、FIRST DETAIL、LAST DETAIL、FOOTING。CONTROL の階層で CF / CH グループ。INITIATE / GENERATE / TERMINATE。例 PAGE LIMIT IS 66 HEADING 1 FIRST DETAIL 6 LAST DETAIL 42 FOOTING 52
  write_advancing: LINE SEQUENTIAL の印刷ファイルに WRITE … ADVANCING。PC では CR / LF / FF を出す
  unix_pr: 66 行ページ（本文 56）、ヘッダーとトレーラ各 5 行、-l 長さ、-F フォームフィード、-h 見出し、-w 72 幅、-o オフセット、多段、-t 抑止
  relevance: 連帳テンプレートの属性は「用紙長、LPI、CPI、マージン、ミシン目スキップ、桁位置」に収束する。等幅フォントで pt に落とせば BDF の fixed ページで表せる
relations:
- relation: exemplifies
  to: pattern:continuous-text-form
