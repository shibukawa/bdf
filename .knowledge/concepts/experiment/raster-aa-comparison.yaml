    method: integration
    test: go test ./raster/imagebdf ./cmd/bdf (included in repository suite)
    authority: observed
    evidence:
      path: raster/imagebdf/antialias_test.go
      locator: TestAntialias* and cmd TestRenderAntialias/TestRenderBadAntialias
    basis: *id001
  race:
    state: passed
    method: integration
    test: go test -race ./raster/imagebdf ./cmd/bdf -run 'TestAntialias|TestRender|TestCompleted|TestImageCache|TestRegionAnd|TestInvalidate|TestPages|TestCacheEvicts|TestTextMaskCache'
      -count=1
    authority: observed
