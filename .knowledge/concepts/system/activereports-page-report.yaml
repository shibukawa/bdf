id: system:activereports-page-report
type: system
title: ActiveReports の Page report（固定ページレイアウト FPL、OverflowName、RepeatBlankRows）
summary: >-
  MESCIUS（旧 GrapeCity、仙台）の ActiveReports は Section（帯）、Page（固定ページ）、RDL（連続ページ）の 3 種を持つ。
  Page report は実行時に部品が動かない固定ページで、表は FixedHeight を持ち、あふれは OverflowName で同じページか別デザインのページの
  OverflowPlaceHolder に鎖のように流し、RepeatBlankRows で残りを空行で埋める。pattern:fixed-rows-paged-detail の商用実装の明確な例。
lifecycle: active
authority: observed
aliases:
- ActiveReports
- FPL
- Fixed Page Layout
- OverflowPlaceHolder
- RepeatBlankRows
- GrapeCity
- MESCIUS
facts:
  lineage: Data Dynamics（米オハイオ）を 2008 年に GrapeCity（仙台、1980 年創業の文化オリエント）が買収。日本語版「J」エディション。GrapeCity は 2023 年 11 月に MESCIUS に改名
  three_types:
    section: 帯モデル、.rpx（XML）、イベント駆動のコード。ReportHeader / Footer、PageHeader / Footer、GroupHeader / Footer（必ず対）、Detail。CanGrow / CanShrink / KeepTogether / NewPage / NewColumn / RepeatStyle / UnderlayNext、Detail の多段
    page: 固定ページレイアウト（FPL）、.rdlx。部品は実行時に固定。表は FixedHeight。OverflowName → OverflowPlaceHolder（同じページでも別のページタブでも）を鎖に。RepeatBlankRows None / FillPage / FillGroup（旧 RepeatToFill）で FixedHeight まで空行を詰める
    rdl: 連続ページレイアウト（CPL）、.rdlx、SSRS の RDL 基盤
  totals: TextBox の SummaryType（GrandTotal / PageTotal / PageCount …）と SummaryRunning（None / Group / All）。「繰越」という名の機能は見つからず（UNVERIFIED）
  outputs: Section は HTML / PDF / Text / RTF / Excel / TIFF、Page と RDL は画像 / HTML / PDF / XML / Word / Excel（ASP.NET Core では XLSX / DOCX / PDF / CSV / JSON / TIFF）
  paper: 用紙サイズはプリンタドライバ由来。ユーザー定義サイズは管理者権限で 1 つずつ（日本語ドキュメント）。連帳・ドットインパクトの個別事項は UNVERIFIED
  relevance_to_bdft:
  - 固定ページ＋あふれ先の明示＋空行埋めは、日本の固定行数明細をそのまま形式化したもの。.bdft の Excel ブロック複製と同じ意味論で、「あふれ先を別デザインのページにできる」（1 ページ目と 2 ページ目以降で型が違う帳票）は取り入れる価値がある
  - 同じ製品が帯型と固定型と流し込み型を別のレポート種として分けていること自体が、形態を 1 つのモデルに無理に統合しない根拠になる
relations:
- relation: exemplifies
  to: pattern:fixed-rows-paged-detail
- relation: exemplifies
  to: pattern:fixed-page-form
- relation: compared_with
  to: system:svf
assertions:
- predicate: page_report_overflow_mechanism
  value: OverflowName → OverflowPlaceHolder, chained, same page or differently designed page
  authority: observed
  evidence:
    url: https://helpcentral.componentone.com/nethelp/ar7help/onlineen/OverflowDataInMultiplePages.html
- predicate: blank_row_filling
  value: RepeatBlankRows None / FillPage / FillGroup
  authority: observed
  evidence:
    url: https://developer.mescius.com/activereportsnet/docs/latest/online/repeat-blank-rows.html
- predicate: report_types
  value: [Section, Page, RDL]
  authority: observed
  evidence:
    url: https://developer.mescius.com/blogs/page-vs-rdl-vs-section-reports-in-net-c-sharp-application
