id: system:japan-form-products
type: system
title: 日本の帳票製品 — OPRO、Create!Form、VB-Report / ExcelCreator、Paples、帳票発行 SaaS、kintone プラグイン、国産 OSS
summary: >-
  SVF 以外の日本の帳票製品と OSS。固定枠型（Create!Form、プリントクリエイター、pdfme）、帯型（OPRO の Band）、
  Excel をそのまま様式にする型（VB-Report、ExCella、Docurain、RepotoneU）に分かれる。Office アドインで様式を作る製品（OPRO、ViewFramer）もある。
lifecycle: active
authority: observed
aliases:
- OPRO
- OPROARTS
- 帳票DX
- ViewFramer
- Create!Form
- VB-Report
- ExcelCreator
- Paples
- 楽楽明細
- Misoca
- プリントクリエイター
- RepotoneU
- ThinReports
- pdfme
- ExCella Reports
- Fisshplate
- Docurain
facts:
  opro:
    history: OPRO X Server（2003、オンプレ。「帳票生成（自動フォームオーバレイ）、電子化、配信」）→ OPROARTS（2007、SaaS）→ 帳票DX（2022）
    model: Report Engine は DatasetTable（縦）/ HorizontalDatasetTable に Report Header（先頭ページに 1 回）、Column Header（毎ページ、先頭バンドの上）、Band（レコードごと、高さ自動）、Report Footer（最後のバンドの後に 1 回。表の下端に置いて空バンドで埋める、最後のバンドと離さない、の選択）。ページ番号と総ページ数はシステムデータ
    office_addin: OPRO Document Designer for Office（Word / Excel / PowerPoint のアドイン。普通にレイアウトを作ってからデータセットを対応付ける。マクロ・数式可）。ViewFramer は 単票 / ヘッダー明細（1:n）/ 一覧 のテンプレート種別と、PDF テンプレート / Office アドインの 2 つのデザイナ
    outputs: 帳票DX は PDF / Excel / Word / PowerPoint。2026 年に MCP 対応
  create_form:
    model: 独自 GUI デザイナ。PDF / Excel / Word をレイアウトとして取り込める。出力 PDF / HTML（SVG）/ Excel / プリンタ。データは CSV / XML / DB
    index_entries: 「指定した行数で改ページする」「表のキー項目をまとめて次ページに送る」「集計値を先頭ページに表示する」「集計値の行をページ内に収める」「現在のページ数と総ページ数」「外字」「西暦→和暦」。マルチフォーム / セット帳票。連続用紙・複写・縦書きの項目はなし
    multi_form_limit: フォームの順は固定。ページ変数は実行単位で数えるので「表紙→明細」の繰り返しのページ番号はデータから与える
  advance_software:
    vb_report: Excel ファイルが設計。**Name のセルが名前付き変数。Section（header / detail / footer）で行とページを自動挿入。Page.Start / Next、Page.Repeat / Next（全ページが 1 シート。式は Repeat 境界を越えられない）。出力 xlsx / PDF（AES-256、フォント埋め込み）/ SVG。2025-07-23 に販売終了
    excelcreator: Excel 不要の xlsx 生成部品。PDF / HTML、外字埋め込み、v12 で電子署名とタイムスタンプ
  paples: 電子帳票のアーカイブ・印刷・FAX・検索、電帳法。PaplesReports（2021）はノンプログラミングのデザイナで既存レイアウトを取り込む。フォームオーバーレイは UNVERIFIED
  biz_browser: Biz/Browser と Biz/PrintServer はアクシスソフトの製品（業務ブラウザ＋Web 印刷サーバ、大量・高速バッチ印刷）
  saas: 楽楽明細（CSV か PDF をアップロードして Web / メール / 郵送 / FAX。レイアウト変更は限定的で追加費用）、Misoca（適格請求書の項目、電帳法保存）
  kintone:
    print_creator: 背景 PDF にフィールドをドラッグ。複数ページの明細は「レコード範囲（1〜6、7〜17）ごとの別レイアウト」を複数レイアウトでつなぐ。一括出力 500 件
    repotoneu: 既存の Excel / PDF をアップロードしてマウスで対応付け。Excel の式は保持。1 ブック 1 シート。複数ページ・一覧は上位プラン。5000 件上限
  oss:
    thinreports: MIT。.tlf を Basic Editor で作る。header / rows / footer のリスト、ページフッターのコールバックで累計、pageno、複数レイアウト、Prawn で PDF
    pdfme: basePdf＋schemas。表プラグイン（v4.5+）は basePdf が空白のときだけ新しいページに続く。固定 PDF を下地にすると動的レイアウトなし
    excella: Apache-2.0。Excel のタグ ${}、$R[]{name,breakNum=5,changeBreak,hideDuplicate}（breakNum で N 行ごとに改ページ）、$C[]、$BR[]、$I 画像、$BREAK。xls / xlsx / PDF
    fisshplate: Seasar の Excel テンプレートエンジン（構文は UNVERIFIED）
    docurain: SaaS。Excel テンプレート、$ プレースホルダー、#foreach（行は出力時に削除）、#set、#ROW()
  relevance_to_bdft:
  - Excel をそのまま様式にする型は日本で定着している（VB-Report、ExCella、Docurain、RepotoneU、SVF Ver.10）。.bdft の Excel 入力は既存ユーザーの作法に沿う
  - breakNum（N 行ごとに改ページ）と「レコード範囲ごとの別レイアウト」は pattern:fixed-rows-paged-detail の 2 つの実装様式
  - Office アドインで様式を作る製品（OPRO）は、将来のエディタの 1 つの形（requirement:form-editor）
