id: component:drawingml-autofit
type: component
title: drawingml のテキスト枠は折り返しと表の行は計算するが、自動調整は PowerPoint の保存値に頼る
summary: >-
  converter/internal/ooxml/drawingml は枠の中の折り返しを XML から組み直し、表の行の高さを内容から伸ばす。
  一方 normAutofit の縮小率（fontScale, lnSpcReduction）と spAutoFit 後の図形の大きさ（xfrm）は PowerPoint が保存した値をそのまま使い、
  収まるかどうかの再計算はしない。穴埋めで文字を差し替えると、この 2 つは古くなる。
lifecycle: active
authority: observed
aliases:
- normAutofit
- spAutoFit
facts:
  computed: [枠の中の行分割（paragraphs → layoutBlock）, 表の行の高さ（内容が入らなければ伸ばす）, 段落の箇条書き・レベル・スタイル継承]
  stored: [normAutofit の fontScale と lnSpcReduction, spAutoFit の図形の大きさ（shape geometry の textRect は xfrm 由来）]
  no_cross_shape_flow: PowerPoint に連結テキストボックスはなく図形どうしは押し合わない。表が伸びてもスライドの下にはみ出すだけ
  fill_additions:
  - 縮小の再計算ループ（10% 刻み、下限 25%、行間縮小 20% まで）
  - spAutoFit の高さの再計算（上端固定で下へ）
  - あふれの方針（切る / はみ出す / エラー）
  - 表のあふれでスライドを複製（貪欲に詰める）
  seam: 'drawShapeText → textFrame{body: txBody node} → renderText。XML の node を直接組むので、穴埋めはスライドの Node 木の a:t を置換する'
assertions:
- predicate: recomputes_autofit_shrink
  value: false
  authority: observed
  evidence:
    path: converter/internal/ooxml/drawingml/textframe.go
    locator: 'lines 128-131: fontScale = af.AttrPct("fontScale", 1); lnReduce = af.AttrPct("lnSpcReduction", 0)'
- predicate: grows_table_rows_to_content
  value: true
  authority: observed
  evidence:
    path: converter/internal/ooxml/drawingml/table.go
    locator: 'lines 150-177: lay out text and grow rows'
- predicate: lays_out_text_from_xml_nodes
  value: true
  authority: observed
  evidence:
    path: converter/internal/ooxml/drawingml/textframe.go
    locator: 'drawShapeText line 13: textFrame{body: tb} from sh.n.Child("txBody")'
relations:
- relation: enables
  to: pattern:slide-repeat
