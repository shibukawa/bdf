id: requirement:document-flow
type: requirement
title: Print Manager のトポロジーを汎用のドキュメント変換フロー（ETL）に — 辺と口の 3 つの種類（bdf・data・any）、入口の convert と data のフラグ、テンプレート変換・コンバート・描画・branch・通知・人の操作・入出力（SMTP・FTP・S3）のノード、登録した外部サービスが行う変換
summary: >-
  2026-10-21 利用者の構想。milestone:pm-4〜pm-5c のトポロジー（ジョブ＝常に .bdf の文書 1 つ、辺は名前だけ、変換は入口で同期）を、
  データベースを想定しない汎用の ETL／ドキュメント変換フローに広げる。辺とその接合部（口）に 3 つの種類を設ける：bdf だけ、
  「データ」（JSON・YAML・CSV・Excel・Parquet）、それ以外も流れる any。入口（API エンドポイント、CUPS サーバー）は convert の
  フラグで出力が bdf か受けたままかを変え、API は data だけを受けるフラグで出力が data になる。data はテンプレート変換ノードで
  bdf に、any はコンバートノードで bdf に強制キャストできる。API は追加のメタデータを送れ、変換（テンプレートの選択）や branch の
  条件分岐のパラメータになる。branch は枝を増やせ、入力の種類がそのまま出力の種類になる（多相）。printer と外部 CUPS への送りの
  入力は bdf だけ。archive はどの種類でも受ける。入出力のノードに SMTP・FTP(S)・S3 を足し、データ変換は登録した外部のマイクロ
  サービス（企業固有の正規化など）が行う。同日の利用者の答え：メタデータは IPP・HTTP で受けたものも受信日時・ファイル名・送り手の
  ようにナイーブに決まるものも全部、送りは at-least-once でよい、Lambda の 6 MB は簡易の形で本命は ECS・Cloud Run、失敗も含めて
  Slack・メールへの通知ノード、bdf → PDF の描画ノードは入れるが別拠点の Print Manager へ .bdf のまま送る出力も残す、人の入力の入口と
  スタンプ・署名の人の操作のノード、テンプレートはテンプレート変換ノードに移しエンドポイントは暗黙の変換をしない（データ受信の
  エンドポイント + テンプレート変換）、S3 は入口が S3 Trigger で出口は書きっぱなし。Claude の整理：種類は口が宣言し辺の種類は口から
  決まる、多相の口は上流からの推論で PUT の型検査に乗せる、ジョブの中身を「ペイロードの列 + メタデータ」にして変換をノードの
  非同期の段（Delivery の一般化）にする、送り手のメタデータは名乗りで権限の根拠にしない、出口の資格は名前で指す。
  叙述は knowledge-inputs/print-plan/document-flow.ja.md。
