acceptance:
  f1-build:
    text: examples/docflow-custom で pw build（と go build）が通り、1 つのバイナリができる。cmd/docflow も今のまま通る
    verified_by: [example-build]
  f2-palette:
    text: 見本のバイナリの /topology で、パレットに folder が自分の題・説明・アイコンで出る（役割 exit の見出し sink の下、Group で上書きできる）
    verified_by: [editor-browser]
  f3-form:
    text: folder を置くとサイドバーに Fields の欄（dir・path・overwrite）が型どおりの部品で出て、必須の dir を空のまま離れると警告色、Add で PUT され settings に入る
    verified_by: [editor-browser, framework-tests]
  f4-flow:
    text: upload → folder のトポロジーにファイルを送ると、ディレクトリに path の名前で書かれ、ジョブは completed
    verified_by: [example-tests]
  f5-validation:
    text: settings の型違い・必須の欠け・enum の外の値は PUT で 400 になり、文に欄の鍵が出る。登録の無い種類は今のまま 400
    verified_by: [framework-tests]
  f6-kinds-api:
    text: GET /api/kinds が芯の種類についても titles・icon・group を返し、エディタが固定の表なしで今と同じ絵（アイコン・色・パレット）を描く
    verified_by: [framework-tests, editor-browser]
  f7-assets:
    text: /_docflow/app.css と /_docflow/topology.js が ETag つきで配られ、pw の /public は空のアプリ（cmd/docflow）でも動く
    verified_by: [handlers-tests]
  f8-flowtest:
    text: 見本の go test が docflow/flowtest で folder の Send と Required を確かめる
    verified_by: [example-tests]
