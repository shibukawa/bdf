id: component:fontdb-resolution
type: component
title: fontdb / fontset のフォント解決（代替表・総称・予備・system 参照）
summary: >-
  internal/fontdb が名前を正規化して面を探し、組み込みの代替表と総称ファミリーの連鎖で代替し、converter/internal/fontset が
  文字ごとの面の選択・計測・サブセット埋め込み・system フォント参照の CSS ファミリー列を担う。帳票のフォント規則（decision:font-rules）はこの上に重ねる。
lifecycle: active
authority: observed
facts:
  resolve_order: [要求ファミリーそのもの, substitutes の代替（メトリクス互換か見た目が近い）, 重いファミリー名は太字扱い, CJK なら jaGothic / jaMincho → zhHans → koGothic, 総称（Liberation / Arimo / Arial …）, 最後は何かの面]
  substitutes_examples: Calibri→Carlito、Cambria→Caladea、Arial→Liberation Sans / Arimo、游ゴシック / メイリオ / MS P ゴシック→Noto Sans CJK JP … IPAexGothic … M PLUS 1p、MS ゴシック→IPAGothic など等幅の連鎖、MS 明朝→等幅の明朝の連鎖
  fallbacks: 字のない文字は Fallbacks（総称 → CJK の連鎖 → 記号フォント → 64 面以下なら全部）で拾う。どこにもなければ ReportMissing が警告
  system_font_record: fontset.Font は埋め込まない面について "要求", "解決した面", 総称 の CSS ファミリー列を bdf.SystemFont に書く
  normalize: NFKC → 小文字 → 空白・ハイフン・下線・全角空白を除去。「ＭＳ 明朝」は ms明朝
  pua: fontset は私用領域の文字をグリフ番号で描く経路（glyphs map）を持つ（記号フォント用）
  not_present: [利用者が宣言する規則ファイル, IVS（異体字セレクタ）の扱い, BIZ UD ゴシック / 明朝の連鎖への登録]
assertions:
- predicate: has_builtin_substitute_table
  value: true
  authority: observed
  evidence:
    path: internal/fontdb/resolve.go
    locator: var substitutes (lines 17-81), jaGothic / jaMincho chains (lines 84-87)
- predicate: normalizes_names_with_nfkc
  value: true
  authority: observed
  evidence:
    path: internal/fontdb/fontdb.go
    locator: 'Normalize (line 430): NFKC, lower case, strip spaces'
- predicate: handles_ivs
  value: false
  authority: observed
  evidence:
    path: converter/internal/fontset/fontset.go
    locator: grep for E0100 / variation selector finds nothing in fontset, fontdb, wordproc, xlsx (2026-10-13)
- predicate: includes_biz_ud_in_chains
  value: false
  authority: observed
  evidence:
    path: internal/fontdb/resolve.go
    locator: grep BIZ / UDGothic / UDMincho finds nothing (2026-10-13)
