id: milestone:fw-1
type: milestone
title: fw-1 — 独自の種類：Node.Settings と Kind.Fields、API から作るパレットとフォーム、docflow/web への移動、flowtest の公開、見本の folder
summary: >-
  requirement:docflow-framework の最初の段。外のモジュールが独自の種類を 1 つ足した Docflow を pw build で組め、エディタにその種類が
  欄つきで出て、ジョブが流れる。芯に Node.Settings と Kind.Titles/Help/Group/Icon/Fields/Doc/Handler を足し、KindInfo で返す。エディタは
  GET /api/kinds からパレット・アイコン・役割の表・設定のフォームを作る（芯の種類の専用の欄はそのまま）。cmd/docflow/handlers・
  messages・help・public を docflow/web に移し、web.RegisterConfig・Main・Run・Options（Routes・Nav・Public・Preset は fw-2/3 で
  埋める）を公開する。docflow/web は自分の JS・CSS を /_docflow/ で配る。docflow/internal/flowtest を docflow/flowtest に。
  examples/docflow-custom（入れ子のモジュール）に folder の出口を書く。2026-10-26 利用者「暫定の答え（1 = A、3 = A、他も既定）のまま
  milestone:fw-1 を実装してください」で同日に実装した（facts.implementation）。
lifecycle: active
authority: authored
scope:
  milestone: fw-1
constraints:
- 芯（docflow、io、render）は popcornweb を import しない
- Node.Settings は独自の種類のもの。芯の種類と今のアダプタの平らな欄は変えない。保存済みのノードはそのまま読める
- PutNode は Settings を Fields に照らす（型・必須・enum と catalog の値）。Check の前。400 の文に欄の鍵を出す
- GET /api/kinds に titles・help・group・icon・fields を足す。エディタの pages.pw.html の固定のパレットと canvas.js の ICONS・ROLE_OF・PASSES_ON・MAKES_BDF・TAKES_STOCKED・PRINTS をやめる
- 汎用のフォーム（fieldsForm）は独自の種類だけに使う。芯の種類とアダプタの専用の欄は今のまま
- docflow/web の画面は WriteHTMLChain(w, r, nil, leaf)。資産は /_docflow/ で embed から（ETag・Cache-Control no-cache）。bdf の popcornweb.toml から [assets] を外し、cmd/docflow/dist と manifest を消す
- cmd/docflow は web.RegisterConfig と web.Main だけ。bdf の popcornweb.toml は [generate] と [i18n].catalog を docflow/web に向け、[assets] を外す。CI の pw generate の差分の確認も docflow/web に移る。pw dev・pw build・go test ./cmd/docflow/... が今のまま通る
- 見本 examples/docflow-custom は go.mod（replace ../..）と popcornweb.toml を持ち、CI で go build・go test・pw generate の差分なしを見る
non_goals:
- カタログ・接続・プリセット・YAML（fw-2）
- 独自の画面・ナビ・ロール・help の登録（fw-3。Options の口だけ空で置く）
- 今のアダプタの settings への移行
- 独自の口・コレクション・定期の仕事（fw-4）
