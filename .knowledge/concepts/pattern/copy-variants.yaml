id: pattern:copy-variants
type: pattern
title: 複写・控え（同じデータを複数の型に）
summary: >-
  複写伝票の電子版。1 件のデータから「正」「控」「お客様控」「経理用」など、見出しや項目の有無が少しずつ違う複数のページを作る。
  紙の複写では同時に印字されていたものを、テンプレートの変種として表す。
lifecycle: proposed
authority: authored
facts:
  forms:
    stamp_variant: 同じレイアウトで「控」の文字や透かしだけが違う → テンプレートの条件タグ {{#copy}}控{{/copy}} と、変種のリストを渡して繰り返す
    layout_variant: 項目の有無が違う（運送用に金額を出さない）→ 同じ .bdft の中に複数のページ型（Excel なら複数シート、Word なら複数セクション、PPT なら複数スライド）を持ち、データで選ぶ
  bdf: 変種どうしで共通の静的部分は同じ Object として共有される
  bundle: 1 件の文書が「表紙＋明細＋別紙＋控」の束になることが多い。Excel の複数印刷範囲・複数シートの順が束の順
relations:
- relation: member_of
  to: taxonomy:form-layout-axes
