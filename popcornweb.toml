# Docflow (cmd/docflow) is a Popcorn Web application; pw
# finds a project by this file, next to go.mod. Each purpose reads only the
# directories listed here: the rest of the module is not pw's.
[project]
name = "docflow"
main = "./cmd/docflow"

# go build names the binary after the main package and writes it to the
# root, where the module's docflow package already is: pw build writes it
# here instead.
[build]
output = "bin/docflow"

[generate]
handlers = ["cmd/docflow/handlers"]
templates = ["cmd/docflow/handlers"]
config = ["cmd/docflow/handlers"]
queries = []

# The application's public tree is with it, not at the module's root
# (package bdf): pw builds cmd/docflow/public into dist/public there,
# beside public.go of package main, which embeds it.
[assets]
public = "cmd/docflow/public"
derived = "cmd/docflow/dist/public"
embed = "cmd/docflow/public.go"

# pw dev runs pw's development OpenID Provider (dev only: pw doctor flags
# it in any other environment) and gives Docflow its issuer and a
# client of the run (AUTH_OIDC_*). Its people are cmd/docflow's
# roster; config.dev.toml makes docflow-admins the administrators.
[dev.idp]
enabled = true
config = "cmd/docflow/devidp.toml"

# The pages are in English and Japanese: in the language a person chose
# with the bar's switch (pw's cookie), else the browser's
# (Accept-Language), else English. The texts of the templates are the
# catalog's (cmd/docflow/messages); the scripts' are public/ja.js. The
# API is not translated: handlers.App puts only the pages behind the
# negotiation.
[i18n]
locales = ["en", "ja"]
default_locale = "en"
catalog = "cmd/docflow/messages"
cookie_routes = ["/"]

[i18n.label]
en = "English"
ja = "日本語"
