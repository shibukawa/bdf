# Docflow's settings in development (pw dev, or go run
# ./cmd/docflow from here; APP_ENV unset or dev). Secrets go in
# .env.local (.env.example). Under pw dev, the IdP is pw's development
# provider (popcornweb.toml [dev.idp]), whose people are
# cmd/docflow/devidp.toml.

[docflow]
# plain http on localhost: the devices' cookie without Secure
secure_cookies = false
# devices on the network (a tablet) make their keys over HTTPS: a
# certificate of this computer signed by itself, kept in the user's
# cache, which a device's browser warns about once
https_port = 8443

[oidc]
groups_claim = "groups"
admin_groups = ["docflow-admins"]
