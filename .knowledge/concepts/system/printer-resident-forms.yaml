id: system:printer-resident-forms
type: system
title: プリンタ常駐フォーム — Xerox LCDS / Metacode / VIPP、PCL マクロ、PostScript form、PDF/VT と PPML
summary: >-
  フォーム（静的部分）をプリンタやコントローラに置き、ジョブは可変データだけを送る方式と、
  可変データ印刷でページ間の再利用資源を 1 回だけ定義する標準。いずれも「静的を 1 回、可変を毎回」という分離を印刷ストリームの側で実現する。
lifecycle: active
authority: observed
aliases:
- LCDS
- Metacode
- VIPP
- DJDE
- PCL macro
- execform
- PDF/VT
- PPML
facts:
  xerox:
    lcds: EBCDIC のインパクトプリンタ用行データ起源。位置や書式の情報を持たず JSL と DJDE に頼る。フォームはプリンタに保存して再送を避ける
    djde: 行データに印刷制御（改ページ、フォント変更）を差し込む Xerox の規格。FRM フォーム資源を DJDE で包んでプリンタのディスクに置く
    vipp: PostScript 辞書のマクロ。Database（区切りファイル、請求）、Line（既存の行データ印刷にオーバーレイ・フォント・色を足す）、XML、Native の各モード。(formname) SETFORM でコントローラ上のフォームを呼ぶ
  pcl: マクロ = 保存した命令群（レターヘッド）。call / execute / overlay で呼び、overlay はページ印字の最後に必ず走る。Esc&f#X で定義・永続化・自動オーバーレイ。永続化しなければ一時
  postscript: Level 2 の form 辞書 {FormType 1, BBox, Matrix, PaintProc} を execform で描く。出力はグラフィックス状態だけに依存し、CTM で位置を決め、キャッシュされる
  pdf_vt: ISO 16612-2。DPart の階層（内部ノード = 部、葉 = 受取人のページ）と DPM のキー値、DPartRoot の record level。再利用は XObject。PDF/VT-1（PDF/X-4 基盤）、-2（外部参照）、-2s（MIME ストリーミング）
  ppml: PODi 2000 の XML。資源を 1 回定義して 1 回ラスタライズし URL とチェックサムで参照。PPML/GA は PS / PDF / TIFF / JPEG の資源
  relevance: BDF の内容アドレスの Object 共有は、PDF/VT の XObject 再利用や PPML の資源参照と同じ狙いを文書形式の側で持つ
