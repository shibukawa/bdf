id: decision:fill-at-converter-seams
type: decision
title: 穴埋めは各変換器の内部モデルの継ぎ目で行い、Office ファイルは書かない
summary: OOXML を書き換えてから変換器に通す案（穴埋め済みの Office ファイルが副産物になる）は捨て、 各変換器が組版の直前に持つ内部モデル（Word は測り済みの文字 item、PowerPoint はスライドの
  XML 木、Excel は行とセル）を メモリ上で書き換え、既存の組版をそのまま走らせて .bdf を出す。
lifecycle: accepted
authority: authored
aliases:
- 継ぎ目で穴埋め
- no office output
facts:
  rejected:
    ooxml_rewrite: xmlro のトークン位置で XML を切り貼りし、穴埋め済みの .docx / .xlsx / .pptx を作って変換する案。Office の意味論がただで手に入り、Excel で開いて確認できる利点があったが、利用者は
      Office ファイルを作りたいわけではない（2026-10-13）
    precompiled_static_objects_only: .bdft を「静的 Object＋箱の表」だけにする案。Word と PowerPoint は結局組版エンジンを穴埋め時に走らせるので、Excel
      だけ別の仕組みにする理由が薄い。静的 Object の分離は最適化として後から足せる（同一内容は内容アドレスで既に共有される）
  seams:
    word: '実装（2026-10-14）は PowerPoint と同じく XML の要素の木の段階。ConvertDOCX が document.xml を読んだ Node の木を、walker.blocks に渡す前に複製しながら穴埋めする（converter/internal/wordproc/template.go）。当初の案だった「測り済みの
      item を addText で置換」は採らなかった: 木の段階なら番号・フィールド・テキストボックス・ヘッダーとフッターが既存の読み手のままで働き、PowerPoint と同じ規則（段落が単位、いちばん小さい共通の入れ物）で書ける'
    pptx: 実装済み（converter/pptx/template.go）。スライドの Node 木で段落の run をまとめてタグを探し、段落・表の行・スライドを複製する。値を入れた枠は bdf-refit の印で
      normAutofit / spAutoFit を計算し直し、行が増えた表はスライドを複製して続ける
    excel: 行とセルの構造体に行を挿入し、式を再計算し、印刷設定でページに切る（requirement:xlsx-print-view）
  bdft_contents:
    common: テンプレート定義の Part（フィールド名・型・繰り返し・書式・必須、フォントの固定、サンプル）、固定したフォント本体、サンプルデータで穴埋めしたプレビューのページ
    word: docx 本体を私的 Part として持ち、穴埋めのたびに読む段階から回す（測り済みモデルの直列化は wordproc の変更への追随が割に合わない）
    pptx_excel: 同様に元ファイルを持つのが最も単純。幾何だけの直列化は Excel なら可能だが第 1 段階では不要
  fill_cost: 帳票規模の Office ファイルなら読む段階は数ミリ秒。穴埋め時に Office を「読む」ことは許容し、「書く」ことはしない
  output_views: 穴埋めの出力は page View だけを既定にする（Word の scroll View、Excel の sheet View は帳票に不要で組版が 2 回走る）
  benefits_kept:
  - 行の高さの自動調整、表の行の分割、見出し行の繰り返し、PAGE / NUMPAGES、keepNext は各変換器の既存機能のまま
  - 同じ内容の Object は内容アドレスで共有される（pptx のマスター、Word のヘッダー・フッター）。帯や箱を分離すれば本文の静的部分も共有できる（後の最適化）
relations:
- relation: supersedes
  to: decision:ooxml-rewrite-fill
- relation: depends_on
  to: component:wordproc-pagination
- relation: depends_on
  to: component:drawingml-autofit
history:
  first-proposal:
    summary: 2026-10-13 最初の提案は OOXML 書き換え方式。利用者「出力先は .bdf です。.pptx などをつくりたいわけではない」で撤回
  second-proposal:
    summary: 同日、静的 Object を事前に組む .bdft 案を提示。Word の改ページが自前計算だと分かり、継ぎ目で穴埋めする案に収束
