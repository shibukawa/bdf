history:
  proposed:
    summary: >-
      2026-10-21 利用者の 3 つの発言（facts.request）を受け、/knowledge-memory で整理した。main（#118、pm-4 と pm-auth-1 まで）の /admin（pages.pw.html、admin.js）と
      print/manager の記録（Location・Printer・Node・Template）と API を読んで現状（facts.current_state）を書き、ページ・エディタ・流れ・利用者の表示の案と、
      利用者に確かめる問い（open_questions）を立てた。暫定の選択（facts.delivery.provisional_choices）は Claude のもので未確認
  answered-1:
    summary: >-
      2026-10-21 利用者が AskUserQuestion で 4 つに答えた：テンプレートはエンドポイントの持ち物（推奨どおり）、「ポート設定」は TCP のポートで Lambda では
      エンドポイントごとに別のインスタンス（推奨の「入口の URL」は採らなかった）、アプリはエンドポイントと別に登録（推奨の「エンドポイント＝アプリ」は採らなかった）、
      仮想プリンタは sink のノードと偽プリンタの絵の両方。ポートの答えから port-protocol（既存の制約との折り合い）と port-serverless を新しく立てた。
      利用者に見せる範囲（user-view-scope）と milestone の分け方（slice）は聞いておらず、推奨のまま open
  answered-2:
    summary: >-
      2026-10-21 利用者「APIはIPPの口ではなく、印刷機能を持ったWebサービスとRESTで繋がる口です。其れとは別にCUPSサーバーノードは必要かと思います。
      いっぱんユーザーは全体ノードと自分の権限で見れるジョブなどだけにします」。port-protocol を答え（API は REST、IPP は CUPS サーバーのノード）、
      user-view-scope を答え（A）、入口のノードを API と CUPS の 2 種類にして cups-server-node の問いを立てた。既存の制約（LPD・9100 の受け口なし）との
      ぶつかりは無くなった。port-serverless の推奨を A から B に改めた
  answered-3:
    summary: >-
      2026-10-21 利用者「全ノードは一旦見えても良いかなと思います。サーバーレスは外部からのAPI連携の入り口ぐらいですかね。そういう意味ではAPIエンドポイントの1つと言えるかと思います。
      外部lambdaから受けられる、パスパラメータに入力ノードIDが入ったAPIを作る感じですかね」。cups-server-node を答え（全ノードを一旦見せる）、port-serverless を答え
      （入口ごとのインスタンスは立てず、外部の Lambda が POST /in/{node} を叩く。既にある口）。入口のノードのポートはプロセスで動くときだけにした
  pm-5c-implemented:
    summary: >-
      2026-10-21 利用者「5cをお願いします」。milestone:pm-5c に実装した：endpoint の port（REST）と新しい種類 cups（IPP、全ノードを見せる、tls_cert・tls_key）、
      プロセスの listener（OnChange と tick で reconcile、サーバーレスは NoPorts）、sink（latest 件、サムネイル、/api/jobs/<n>/pages/<p>.png）、プリンタの preview（偽プリンタの農場の API を取り次ぐ）
  pm-5b-implemented:
    summary: >-
      2026-10-21 利用者「pm-5b を始めてください。main から新しいブランチで」。milestone:pm-5b に実装した：/topology（誰でも、読むだけ）、GET /api/topology を利用者に
      （設定なし）、GET /api/topology/live（CanSee の分の数と足跡、ETag）、canvas.js をエディタと共有して数のバッジと点。暫定の live_transport（4 秒のポーリング）のとおり
  pm-5-implemented:
    summary: >-
      2026-10-21 利用者「pm-5 の実装をこのセッションで始めてください」。milestone:pm-5 に実装した：ページの分割、エディタとサイドバー、
      Location と Printer を Node に畳む、テンプレートと accept・formats はエンドポイントの持ち物。暫定の選択のうち records（/api/nodes に寄せる、互換なし）、
      canvas_library（依存なしの SVG）、pages（ページごとの JS）、template_ids（<endpoint>.<id>）をそのまま使い、live_transport は pm-5b へ
  superseded-template-owner:
    summary: >-
      2026-10-21 利用者「テンプレートはテンプレート変換ノードに移動します。エンドポイントは暗黙の変換はせずに、データ受信エンドポイント＋テンプレート変換が良いかと」。
      template-ownership の A（エンドポイントの持ち物）と endpoint-mode の accept template は requirement:document-flow で改まる。実装はまだ pm-5 のまま
  answered-4:
    summary: >-
      2026-10-21 利用者「PDFだけ、などのファイル形式も考えていた。余計なファイルを受けない様に。2のスライスは了解です」。endpoint-mode を答え（file / template / both に
      受ける形式の一覧を足す）、slice を答え（pm-5・pm-5b・pm-5c）。利用者の問いはこれで全部に答えがつき、残りは deferred の node-edit-live と Claude の暫定の選択だけ
