      locator: 'OnCreated のエラーでプリンタのジョブが取り消される（Create-Job と Print-Job の両方）、OnSent、Check が終わりを m1 と同じ誤りに写す、Ticket の JSON の往復と Merge、TrustBackend と Pinned、ipptest の停止・再開・履歴の消去・途中の切断・応答前の切断'
