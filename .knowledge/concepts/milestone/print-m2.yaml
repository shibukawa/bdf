acceptance:
  s1-hooks:
    text: print.Options の OnCreated（Create-Job の直後、送る前）と OnSent、Printer（能力を聞き直さない）、公開した print.Check（1 回聞いて終わりを誤りに写す。m1 の wait はその繰り返し）、Ticket の JSON（キーは IPP の属性の名前）と Merge、ipp.TrustStore の Backend。m1 の bdf print の動きは変わらない
    verified_by:
    - print-unit
  s2-store:
    text: db.go（bbolt）で記録と索引の往復、索引の順、連番が戻らない、文書の往復（塊の境目、0 バイト、範囲の読み取り、SHA-256）、受け付け中に落ちた文書の掃除、GC が通る。閉じて開き直しても同じ、2 つ目の起動をロックで断る、詰め直しと写しで中身が変わらない
    verified_by:
    - db-unit
    - spool-unit
  s3-scheduling:
    text: キューの順（優先度、投入順、保留と時間帯）で流れ、max-inflight 2 でプリンタの中に 2 つまで、組の any と failover が 1 台の停止でもう 1 台に回り、接続の失敗は間隔を延ばして再送し、プリンタ側の中止は再送しない。取り消し・保留・解除・再送・移しが効く
    verified_by:
    - fake-printer-scheduling
  s4-no-duplicates:
    text: Create-Job の前、Create-Job の応答の前、記録の後で送る前、送る途中、送った後、履歴を持たないプリンタ、のどこで子プロセスが落ちても、同じ spool.db を開き直した bdf printd が照合してプリンタが刷るのは 1 回。照合できないときは pending-held（bdf-duplicate-check）
    verified_by:
    - crash-recovery
  s5-server:
    text: bdf printd が設定のキューとプリンタで起動し、HTTP API で投入・一覧・操作・実績・写し・SSE ができ、トークンとキューごとの許可が効き、loopback 以外で TLS が無いと起動しない。/metrics と状態のページが見える
    verified_by:
    - http-api
  s6-client:
    text: bdf print -server が投入して帰り（-wait で待ち、m1 と同じ意味の終了コード）、bdf jobs が一覧と操作と実績の書き出しをし、変換器の入力はサーバーで変換されて刷られ、暗号化した文書はパスワード待ちを経て刷られる
    verified_by:
    - cli
    - ci-ippeveprinter
verification:
  print-unit:
    state: not_run
    method: unit
    test: go test ./print/ ./print/ipp/（OnCreated のエラーでプリンタのジョブが取り消される、Check、Ticket の JSON の往復と Merge、TrustBackend）
  db-unit:
    state: not_run
    method: unit
    test: go test ./print/spool/ -run DB（一時ディレクトリの spool.db）
  spool-unit:
    state: not_run
    method: unit
    test: go test ./print/spool/（遷移の表、保留の時間帯と再送の間隔は偽の時計で、GC）
  fake-printer-scheduling:
    state: not_run
    method: integration
    test: go test ./print/spool/ -run Sched（ipptest の 2 台、停止と再開、max-inflight）
  crash-recovery:
    state: not_run
    method: integration
    test: go test ./print/spool/ -run Recover（子プロセスを決めた時点で os.Exit させ、同じ spool.db を開き直し、ipptest が受けたジョブを数える）
  http-api:
    state: not_run
    method: integration
    test: go test ./print/server/（httptest。認証、限界、SSE、写し、エラー）
  cli:
    state: not_run
    method: integration
    test: go test ./cmd/bdf/ -run 'PrintServer|Jobs|Printd'
  three-os:
    state: not_run
    method: integration
    test: CI の print-os（Windows と macOS）で go test ./print/...。bbolt のロックと詰め直しの置き換え
  ci-ippeveprinter:
    state: not_run
    method: integration
    test: test/print/ci.sh の bdf printd の段（ippeveprinter につなぎ、投入・取り消し・再起動をまたいで二重でないこと）
open_questions:
  documents-in-db:
    text: 文書も spool.db の中に置く（1 ファイルで写しと移しが楽。ファイルは縮まず詰め直しが要る）か、文書だけ隣のディレクトリに置くか
    state: open
    resolution: 暫定で中に置く（1 MiB の塊。起動時と bdf printd -compact で詰め直す）。文書はジョブごとに持ち、ジョブをまたいで共有しない（GC が単純。要件の「内容アドレスで同じ文書は 1 回」を改める）
  scale-out-seams:
    text: 複数台・Lambda の継ぎ目（保存のインターフェース、借り、段）を m2 に入れるか、1 台に絞って単純に書くか
    state: answered
    resolution: 1 台に絞る。2026-10-19 利用者「store レイヤーは一旦頑張らずに bbolt 前提で良い」。段（convert・send・watch）は再起動の後の照合のために残す。bbolt に触るのは db.go だけにして、後で薄い保存層（decision:thin-store）に替える位置にする
  default-listen:
    text: 既定の束縛を 127.0.0.1:8640 にし、loopback かつトークンが無ければ認証なしでよいか
    state: open
  max-inflight-default:
    text: プリンタの中に溜めるジョブの数（max-inflight）の既定を 1 にするか 2 にするか
    state: answered
    resolution: 2。2026-10-19 利用者「プリンタにためるジョブは 2 がデフォルトでよい」。まだ送っていないジョブは並べ替えと移しが効き、送った後は Cancel-Job で取り消す
  windows-service:
    text: Windows のサービスとしての登録（golang.org/x/sys/windows/svc）を m2 に入れるか
    state: answered
    resolution: 持たない（m2 にも後にも）。2026-10-19 利用者「サービス化は別ツールもあるので自分自身で持たなくても良い」。docs に systemd・launchd・NSSM・WinSW の例
facts:
  delivery:
    plan: knowledge-inputs/print-plan/print-m2.ja.md（2026-10-19）
    slices:
    - 'S1 print の継ぎ目（OnCreated、OnSent、Printer、Check、Ticket の JSON と Merge）、TrustBackend、ipptest の足し算（停止と再開、履歴の消去、送る途中の切断、応答前の切断、which-jobs=all）'
    - 'S2 db.go（bbolt）、job、hold、account、gc と Spool の受け付け・一覧・操作'
    - 'S3 段、回し手（プリンタごとの送り手と見届け、max-inflight、組、描画の枠）、見張り、再起動の後の照合（二重印刷の防止）'
    - 'S4 print/server（設定、API、認証、SSE、/metrics、状態のページ）と bdf printd'
    - 'S5 print/server/client、bdf print -server、bdf jobs、bdf printers -server、受けた入力の変換、暗号化した文書'
    - 'S6 examples/print-server、docs（常駐のさせ方）、CI（bdf printd と ippeveprinter）、.knowledge'
  decisions:
    server_shape: bdf printd（cmd/bdf のサブコマンド）。2026-10-19 利用者
    persistence: 組み込みの KV。go.etcd.io/bbolt v1.5.0 の 1 ファイル spool.db。2026-10-19 利用者
    store_layer: 作らない。bbolt 前提。2026-10-19 利用者「store レイヤーは一旦頑張らずに bbolt 前提で良い」。案は decision:thin-store と store.ja.md に残す
    converter_inputs: 受ける。変換は convert の段（job-transforming）、HTML の外部の画像は取りに行かない、Excel は views=print。2026-10-19 利用者
    max_inflight: 既定 2。2026-10-19 利用者
    service_registration: 持たない。外の道具に任せる。2026-10-19 利用者
    after_m2: m3 と m4 の順は m2 の後で決める。2026-10-19 利用者
  stored:
    jobs: 'ジョブの記録（JSON、1 件 1〜2 KB）: id、uuid、キュー、利用者、チケット、状態と理由、優先度と保留、段と due、試行、プリンタと job-id・job-uri・sent・attempt-started、時刻、枚数、警告'
    documents: 受けたままのバイト列と変換した .bdf。ジョブごと（docs/<id>/original、docs/<id>/bdf）、1 MiB の塊、記録に sha256 と大きさ。読むのは塊ごとの短い読み取り
    others: 連番と形式の版、実績（終わったジョブごと 1 件、既定 400 日）、プリンタの控え、ipps の証明書の指紋
    not_stored: 描いた Raster、パスワード（メモリだけ）、トークン、設定（YAML）
  bolt_layout: 'meta、jobs、idx-due、idx-queue、idx-done、docs（id → original と bdf の塊のバケット）、uploads、acct、printers、trust'
  concurrency:
    in_process: プリンタごとに送り手 1 本と見届け 1 本、変換と描画は CPU 数の枠。bbolt は読み取りが並行、書き込みは 1 つずつで短い。順は（優先度、受けた時刻、id）
    across_processes: 1 つの spool.db は 1 プロセスだけ。時刻だけでは取り合いを防げない（2 つが同時に同じジョブを見る）。複数台にするなら、勝つのは条件付き書き込みの 1 つにし、借りの期限は落ちた持ち主から引き継ぐために使う（m2 の後）
    scale_out_stores: m2 の後に db.go を薄い保存層（decision:thin-store。S3 互換、GCS、Azure Blob、DynamoDB、RDB）に置き換える
  lambda:
    fits: 受け付け（API Gateway＋Lambda、大きな文書は S3 の署名つき URL）、変換と描画（provided.al2023、フォントはコンテナ イメージ）、段の実行（EventBridge Scheduler や SQS の遅延で due に Step を呼ぶ。1 段は 15 分に収まる）
    blockers: 事務所の LAN のプリンタにクラウドから届かない（VPN と VPC、または拠点の bdf printd が取りに行く代理）、SSE の常時接続、メモリだけのパスワード（KMS で封印）、状態のページと /metrics
    shape: 受け付けと変換をクラウド（Lambda＋オブジェクトストレージ）に、印刷を拠点の bdf printd に。m2 の後
  provisional_choices:
    passwords: メモリだけ。再起動の後は pending-held（job-password-wait）、API で渡し直す。替えるなら spool.Options.Secrets
    spool_dir_option: bdf print -spool dir は作らない
    default_listen: 127.0.0.1:8640。loopback かつトークンなしなら認証なし
    retry: 10 秒、30 秒、1 分、2 分、5 分、以後 10 分ごと。既定 24 時間で aborted（bdf-retry-exhausted）
    api: /api/v1 の queues・jobs・printers・discover・accounting・backup・events（SSE）。/healthz、/metrics、/（状態のページ）
    auth: トークン（名前、使えるキュー、役割 submit・manage・admin、act-as）。loopback かつトークンなしなら認証なし
history:
  bbolt-only:
    summary: 2026-10-19 利用者「bbolt、Dynamo、その他の KVS（と RDB）を包む薄い仕組み。SDK を同梱せず HTTP」「楽観ロックのオブジェクトストレージに対応できれば費用も運用も楽」と問われて調べ（system:conditional-storage）、薄い保存層の案を書いた（decision:thin-store、store.ja.md）。続けて利用者「store レイヤーは一旦頑張らずに bbolt 前提で良い」。m2 は bbolt を直接使い、版つき書き込み・借り・メモリの保存先・取り合いのテストを外した。文書はジョブごとに持つ
  decisions-2026-10-19:
    summary: 2026-10-19 利用者が実装案の論点に答えた。「bdf printd がよい」「組み込みの KV で良い」「PDF やオフィスの変換を行っても良い」「プリンタにためるジョブは 2 がデフォルトでよい」「Windows のサービス登録は後回しで良い。サービス化は別ツールもあるので自分自身で持たなくても良い」「m2 の後は後で考える」。あわせて「保存するのはジョブ番号か」「KV はオンメモリか、シングルファイルか」「タイムスタンプをつければ並行で処理できるか」「Lambda 化できるか」を問われ、保存する中身の表、bbolt の 1 ファイル、時刻と条件付き書き込みと借り、Lambda に載るもの・載らないものを実装案 §3.2、§3.4、§6 に書いた
  proposed:
    summary: 2026-10-19 利用者「print-m2 の実装案を書いて」。初版はファイルだけの永続化と cmd/bdfprintd を暫定にしていた
