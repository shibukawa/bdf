constraints:
- 辺（口）の種類は bdf・data・any の 3 つ。bdf ⊂ any、data ⊂ any、bdf と data は交わらない。data の形式は json・yaml・csv（tsv）・xlsx・parquet
- printer と外部 CUPS への送りの入力は bdf だけ。display も bdf だけ
- archive はどの種類でも受け、受けたペイロードをそのまま書く（.bdf でなくても）。記録の JSON に kind・format と系譜を持つ
- 入力の種類がそのまま出力の種類になるノード（queue・class・filter／branch・inbox・archive・sink・通知・出口）は、上流からの推論で種類が決まる。固定の入力の口に合わない種類が届きうる辺は PUT で断る（存在・重なり・閉路に型を足す）。実行時にも確かめ、合わなければ error の足跡で止める
- 既定で今の図がそのまま動く：入口の convert は既定で on（今の振る舞い）、全部 bdf の図は型の推論で自動的に通る
- エンドポイントは暗黙の変換をしない（2026-10-21 利用者）。テンプレートの差し込みはテンプレート変換ノードだけが行い、テンプレートはそのノードの持ち物。エンドポイントが持つ変換は convert（変換器で bdf に）だけ
- 出口は bdf をそのまま送れる（2026-10-21 利用者：別拠点の bdf Print Manager が受け手のことがある）。描画ノードは選択で、出口の前に置くかは図で決める
- メタデータは、IPP・HTTP の API で受けたものも、受信日時・ファイル名・送り手のようにナイーブに決まるものも、全部メタデータとして持つ（2026-10-21 利用者）。送り手が付けたものは名乗りで、経路とテンプレートの選択には使えるが、権限と見える範囲の根拠にしない（requesting-user-name の制約の延長）。Manager が確かめた値は送り手が上書きできない名前の空間に置く
- ジョブの記録は yuruidb の 256 KiB に収める。メタデータの鍵の数と大きさに上限を持つ
- 出口（SMTP・FTP・S3・HTTP）と外部サービスの資格は名前で指し（環境変数かファイル）、yuruidb に取り出して使える秘密を置かない（requirement:print-manager-auth の制約を引き継ぐ）。メタデータの差し込みはメールのヘッダの注入とパスの逸脱を防ぐ
- 変換と送りは要求の中で行わず、借りの下の段（Delivery の一般化）で行う。経路のノード（queue・class・filter・inbox）は今のまま即座。インスタンスに状態を持たない・常駐に頼らない（pm-1）は変えない
- 送りと変換は at-least-once（2026-10-21 利用者）。冪等の鍵は <ジョブ>.<足跡の番地>（S3 は If-None-Match、FTP は一時名から改名、SMTP は Message-ID、HTTP は Idempotency-Key）。結果の分からない失敗は 2 度送ることがあり、受け手が鍵で抑える
- 各社の SDK を同梱しない（S3 は yuruidb の Blob）。式言語（CEL・expr）と Wasm の実行系は当面入れない（規則は RE2 の表のまま）
non_goals:
- データベースを読み書きするノード（利用者「データベースを想定しない」）。データは入口から流れてくるものだけ
- データの加工（列の選択・結合・集計）の組み込み。形式の変換・抽出・テンプレートまでにし、残りは登録した外部サービスに任せる
- Parquet・Excel の書き出し（読み手はあるが書き手は無い。要るときに別に）
- 汎用のワークフローエンジン（join、長い待ち、人の承認の多段）。inbox・人の操作のノードと tick で表せる範囲まで
- Manager 自身が SMTP サーバーとして受ける（常駐が要る。サーバーレスでは外部の受信 → S3 の入口に任せる）
- .bdf への暗号の電子署名（requirement:print-manager の non_goals のまま。人の操作の「署名」は見た目の署名。open_questions.signature-meaning）
- S3 の出口での書いた後の確かめと記録（書きっぱなし。2026-10-21 利用者）。残す約束が要るものは archive
