id: requirement:pdf-export
type: requirement
title: BDF → PDF 書き出し（vector/pdfbdf）
summary: 帳票のエコシステムをつなぐ出口。印刷・保存・外部送付のために .bdf から PDF を書く。2026-10-14 に vector/pdfbdf と bdf pdf として実装した（milestone:form-m2、docs/design.md §3.35）。
lifecycle: active
authority: authored
aliases:
- bdf pdf
- pdfbdf
constraints:
- 自前で書く。pdfcpu は go.mod にあるが内容ストリームを組む API ではない。PDF の書き出しは読み込みよりずっと小さい（フォント込みで 2〜3 千行の見込み）
- TypeScript の双子は作らない。ビューアの「PDF で保存」は wasm の Go 版を呼ぶ
- 暗号化文書は同じパスワードで AES-256 の PDF にする（入力の規則 spec §9 と同じ考え）
facts:
  mapping:
    easy:
    - パス
    - 変換（cm）
    - クリップ（W n）
    - 破線
    - ExtGState のアルファ
    - ブレンド 16 種（BM の名前は CSS と同じ）
    - ソフトマスク（SMask の luminosity / alpha が 1:1）
    - グループ（透明グループの Form XObject）
    - 線形 / 放射グラデーション（shading type 2 / 3。Canvas の 2 円放射は type 3 そのもの）
    - パターン（tiling pattern）
    hard: 扇形グラデーション、destination-out などの合成、FILTER。SVG 書き出しと同じく近似して警告
    images: JPEG は DCTDecode でそのまま、PNG は IDAT を Flate＋PNG predictor でアルファは SMask 画像に分ける、WebP / AVIF は imgconv.Decode でピクセルに、SVG は imagebdf で描いてラスタ化
    text: WOFF2 を font/woff2 で TTF / OTF に戻し、CID フォントを Identity-H で埋め込み、グリフ ID は internal/sfnt の cmap、ToUnicode で検索とコピー。advance は Tz か TJ で Canvas の伸縮と同じ幅。system
      フォントは fontdb で探して埋め込み。ALT_TEXT → ActualText
    structure: LINK → Link 注釈（URI / GoTo）。dc → Info と XMP。MARK の HEADING / LIST / TABLE / FIGURE / LANG は PDF の構造タグにほぼ 1:1 なので後からタグ付き PDF と PDF/UA へ
    views: fixed / flow はページ、scroll は帯を 1 枚の長いページ（14400 pt を超えたら UserUnit）、sheet は印刷ビューがあればそれ、なければタイルの届く範囲を 1 ページ
  verification: PDF → BDF → PDF の往復を imagebdf と pdf.js / Ghostscript のラスタで比較。testdata の全文書
  form_related:
  - 帳票の印刷用途では、プレ印刷用紙に追い刷りするためにレイヤー（master / background）を抜いて書くオプション（pattern:preprinted-overlay）
  - PDF/A は電子帳簿保存・長期保存で求められる。フォント埋め込みと XMP は揃う。暗号化なしが条件
  implemented:
    package: vector/pdfbdf（Write、Options、Result）。CLI は bdf pdf
    done:
    - パス・変換・クリップ・破線・アルファ・ブレンド 16 種
    - 線形・放射のシェーディング、扇形は三角形の網、画像のタイリング
    - 透明グループとソフトマスク（アルファ・輝度・転送関数）
    - CID フォントの埋め込みと ToUnicode、埋め込めないフォントはアウトライン
    - JPEG のそのままの格納、ほかは画素、SVG は 300 dpi の画像
    - リンク注釈、Info と XMP、UserUnit、共有レイヤーのフォーム、SkipRoles
    - 影（影を落とす図形だけを imagebdf で描いてぼかした半透明の画像を、図形の下に敷く。グループを囲む状態の影はグループ全体の影。2026-10-14、milestone:form-m3）
    - ブラウザでの書き出し（cmd/bdfwasm の pdf。デモサイトのビューアの Download PDF とフォームのページ。2026-10-14、milestone:form-m4）
    - タグ付き PDF（MARK を構造木に写す。Options.Tagged、-tagged）と PDF/A（第 2 部・第 3 部の b・u・a。Options.PDFA、-pdfa）。veraPDF で検査（2026-10-14、milestone:form-m5）
    not_yet:
    - PDF/UA を名乗ること、PDF/A-1
    - 暗号化（暗号化した文書は -allow-plaintext で平文の PDF になる）
    - FILTER・Canvas 固有の合成（警告して省く）
    - svgbdf の兄弟としての共通化（svgbdf は別ブランチのまま）
    - npm パッケージのビューアからの PDF 保存（デモサイトにはある）
relations:
- relation: sibling_of
  to: component:svgbdf-export
- relation: complements
  to: requirement:form-template
