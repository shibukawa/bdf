acceptance:
  s1-mark:
    text: 帳票の記号の前に BARCODE の印が付き、印から同じ記号を作り直せる。imagebdf が印の記号を箱と回転で呼び出し側に渡して描かず、または画素に揃えて描き直し、画像だけをディザする（帯の大きさによらない）
    verified_by:
    - mark-unit
    - imagebdf-unit
  s2-writers:
    text: 5 つの言語の出力を自前の読み手でドットに戻すと imagebdf の絵と画素で一致し、ラベルの言語は記号をプリンタの命令で出す。チケットの拡張がそれぞれの命令になる
    verified_by:
    - pdl-unit
    - zxing
  s3-transports:
    text: シリアル（擬似端末）、USB の装置ファイル、9100 にラベルの言語で送れる。CUPS の raw キューに IPP で送れる。サーバーの設定でプリンタに言語と機種を書ける
    verified_by:
    - raw-unit
    - print-unit
    - server-unit
    - cli-local
  s6-text-mode:
    text: 'テキスト帳票テンプレートの帳票（印字像の Part を持つ文書）を、ESC/P は既定で、ESC/POS は bdf-print-mode=text でテキストモードで刷る。格子のピッチ・行送り・用紙長・スキップ・左余白が命令になり、刷った文字を読み戻すと印字像の Text（余白込み、-skip background ならプレ印刷を空白）と一致する。刷れないピッチや幅は、既定のモードならドットで刷って警告、テキストモードを求めたら誤り'
    verified_by:
    - text-unit
    - print-unit
    - cli-local
