facts:
  plan:
    steps:
    - 'docflow/io/sftp/protocol：x/crypto/ssh の上の SFTP v3 クライアント（OPEN・WRITE・READ・CLOSE・RENAME・MKDIR・OPENDIR・READDIR・STAT・REMOVE、posix-rename@openssh.com）と、試験用の最小のサーバー'
    - 'docflow/io/ftp/protocol：FTP(S) クライアント（RFC 959・2428・3659・4217、TLS セッションの再利用）と、試験用の最小のサーバー'
    - 'docflow：Kind.Tick と、ノードの状態（最後に見回った時刻）。Tick がノードを回る'
    - '種類の登録：ftp・sftp（RoleExit、Send）、ftp-poll・sftp-poll（RoleEntry、PassesOn、Tick）、Fields、Discover（sftp のホスト鍵）、Doc（en・ja）'
    - 'cmd/docflow/handlers の blank import、エディタの注意の文（tls=none）、マニュアルの章、examples/docflow-custom の確認'
    - '実物の確認（macOS の sftp-server、Docker の vsftpd）'
    size: 'Claude の見積り：SFTP のクライアント 600〜800 行、FTP のクライアント 500〜700 行、試験用のサーバー 2 つで 600 行、種類と tick で 500 行'
  implementation:
    packages: 'docflow/io/transfer（FS・Site・ParseURL・ExitFields/PollFields・Send・Poll・MkdirAll）、docflow/io/sftp（client.go・ssh.go・sftp.go）、docflow/io/ftp（client.go・ftp.go）。docflow/io/all が両方を import。芯は kind.go の Kind.Tick、send.go の Tick のループと TickReport（Ticked・Polled・Notes）、kindstate.go（KindState・PutKindState、kind-states、64 KiB まで）、nodes.go の DeleteNode が dropKindState'
    decided_while_building:
    - 'ジョブの $source は種類の名（sftp-poll・ftp-poll。s3-trigger と同じ流儀）、メタデータの鍵は sftp.path・sftp.size・sftp.time（mtime ではなく time）、名乗りのユーザー（ClaimedUser）はログインの名、By は nil（鍵でもアプリでもない）'
    - 'max_per_tick は「試した数」を数える（refused も 1 回。仕事の上限だから）。Polled は取れた数'
    - 'settle：更新が settle より新しいファイルは残すが、前回の見回りと大きさ・時刻が同じなら取る（Seen を KindState に。2000 件まで）。サーバーの時計が進んでいても 1 回遅れで取れる'
    - 'done_dir と path の .. は落とす（CleanPath。URL のディレクトリの外に出ない）。done_dir は絶対パスでも書ける'
    - 'refused（ErrFormat・ErrInvalid・Refusal）は <name>.docflow-<node>.refused に改名して残し、ログに Warn、TickReport に Note。取り込みの途中の失敗（保存など）は取り置きのまま残して次の tick で同じノードが拾い直す'
    - 'SFTP の rename で replace は posix-rename@openssh.com が無ければ先に REMOVE（原子的でない）。見回りの取り置きは replace なしの RENAME（相手にあれば失敗 → 他のインスタンスのもの）'
    - 'FTP の Rename は replace なしのとき先に Stat で見る（FTP の RNTO は上書きする）。550 は fs.ErrNotExist 扱い（無いのと権限なしを区別できない）'
    - 'FTP の TLS：ClientSessionCache を共有し、データ接続が制御接続のセッションを再利用する（vsftpd の require_ssl_reuse=YES で実証）。自己署名は tls_fingerprint（SHA-256、hex）で留める'
    - 'ctx の打ち切り：Dial が goroutine で ctx.Done を見て TCP を閉じる（SSH は tcp、FTP は tcp とデータ接続）'
    - 'Kind.Doc は使わず、4 つの章を help/{en,ja}/nodes.md に書いた（web/help の TestLinks は静的な見出ししか見ない。他のアダプタと同じ置き場）。entries.md に「FTP と SFTP（見回り）」の節'
    - 'エディタ：Fields の種類で discovers のものに「サーバーに聞く」（discoverField）。POST /api/kinds/<kind>/discover に settings を送り、答えの同名の欄を埋めて表示する。ja.js に 4 つの文'
    known_gaps:
    - 'SFTP の READ/WRITE は 16 × 32 KiB の窓の逐次 pipeline（送って集める）。WAN の大きなファイルは遅いかもしれない（未計測）'
    - 'FTP の能動モード・ASCII・REST・SITE は無い（non_goals）。MLSD の無いサーバーは名前ごとに SIZE と MDTM を聞く（ファイルの数だけ往復）'
    - 'known_hosts・SSH agent・暗号化された鍵は無い。ホスト鍵はノードごとに留めるだけ'
    - 'サーバーの時計が manager より進んでいる相手では、ファイルは 1 回の見回り分遅れて取られる'
    - 'Alpine の vsftpd（arm64 の Docker）は 1 セッションの後に親が 139 で落ちることがあり、testdata の README は再起動のループで動かす（docflow 側の問題ではない）'
  editor_check:
    date: '2026-10-27'
    how: examples/docflow-custom を pw dev で起動し、内蔵ブラウザで /topology（Ada Admin で署名）
    seen: 'パレット：ソースに「FTP（見回り）」「SFTP（見回り）」、シンクに「FTP」「SFTP」がアイコンつき（凡例にも）。SFTP を置くとサイドバーに Fields の欄（URL・資格・ホスト鍵が必須の印、パス・ディレクトリを作る・上書き、TLS の欄は無い）と「サーバーから：サーバーに聞く」。URL に Docker の sshd（sftp://tester@127.0.0.1:2222/~/in）を入れて押すと、type・host_key・fingerprint（SHA256:W/OxQ5…）が表示され host_key の欄が埋まる。資格の名を入れて「追加」→ トースト「sftp-out を保存しました」、GET /api/nodes/sftp-out の settings に url・credential・host_key・mkdirs=true・overwrite=false。/help/ja/nodes に sftp・ftp・sftp-poll・ftp-poll の章。確認後にノードは消した'
