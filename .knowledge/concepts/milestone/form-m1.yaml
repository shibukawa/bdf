id: milestone:form-m1
type: milestone
title: form-m1 — Excel テンプレートで 3 形態を穴埋めから .bdf まで通す
summary: 最初の実装のまとまり。Excel の印刷ビューを前提に、固定ページ式・固定行数明細のページ複製・行挿入式の 3 形態を、タグ入りの .xlsx とデータから .bdf（print View）まで通す。2026-10-14 に
  S1〜S6 を実装し、Go のテスト・fuzz・golden が通った。Word と PowerPoint、PDF 書き出し、フォント規則は後続。叙述の実装案は knowledge-inputs/form-template-plan/form-m1.ja.md、利用者向けの説明は
  docs/forms.ja.md。
lifecycle: active
authority: authored
scope:
  milestone: form-m1
  input: xlsx
constraints:
- 出力は .bdf だけ。穴埋め済みの .xlsx は作らない
- sheet View の描画は変えない（golden）
- 集計・端数処理はテンプレートに持ち込まない。固定行数明細のデータはページ単位の配列で受ける
- 式の再計算は条件付き書式の評価器の関数集合に限る。未対応は警告して空
non_goals:
- Word / PowerPoint のテンプレート（m2 / m3）
- 繰越・小計の計算（データ側）
- ラベル・連帳・レシート・フロー文書
- PDF 書き出し（別トラック）、フォント規則ファイル（別トラック。m1 は既存の -font-dir と FontFS で組む）
capabilities:
  print-view:
    state: implemented
    about: capability:xlsx/print-view
  tag-parser:
    state: implemented
    about: capability:form/tag-parser
  data-loading:
    state: implemented
    about: capability:form/data-loading
  fixed-page-fill:
    state: implemented
    about: capability:form/fixed-page-fill
  row-insert-fill:
    state: implemented
    about: capability:form/row-insert-fill
  fixed-rows-block-fill:
    state: implemented
    about: capability:form/fixed-rows-block-fill
  formula-recalc:
    state: implemented
    about: capability:xlsx/formula-recalc
  bdft-container:
    state: implemented
    about: capability:form/bdft-container
acceptance:
  s1-print-view:
    text: 印刷範囲・印刷タイトル・ページ設定・余白・手動改ページ・ヘッダーとフッターを持つブックが、Excel と同じ規則でページに切れた print View になり、golden テストで描画が固定される。sheet View の
      golden は変わらない
    verified_by:
    - print-golden
    - sheet-golden-unchanged
  s2-tags:
    text: 値・区間・否定・書式フィルタ・画像のタグを、全角の波括弧を含めて字句解析し、開閉の不一致と行・セルをまたぐ区間をセル参照つきのエラーにする
    verified_by:
    - tag-unit
  s3-fixed-page:
    text: タグ入りの 1 ページの .xlsx と JSON から、値の型（数値・日付・真偽・文字列）と表示形式が効いた .bdf が出る。欠けたフィールドは警告して空、-strict でエラー
    verified_by:
    - fill-golden
  s4-row-insert:
    text: 同じ行の開始と終了のタグで行が挿入され、結合・条件付き書式・ハイパーリンク・定義名・改ページ・全シートの式の参照がずれ、SUM の範囲が広がり、再計算した合計が出て、印刷タイトルつきでページに切れる
    verified_by:
    - shift-unit
    - recalc-unit
    - fill-golden
  s5-fixed-rows:
    text: 別の行の開始と終了のタグで囲んだ明細域を含む印刷範囲が、pages 配列の要素ごとに複製され、各ページに _page / _pages / _first / _last が入り、余った行は空行のまま罫線が残り、ページ単位の繰越額がそのまま置かれる
    verified_by:
    - fill-golden
  s6-bdft:
    text: bdf template compile が構文検証・スキーマ・プレビューつきの .bdft を書き、bdf fill が .bdft と .xlsx のどちらからでも同じ .bdf を出す。Go と TS の読み手が tpl
      と src の Part を無視して開ける（libbdf は別途）
    verified_by:
    - bdft-roundtrip
    - reader-tolerance
verification:
  print-golden:
    state: passed
    method: integration
    test: TestGoldenPages (raster/imagebdf) と npm run test:golden
    authority: observed
    evidence:
      path: testdata/golden/xlsx-print-report-2.png
      locator: xlsx-print-report-2, xlsx-print-wide-2, xlsx-print-areas-1 を Docker (node:24-bookworm, linux/amd64, chromium
        headless shell) で作成。既存 125 件は golden diff 0.000%。TestPrintView がページ数・タイトル行の共有・ヘッダーとフッターを検査
  sheet-golden-unchanged:
    state: passed
    method: integration
    test: cmp testdata/xlsx/{basic,features,math}.bdf
    authority: observed
    evidence:
      path: testdata/xlsx/basic.bdf
      locator: amd64 ビルドで再生成した 3 文書が既存とバイト単位で同じ。TestPrintSameSheet は both のときの sheet View の命令列が単独のときと同じことを検査
  tag-unit:
    state: passed
    method: unit
    test: go test ./form/tag/
    authority: observed
    evidence:
      path: form/tag/tag_test.go
      locator: TestParse, TestParseErrors, TestScope, TestNormalize, TestParseDate; FuzzParse 20 秒で 387 万回、失敗なし
  shift-unit:
    state: passed
    method: unit
    test: TestFillMoves, TestFillGroups
    authority: observed
    evidence:
      path: converter/xlsx/template_test.go
      locator: 結合セル・条件付き書式の範囲・リンク・改ページ・印刷範囲とタイトル・別シートからの参照
  recalc-unit:
    state: passed
    method: unit
    test: TestFillShared, TestFillGroups, TestFillRows
    authority: observed
    evidence:
      path: converter/xlsx/template_test.go
      locator: '共有数式、複製の中の数式、範囲の拡大、0 件のときの空の範囲と #REF!、未対応の数式の警告'
  fill-golden:
    state: passed
    method: integration
    test: TestFillFixed, TestFillRows, TestFillPages と golden form-fixed-1 / form-rows-1 / form-pages-3
    authority: observed
    evidence:
      path: testdata/golden/form-pages-3.png
      locator: testdata/form/{fixed,rows,pages}.bdf を CI が bdf fill で再生成して比較（.github/workflows/ci.yml）
  bdft-roundtrip:
    state: passed
    method: integration
    test: TestCompile
    authority: observed
    evidence:
      path: form/form_test.go
      locator: .bdft を穴埋めした文書が元の .xlsx を穴埋めした文書とバイト単位で同じ。bdf template compile / schema / fill -each を手で確認
  reader-tolerance:
    state: passed
    method: integration
    test: TestCompile (Go) と packages/core の "compiled template opens as a document"
    authority: observed
    scope:
      reader:
      - go
      - typescript
    evidence:
      path: packages/core/test/core.test.mjs
      locator: 'node:24-bookworm (linux/amd64) で npm test: 151 件すべて通過。testdata/form/pages.bdft を BdfDocument.open で開き、3 ページ目のテキストと
        tpl の記述を読む。libbdf は未確認（open_questions の reader-part-types）'
open_questions:
  missing-field-policy:
    text: 欠けたフィールドの既定を「警告して空」にするか「エラー」にするか
    state: open
    resolution: 実装は「警告して空」、-strict / Options.Strict でエラー。空の枠（_blank）の中では警告しない
  image-anchor:
    text: 画像タグはセルに収めるだけでよいか、既存の図形を差し替える経路も要るか
    state: deferred
    resolution: '実装はセル（結合範囲）に contain / cover / stretch で置く。ファイルのパスか data: URL。既存の図形の差し替えは未実装'
  reader-part-types:
    text: TS の @bdfkit/core と libbdf が未知の parts[].t を無視するか
    state: open
    resolution: spec §4.5 に tpl / src を足し、§4 に「読み手は参照されない Part と知らない t の Part を文書を開く妨げにしてはならない」と書いた。Go は確認済み、TS はコード上は検査なし、libbdf
      は未確認。適合テスト（conformance）に .bdft の事例を足すのが次の確認
  yaml-dependency:
    text: YAML の読み込みに go.yaml.in/yaml/v3 を直接依存にしてよいか。go.mod では pdfcpu 経由の間接依存だったものが直接依存になった（form/data_yaml.go、TinyGo では外す）
    state: open
    resolution: 暫定で使用。自前の YAML サブセットにするなら form/data_yaml.go だけの差し替えで済む
  registry-format:
    text: bdft を converter の Format として登録して bdf generate と wasm から使えるようにするか
    state: deferred
    resolution: form が YAML を読み込むので converter/all に入れると wasm のビルドに影響する。今は bdf fill と form.Fill だけ
facts:
  delivery:
    slices:
    - S1 印刷ビュー（converter/xlsx: print.go、headerfooter.go、定義名、views パラメータ）
    - S2 タグとデータ（form/tag.go、form/data.go、数値書式の呼び出し）
    - S3 固定ページ式の穴埋めと bdf fill
    - S4 行挿入と参照のずらしと式の再計算
    - S5 固定行数ブロックのページ複製とページ変数
    - S6 .bdft の compile / schema とプレビュー、読み手の確認
    provisional_choices:
      engine_location: Excel の穴埋めは converter/xlsx の中（template.go）に置き、form パッケージはタグ・データ・CLI の共通部とオーケストレーションを持つ。ワークシートのモデルを公開しない
      print_targets: '実装で変更: ページの Object に Transform を前置する案ではなく、ページが見せるセルの矩形（領域）ごとに Object を作り、ページの body レイヤーが CLIP_RECT +
        TRANSFORM + USE で置く。領域は罫線の下・罫線・罫線の上の 3 層で、罫線だけは切らずに線分を領域の閉じた矩形で切る（縁の罫線を全幅で残すため）。印刷タイトルは内容アドレスで 1 回だけ格納される'
      formula_retention: テンプレートモードのときだけ cell に式の文字列を残す
      numfmt_sharing: m1 は xlsx の内部のまま使い、Word / PPT で要るときに converter/internal/numfmt へ切り出す
      context_vars: _index、_count、_first、_last、_page、_pages（pages の区間）、_blank、_blank_first（slots の空行）
      section_modes: 行の区間は rows（同じ行の既定）/ slots（別の行の既定）/ pages（明示）。block は rows の別名。計画時は「外側の区間があればページ複製」としていたが、1 レコード 1 ページの帳票と区別がつかないので
        | pages の明示にした
    implemented:
      date: '2026-10-14'
      files:
      - converter/xlsx/print.go
      - converter/xlsx/headerfooter.go
      - converter/xlsx/template.go
      - converter/xlsx/template_expand.go
      - converter/xlsx/template_calc.go
      - converter/xlsx/values.go
      - converter/csv/records.go
      - form/form.go
      - form/data.go
      - form/tag/tag.go
      - form/tag/scope.go
      - cmd/bdf/fill.go
      side_fix: formatGeneral が 10 の累乗（1e15 など）で無限再帰していた既存の不具合を直した（converter/xlsx/numfmt.go。Log10 が指数よりわずかに小さくなる）
      not_committed: 作業ツリーに未コミットで置いてある（利用者がコミットを指示していないため）
    later:
    - Word の表と固定箱（m3）、PowerPoint（m2）
    - BDF → PDF 書き出し
    - フォント規則ファイルと .bdft へのフォントの固定
    - QR・バーコード
    - 列方向の繰り返し
    - 型違いの続きページ
    - bdft の Format 登録とブラウザ内の穴埋め
    - conformance への .bdft の事例
