id: milestone:print-m6
type: milestone
title: print-m6 — 偽プリンタの農場と、印刷のテストの全部の移行（print/fakeprinter、pdlread、faults、CUPS の名前の空間、tools/fakeprinter）
summary: >-
  requirement:fake-printers の最初の実装のまとまり。print/fakeprinter を作り、ラベル・レシート・連帳の
  読み手を print/pdl/pdlread に出し、bdf print → 偽物 → 読み戻した絵 を bdf の描画と比べる。壊れ方の筋書きでスプールの再開・二重印刷の
  防止を書き直し、CUPS のサーバーの偽物で bdf printers の CUPS の一覧を往復させ、YAML の農場と画面を tools/fakeprinter に置く。
  印刷のテストを全部これに移して ipptest・rawtest・手書きの偽物を消し、偽物そのものを ipptool・cupsd・ippeveprinter で確かめる。
  叙述は knowledge-inputs/print-plan/fake-printers.ja.md §9・§10。2026-10-20 利用者の決定で、Print Manager より先。
lifecycle: active
authority: authored
scope:
  milestone: print-m6
constraints:
- 印刷の Go のテストでプリンタ役を作るのは print/fakeprinter だけ（winspool と USB の装置ファイルを除く）
- 移す前と後でテストの数と確かめが減らない
- 依存を足さない
- 既定は loopback だけ、DNS-SD の広告なし
capabilities:
  fake-printers:
    state: implemented
    about: capability:print/fake-printers
  readback:
    state: implemented
    about: capability:print/fake-readback
  fake-cups:
    state: implemented
    about: capability:print/fake-cups
  fake-farm:
    state: implemented
    about: capability:print/fake-farm
non_goals:
- 外の偽物を CI に入れる
- スキャン・ファクス
- Print Manager の機能（保管庫・検索・画面）
acceptance:
  s1-core:
    text: print/fakeprinter の device（搬送路・言語・profile・faults・記録）。偽物の各 IPP の profile が ipptool の ipp-1.1・ipp-2.0・ipp-everywhere の検査を通り、cupsd の ipp・socket・lpd のキューから lp で投げたジョブが偽物に届いて読み戻せ、ippeveprinter と同じ要求の並びに同じ状態コードと主な属性を返す
    verified_by:
    - fake-conformance
  s2-readback:
    text: m1〜m5 のすべての形式（PDF、PostScript（gs があるとき）、PWG、URF、PCLm、ZPL、SBPL、TPCL、ESC/POS、ESC/P）で、bdf print → 偽物 → 読み戻した絵が imagebdf の描画と一致する（ラスタの言語は画素ごと、PDF・PostScript は golden の許容）。印刷側バーコードは命令の一覧と絵の両方に出る
    verified_by:
    - readback-roundtrip
  s3-faults:
    text: 筋書き（状態、ジョブを忘れる、job-id を戻す、n バイト目で切る、遅れ、証明書の作り直し）でスプールの再開・二重印刷の防止・停止と再開・指紋の固定のテストを書き直し、決まった順で何度でも同じ結果になる
    verified_by:
    - spool-fault-tests
  s4-cups:
    text: cups の搬送路が /printers・/classes と CUPS-Get-Printers・CUPS-Get-Classes・CUPS-Get-Default・CUPS-Move-Job に答え、bdf printers -url で一覧が出る。クラスに投げたジョブがメンバーに流れる
    verified_by:
    - cups-fake-tests
  s6-migration:
    text: fake-printers.ja.md §10.1 の全部のテストを fakeprinter に移し、print/ipp/ipptest・print/raw/rawtest・test/print/raw9100.py・テストごとの IPP の手書きを消す。移す前と後のテストの名前と確かめの対応表があり、go test ./print/... ./cmd/bdf/ が通る。プリンタ役の手書きが無いことの小さな検査が CI にある
    verified_by:
    - print-tests
    - migration-table
  s5-farm:
    text: go run ./tools/fakeprinter -config test/print/farm.yaml で十数台が起き、画面でジョブの属性・バイト列・読み戻した絵が見え、JSON の API で一覧と faults の注入ができる。ci.sh の Python の 9100 の受け手を置き換える
    verified_by:
    - farm-smoke
    - ci-print
verification:
  fake-conformance:
    state: passed
    method: integration
    test: go test -run 'IPPTool|AgainstIPPEve' ./print/fakeprinter/
    authority: observed
    evidence:
      path: print/fakeprinter/conformance_test.go
      locator: 'TestIPPToolPresets（office-mfp は ipp-2.0 と IPP Everywhere の属性、airprint-only・pwg-only・ps-office・pclm-inkjet は ipp-2.0、legacy-ipp11 は -L で ipp-1.1）、TestIPPToolCUPS（/printers/office の ipp-2.0、/classes/floor の print-job、/ の get-printers）、ippeve_test.go の TestAgainstIPPEve（16 の要求で ippeveprinter と同じ状態。Validate-Job の形式の拒否だけ attributes-or-values と document-format の違いを両方正しいとした）。2026-10-20 macOS の ipptool・ippeveprinter で通った'
  migration-table:
    state: passed
    method: static
    authority: observed
    evidence:
      path: print/fakeprinter/guard_test.go
      locator: 'go test -list で移行前（a21e9f6）160、後 173。消えたのは ipptest 自身の TestFailures・TestStopForget で、fakeprinter の TestCutAndDrop・TestStopForget に移した。TestNoPrinterByHand がテストの手書きのプリンタ役（ipp.NewResponse、application/ipp の答え、ipptest・rawtest の import）を拒む'
  print-tests:
    state: passed
    method: unit
    test: go test ./print/... ./cmd/bdf/
    authority: observed
    evidence:
      path: print/fakeprinter/fakeprinter_test.go
      locator: '2026-10-20 macOS で全部通った（print、fakeprinter、readback、ipp、pdl、raster、raw、server、server/client、spool、cmd/bdf）'
  readback-roundtrip:
    state: passed
    method: integration
    test: go test ./print/fakeprinter/readback/
    authority: observed
    evidence:
      path: print/fakeprinter/readback/readback_test.go
      locator: 'TestRasters（PWG・URF を imagebdf の PlaceRows と画素ごとに一致）、TestVectors（PDF・PCLm・PostScript を 150 dpi で縁の差 0.5% 以内）、TestLabels（ZPL・SBPL を 9100、TPCL を LPD、ESC/POS を 9100、ESC/P をシリアルで、pdl.Write の出力とドットごとに一致）'
  spool-fault-tests:
    state: passed
    method: integration
    test: go test -run 'TestCrash$|PrinterRestartedWhileWatched' ./print/spool/
    authority: observed
    evidence:
      path: print/spool/run_test.go
      locator: 'TestCrash の再起動の 2 件（job-id が 1 に戻り他人のジョブがその id に）と TestPrinterRestartedWhileWatched。修正を外すと落ちることを確かめた'
  cups-fake-tests:
    state: passed
    method: integration
    test: go test -run 'TestCUPS|PrintersCUPS' ./print/fakeprinter/ ./cmd/bdf/
    authority: observed
    evidence:
      path: cmd/bdf/printers_test.go
      locator: 'TestPrintersCUPS（bdf printers -cups にプリンタ 3 台とクラス、クラスへの bdf print がメンバーに）、fakeprinter の TestCUPS（順番、止まったメンバーを飛ばす、Move-Job、Get-Default、Reject-Jobs）'
  farm-smoke:
    state: passed
    method: manual
    authority: observed
    evidence:
      path: test/print/farm.yaml
      locator: '2026-10-20 手元で農場を起こし、bdf print で 16 台全部（ipps、CUPS のクラス、シリアルを含む）に刷り、API で全部が絵に戻り、flaky が 2 件目で紙切れになり、画面（内蔵ブラウザ）でラベルの絵を見た'
  ci-print:
    state: not_run
    method: integration
    test: test/print/ci.sh（CI の print ジョブ。前半の農場への bdf print、PostScript、9100、-strict は 2026-10-20 手元で通った。lpadmin（sudo）の段は CI でだけ走る）
facts:
  delivery:
    plan: knowledge-inputs/print-plan/fake-printers.ja.md §9・§10（2026-10-20）
    implemented:
      date: '2026-10-20'
      slices:
      - 'S1 print/fakeprinter（Printer、Job、IPP、9100、LPD、シリアル、Fault、CUPS、プリセット、Start 系）と ipptool・ippeveprinter での確かめ'
      - 'S6 印刷のテストを全部移し、print/ipp/ipptest・print/raw/rawtest・print/raw の pty の補助・test/print/raw9100.py を消した'
      - 'S2 print/fakeprinter/readback と往復のテスト'
      - 'S4 CUPS-Get-Printers にクラスも並べる、bdf printers -cups とクラスへの印刷のテスト'
      - 'S3 スプールの再起動の筋書き（見つけた不具合を直した）'
      - 'S5 tools/fakeprinter（YAML、画面、JSON の API）、test/print/farm.yaml、test/print/ci.sh を農場に'
    changed_from_plan:
      - 'ラベル・レシートの読み手は print/pdl/pdlread でなく print/pdl/read.go（pdl.Read、Sniff）。pdl のテストが同じパッケージの中から使え、循環しない'
      - 'S6（移行）を S2 より先にした（テストを全部偽物に乗せるのが利用者の主眼）'
      - 'ipptest・rawtest は包みとして残さず消した（利用者「テストを全てそれをベースに」）'
      - '農場の CUPS のプリンタの名前は <サーバー>.<プリンタ>（パスの区切りに / が使えない）'
      - 'ippeveprinter は CI の外の実装としては偽物との差の比べだけに残し、test/print/ci.sh の印刷先は農場にした'
    found:
      - 'スプール: プリンタが再起動して job-id を 1 から数え直すと、他人のジョブを自分のものとして追った（再開時と見張り中）。ジョブの名前の #id.attempt で見分けるように直した（print/spool/job.go の sameJob）'
      - 'IPP のクライアント: chunked の要求を断る古いプリンタ（HTTP 411）に刷れなかった。411 なら一時ファイルから長さつきで送り直し、以後そうする（print/ipp/client.go）'
      - 'スプール: 送っている最中にプリンタが再起動し、他人のジョブが同じ id になると、Send-Document が not-possible でジョブが aborted になる（直していない。送り直すのが望ましい）'
relations:
- relation: implements
  to: requirement:fake-printers
- relation: follows
  to: milestone:print-m5
