id: pattern:slide-repeat
type: pattern
title: スライド複製（PowerPoint は基本的に固定ページ）
summary: >-
  PowerPoint の帳票は図形の箱に値を入れる固定ページが基本。可変性は図形の中に閉じる（折り返し、縮小、枠の拡大、表の行の伸び）。
  1 レコード 1 スライドの複製と、表があふれたときの継続スライドが「ページが増える」唯一の形。
lifecycle: proposed
authority: authored
aliases:
- 1 レコード 1 スライド
facts:
  why_fixed: PowerPoint には連結テキストボックスがなく、図形どうしは押し合わない。表が伸びてもスライドの下にはみ出すだけ
  per_shape_fit:
    wrap: 枠の中の折り返しは drawingml が描くときに計算するので差し替え後も正しい
    shrink: normAutofit は保存値（fontScale, lnSpcReduction）を使っているだけなので再計算が要る。PowerPoint と同じく 10% 刻みで下限 25%、行間の縮小は 20% まで
    grow: spAutoFit の図形は保存された xfrm のままなので、組んだ文字の高さから図形の高さを決め直す。上端を固定して下へ伸ばす
    table_rows: 行の高さは内容から伸ばしている（table.go）。そのまま効く
  overflow:
    table: 行を 1 つ足すたびに組んで高さを見て、スライドの下端か指定の高さを超えたら残りを複製したスライドに続ける（貪欲）
    other: 切る / はみ出す / エラー をテンプレートで選ぶ。既定はエラー
  seam: pptx には測り済みのモデルがなく、drawingml は txBody の node を直接組む。穴埋めはメモリ上のスライドの木で a:t を置換し、段落・行・スライドの node を複製する。pptx ファイルは書かない
  run_split: PowerPoint は言語ごとに run を分けるので {{氏名}} は 3 run になる。段落内の run をつないでタグを探す
  dedup: マスターとレイアウトのレイヤーは内容アドレスで既に共有されるので、複製したスライドで増えるのは本文レイヤーだけ
  typical_forms: [証明書, 名札, 1 件 1 枚の報告, カタログのカード]
relations:
- relation: member_of
  to: taxonomy:form-layout-axes
- relation: depends_on
  to: component:drawingml-autofit
