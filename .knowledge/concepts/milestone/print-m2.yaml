acceptance:
  s1-hooks:
    text: print.Options の OnCreated（Create-Job の直後、送る前）と OnSent、Printer（能力を聞き直さない）、公開した print.Check（1 回聞いて終わりを誤りに写す。m1 の wait はその繰り返し）、Ticket の JSON（キーは IPP の属性の名前）と Merge、ipp.TrustStore の Backend。m1 の bdf print の動きは変わらない
    verified_by:
    - print-unit
  s2-store:
    text: store.go（yuruidb）で記録の往復、連番が戻らない、done への移しと途中で落ちたときの揃え直し、文書の往復（0 バイト、範囲の読み取り、SHA-256）、持ち主の無い文書の掃除、GC が通る。閉じて開き直しても同じ、2 つ目の起動をロックで断る、詰め直しと写しで中身が変わらない
    verified_by:
    - db-unit
    - spool-unit
  s3-scheduling:
    text: キューの順（優先度、投入順、保留と時間帯）で流れ、max-inflight 2 でプリンタの中に 2 つまで、組の any と failover が 1 台の停止でもう 1 台に回り、接続の失敗は間隔を延ばして再送し、プリンタ側の中止は再送しない。取り消し・保留・解除・再送・移しが効く
    verified_by:
    - fake-printer-scheduling
  s4-no-duplicates:
    text: Create-Job の前、Create-Job の応答の前、記録の後で送る前、送る途中、送った後、履歴を持たないプリンタ、のどこで子プロセスが落ちても、同じ spool.db を開き直した bdf printd が照合してプリンタが刷るのは 1 回。照合できないときは pending-held（bdf-duplicate-check）
    verified_by:
    - crash-recovery
  s5-server:
    text: bdf printd が設定のキューとプリンタで起動し、HTTP API で投入・一覧・操作・実績・写し・SSE ができ、トークンとキューごとの許可が効き、loopback 以外で TLS が無いと起動しない。/metrics と状態のページが見える
    verified_by:
    - http-api
  s6-client:
    text: bdf print -server が投入して帰り（-wait で待ち、m1 と同じ意味の終了コード）、bdf jobs が一覧と操作と実績の書き出しをし、変換器の入力はサーバーで変換されて刷られ、暗号化した文書はパスワード待ちを経て刷られる
    verified_by:
    - cli
    - ci-ippeveprinter
