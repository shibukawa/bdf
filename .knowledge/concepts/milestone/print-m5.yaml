open_questions:
  text-mode-unverified:
    text: 'テキストモードの ESC/P-J84 の命令は、キヤノンとブラザーの互換機の資料で確かめた（JIS コード、FS S・FS T の 1/180 インチ、FS ! のビット、ESC w が上へ伸びること、FS W の 2 回の印字）。Epson VP の実機と Epson のリファレンスでは未確認。ESC/POS の Font A の幅（12 ドット）も実機では未確認'
    state: open
  escpos-raster-command:
    text: ESC/POS は GS v 0（Epson は廃止予定とするが互換機が広く持つ）にした。Epson の新機種で GS ( L（fn112 と fn50）に替えるか。lrks の記事では東芝テック B-EP2DL で確かめられた絵の命令は ESC *（ビットイメージ）だけで、GS v 0 は書かれていない（動かないとは書いていない）
    state: open
  sbpl-stx:
    text: SBPL を STX と ETX で囲む（SATO のステータスのプロトコル 3・4 が求める）。プロトコルの無い設定の機種で害が無いかは未確認
    state: open
  label-barcodes-unverified:
    text: SBPL と TPCL の記号の命令（位置の基準、回転、チェックディジット）は実機で確かめていない。TPCL の Code 128 と GS1-128、SBPL の GS1-128 はドットで描く
    state: open
facts:
  delivery:
    plan: knowledge-inputs/print-plan/print-m5.ja.md（2026-10-20）
    research: 各言語の命令は各社のリファレンスを 2026-10-20 に Web で読んだ（Zebra ZPL II の PDF、SATO CL4NX Plus・CT4-LX、東芝テック B-FV4・BX400・B-EX4、Epson の ESC/POS と ESC/P のリファレンス）。VP の ESC/P V.2 リファレンスは利用規約への同意が要るので読んでいない
    implemented:
      date: '2026-10-20'
      slices:
      - 'S1 spec §7.8 の BARCODE、image/barcode の Mark・ParseMark・Fill、帳票の描き手、imagebdf の Barcode・AlignBarcodes・DitherImages'
      - 'S2 print/pdl の共通部（render.go、profile.go）と ZPL・SBPL・TPCL'
      - 'S3 ESC/POS と ESC/P'
      - 'S4 print/raw の serial・usb・winspool、print の Ticket の拡張と PrintRaw・CUPS の raw キュー、spool と server の設定、bdf print の -profile と旗'
      - 'S5 docs（cli、print-server、design §3.36、api、spec）、test/print/ci.sh、.knowledge'
      text_mode:
        date: '2026-10-20'
        request: 利用者「milestone 5 と 5 に必要な 6 の機能の一部は終わりました。残りの作業を終わらせてください」（form-m6 が main に入った後）
        files: 'print/pdl の text.go（モードの決め方、文字の符号化、writeText）、escp_text.go、escpos_text.go、text_test.go。print の Ticket.PrintMode と Format の「(text)」、bdf print -print-mode、test/print/ci.sh の段、docs（cli、forms、print-server、design §3.36、api）'
        research: 'ESC/POS は Epson の TM のリファレンス（GS !、ESC !、FS !、FS &、FS .、FS C、FS S、ESC 3、ESC M、ESC R）を内蔵ブラウザで読んだ（利用規約には同意していない。表示された本文だけ）。ESC/P-J84 は Epson のリファレンスが読めず、IBM 5557-H02（Ricoh 配布）の ESC/P モードの命令表で FS &・FS .・FS SI・FS DC2・FS !・FS S・FS T・FS W・ESC W・ESC w の名前を確かめた。利用者の指摘（「ブラザーとかキヤノンを見ると文字コードは JIS の様に見えます」）で、ブラザー PT-9700PC の ESC/P コマンドリファレンス（FS & は JIS X 0208-1983 準拠、FS SI は SI と同じ）と、キヤノン imageRUNNER ADVANCE C350F の ESC/P エミュレーション（FS & は新 JIS、FS S・FS T は 1/180 インチで 0〜127、FS SI は横 1/2、ESC W は ANK と漢字の横倍、ESC w は ANK だけをベースラインから上へ、FS ! のビット 0 縦書き・1 半角・2 横倍（ESC W）・3 縦横 2 倍（FS W）・4 と 5 上付き下付き・7 下線、FS W は上半分の後 24/180 インチ送って下半分）を読んだ。利用者が示した lrks の記事（https://telecotele.com/projects/escpos/ と https://telecotele.com/shigoto_yamero/20250607_receipt/）で、東芝テック B-EP2DL（ESC/POS 互換）は Shift_JIS を受けず JIS を FS & … FS . で囲む、ESC t 1 で半角カナ、ESC R 8 で ¥、TM-T90 は FS ! 0x04 で漢字の倍幅、B-EP2DL は GS ! で漢字も大きくなることを確かめた'
        decisions:
        - '既定: ESC/P は印字像の Part を持つ文書をテキストモードで、ESC/POS はドット（レシートのロゴとフォントを保つ）。bdf-print-mode=text で ESC/POS も、raster で ESC/P もドット。ラベルの言語に text は誤り'
        - '刷れない帳票（ESC/P に無いピッチ・行送り、漢字が 2 桁に収まらないピッチ、プリンタより広い）は、既定のモードならドットで刷って警告、text を求めたら誤り。書き手はまずメモリに書き、通ったら送る'
        - '文字: ASCII、半角カナは 1 バイト（ESC/P は日本語機の既定のカナの表、ESC/POS は ESC t 1）、¥ は ESC R 8 の 0x5C、ほかは JIS X 0208（1〜88 区、NEC の 13 区を含む。IBM 拡張は 〓）を漢字モードで JIS コード（ESC/POS は FS C 0）'
        - 'あいまいな幅を 1 桁と数えたテンプレートの 1 桁の文字: ESC/P は半角の漢字（FS ! のビット 1。FS SI と同じ。FS T で 1 桁の空き）。ESC/POS は罫線素片をコードページ 437（ESC t 0。太線は細線にして警告）、× などを 850（ESC t 2）、ほかは ? にして ambiguous: wide を勧める警告（form-m6 の escp-box-drawing の答え）'
        - 'ESC/P の倍角（キヤノンの ESC/P エミュレーションの資料に従って改めた）: ESC W は全部の文字の横倍で FS ! のビット 2 と同じフラグ。漢字のある帳票では横倍・半角（ビット 1、FS SI と同じ）・縦横 2 倍（ビット 3、FS W と同じ）を FS ! の 1 バイトでまとめて決め、漢字の無い帳票は ESC W。ESC w は 1 バイトの文字の縦倍で、ベースラインから上へ伸び改行の量を変えないので、倍高の行は次の行（印字像で空の行）に刷る。縦横 2 倍の漢字は上半分を刷って 24/180 インチ送り下半分とほかの文字を刷るので、ESC J（行の高さ − 24/180）で下げてから刷り、次の空の行は送らない。漢字の縦倍だけは命令が無いので普通の大きさ（警告）、行が 24/180 に満たないときの縦横 2 倍の漢字は横倍（警告）。漢字の送りは FS S（1/180 インチ）で 2 桁（10 CPI で 6+6、12 CPI で 3+3、15 CPI で 0。既定は左 0 右 3）、半角は FS T（既定は左 0 右 2）'
        - 'ESC/POS の桁: Font A（12 ドット、漢字 24）に ESC SP と FS S の空きを足し（どちらも倍角で倍になる）、予測した位置が格子の位置 round(col × dpi / cpi) とずれたら ESC $ で置く。空白は送らず位置で飛ばす。行は ESC J でドット単位（GS P）に送り、倍高の行は 2 行分送る'
        - 'チケットの bdf-perforation-skip はテキストモードでは受けない（印字像の skip が帳票のもの）。-media と scaling はテキストモードでは使わない'
        - 'ESC/POS の倍角は GS ! に加えて、漢字のある帳票では FS ! を同じ大きさで送る（Epson の GS ! は漢字にも効くが、記事の TM-T90 は FS ! を使う。どちらも漢字の大きさを決める命令なので重ねても倍にならない）。漢字のコードは JIS（B-EP2DL が Shift_JIS を受けないため。TM 系は両方受ける）'
        - '結果の形式は「ESC/P (text)」「ESC/POS (text)」（pdl.Result.Text）'
      changed_from_plan:
      - 'ESC/P・ESC/POS のテキストモードは form-m6 の後（2026-10-20 利用者が form-m6 を別セッションで並行と決めた）。両方が入った同日に足した（text_mode）'
      - 'ZPL の Z64 は使わない（CRC の算法が公開されておらず、器も gzip と zlib で食い違う）。^GFA の ASCII 圧縮'
      - '複写の枚数は扱わない（ESC/P にも ESC/P-J84 にも命令が無く、紙厚は機種の自動検知かパネルの設定）'
      - 'winspool の URL は winspool:///名前（Go の URL はホストに %20 を許さない）。共有のキューは winspool://server/queue'
      - 'TPCL は Code 128 と GS1-128 を、SBPL は GS1-128 をプリンタの記号にしない（仕様の読みが定まらないため。ドットに揃えて描く）'
      - 'URL の profile= だけで言語が決まる（CI の手順を手元で走らせて見つけた）'
