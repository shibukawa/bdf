id: milestone:pm-5
type: milestone
title: pm-5 — 管理コンソール：1 ページ 1 項目、トポロジーのエディタ（パレット・ピン・サイドバー・パン・ズーム）、プリンタと表示もノード、テンプレートと受けるものはエンドポイントの持ち物
summary: >-
  requirement:print-manager-console の最初の段。/admin に縦に並んでいた項目を /admin/topology・/admin/inboxes・/admin/jobs・
  /admin/deliveries と /audit に分け（共通のナビ）、トポロジーは SVG のエディタにした：パレットから置き、右の口から別のノードへ
  ドラッグで辺（表示の口は逃げ道のプリンタ）、背景のドラッグでパン、ホイール・ピンチでズーム、クリックしたノードを右のサイドバーで
  種類ごとの欄で直す。サーバーでは Location と Printer を Node の種類（display・printer）に畳み、/api/locations と /api/printers を
  消して /api/nodes に寄せた（表示のボード・端末・登録コード、エンドポイントのテンプレートはそのノードの下）。テンプレートは
  エンドポイントの持ち物（記録と Blob の鍵は <endpoint>.<id>、ノードと一緒に消える）。エンドポイントは accept（both・file・template）と
  formats（変換器の名前の列）を持ち、受けないものは 415 で断って監査に残す。2026-10-21 実装。pm-5b（利用者の読むだけの表示と流れ）と
  pm-5c（入口のポート、CUPS サーバーのノード、sink、偽プリンタの絵）は後。
lifecycle: active
authority: authored
scope:
  milestone: pm-5
constraints:
- pm-1・pm-4 の制約のまま（インスタンスに状態を持たない、常駐に頼らない、print/manager は popcornweb に依らない）
- 互換は取らない：pm-4 の locations・printers のコレクションは読まれない（新しい保存先で始める）
- キャンバスは依存なしの SVG。Tailwind + daisyUI（decision:print-manager-ui-daisyui）、CDN なし
