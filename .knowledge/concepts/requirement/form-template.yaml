id: requirement:form-template
type: requirement
title: 帳票テンプレート（.bdft）と穴埋めによる .bdf 生成
summary: 特別なマークアップ文字列を入れた Word / Excel / PowerPoint を元にテンプレート（.bdft）を作り、 そこに YAML / JSON（1 ファイル）や CSV / Excel（複数ファイル）のデータを流し込んで
  .bdf を生成する。 出力は .bdf だけで、Office ファイルは作らない。.bdf → PDF の変換器を別に用意してエコシステムをつなぐ。
lifecycle: active
aliases:
- .bdft
- 帳票
- form template
- フォーム生成
authority: authored
constraints:
- 出力は .bdf。穴埋め済みの .docx / .xlsx / .pptx は作らない（2026-10-13 利用者が明示）
- Office ファイルはコンパイル時と、変換器の継ぎ目で穴埋めするときに読むだけ。穴埋めが Office ファイルを書くことはない
- テンプレートのマークアップに式言語を入れない。テンプレートは信頼できない入力なので、値・繰り返し・条件・書式だけで書ける範囲にとどめる
- 書式は Excel の表示形式コードを 3 形式共通の書式言語にする（xlsx 変換器の numfmt が実装済み）
- データはテンプレートから見て JSON の木 1 つ。CSV / Excel は名前付き配列として差し込む。結合や集計はしない（業務システム側の仕事）。繰越・小計・合計の金額も同じで、端数処理の規則はテンプレートに持ち込まない（2026-10-13
  決定）
- 画像はファイルか base64 で Options.Files の FS から読み、ネットワークからは取らない
- 行数・ページ数に予算を置く（既存の変換器の budget と同じ考え）
- 同じテンプレートと同じデータと同じフォントなら同じバイト列になる（決定性。内容アドレスでの共有とキャッシュのため）
non_goals:
- 流れる文章（Word の契約書・通知書のような本文の差し込み）。2026-10-13 時点で「今のところ不要」（pattern:flow-document）
- HTML テンプレート。html 変換器は作者の CSS を捨てるリーダー表示なので帳票に向かない
- BDF 独自のレイアウト DSL。組版は変換器側にあるので変換器を 1 つ増やすのと同じ重さになる（将来のエディタは requirement:form-editor で別に扱う）
- Office ファイルの出力
open_questions:
  bdft-container:
    text: .bdft を BDF コンテナにするか
    state: answered
    resolution: BDF コンテナにした（spec §4.5）。Part の型 tpl（記述の JSON）と src（元のテンプレート）を足し、ページはサンプルで穴埋めしたプレビュー。Go の読み手はそのまま開ける
  word-flow-in-v1:
    text: Word の流れる文章を第 1 段階に入れるか
    state: answered
    resolution: 入れない。2026-10-13 利用者「流れる文章は今の所不要で良い」。ただし docx 変換器は改ページを自前で計算しているので、継ぎ目で穴埋めすれば表の行が増えてページが増える意味論は Word でも得られる（component:wordproc-pagination）
  patterns-in-scope:
    text: taxonomy:form-layout-axes のどの形態を第 1 段階に入れるか。固定ページ式・固定行数明細のページ複製・行挿入式の 3 つが本命。ラベル・連帳・レシートは別の出力先の話も絡む
    state: answered
    resolution: 第 1 段階は推奨案の 3 つ。固定ページ式（pattern:fixed-page-form）、固定行数明細のページ複製（pattern:fixed-rows-paged-detail）、行挿入式（pattern:growing-detail）。2026-10-13
      利用者が決定。ラベル・連帳・レシート・フロー文書は後の段階
  editor-later:
    text: Office 以外の作り方（エディタ）を将来用意するか
    state: deferred
    resolution: 初期は Word / Excel / PowerPoint からの変換だけ。requirement:form-editor に論点を残す
  tag-vocabulary:
    text: 固定行数明細の属性名をどうするか。調査で見つかった原語は SVF の「最終ページのみ / 先頭ページのみ / 枠の大きさを固定 / 空なら印刷しない / リンクサブフォーム」、BI Publisher の start@last-page
      と brought / carried forward、ActiveReports の RepeatBlankRows / OverflowPlaceHolder。日本語の帳票作者に通じる名前を選ぶ
    state: open
  carry-forward:
    text: 繰越の金額をテンプレートで計算させるか（累計 RSUM 相当だけを許す）、データ側に求めるか。ラベル（前頁より / 次頁へ）はチャンクの真偽値で足りる
    state: answered
    resolution: データ側で計算する。2026-10-13 利用者が決定。理由は小数の端数処理などの規則が無限にありえて、テンプレート側に集計を持たせると規則を抱え込むことになるため。テンプレートは前頁より / 次頁への真偽値と、データが渡した繰越額を置くだけにする
  continuation-page-design:
    text: 1 ページ目（鑑＋明細）と 2 ページ目以降（明細のみ）で型が違う帳票を、SVF のリンクサブフォームや ActiveReports の別デザインページのように表せるようにするか。Excel なら 2 つの印刷範囲、Word
      なら 2 つのセクション、PPT なら 2 つのスライドを「続き」として結ぶ印が要る
    state: open
  repeat-marker-family:
    text: 繰り返しの印の流派
    state: answered
    resolution: 開始と終了の対。行の区間の方法は | rows / | slots / | pages で明示でき、既定はタグの位置（同じ行 → rows、別の行 → slots）
relations:
- relation: refines
  to: taxonomy:form-layout-axes
- relation: depends_on
  to: requirement:xlsx-print-view
- relation: depends_on
  to: decision:font-rules
- relation: depends_on
  to: decision:fill-at-converter-seams
- relation: complemented_by
  to: requirement:pdf-export
- relation: informed_by
  to: survey:template-systems-overview
- relation: informed_by
  to: system:svf
- relation: informed_by
  to: system:office-template-generators
- relation: has_milestone
  to: milestone:form-m1
facts:
  pipeline:
    compile: Office ファイル＋マークアップ → .bdft。タグの構文検証（開閉、セルや行をまたぐタグ）、スキーマ抽出（フィールド名・型・繰り返し・書式・必須）、フォントの固定、サンプルデータでのプレビュー
    fill: .bdft＋データ → .bdf。各変換器の継ぎ目でモデルを書き換え、既存の組版を走らせる（decision:fill-at-converter-seams）
    export: .bdf → PDF は別の変換器（requirement:pdf-export）。印刷・保存・外部送付の出口
  markup:
    syntax: Mustache 系。値 {{name}}、区間 {{#items}}…{{/items}}、逆 {{^paid}}…{{/paid}}、書式 {{total | fmt:"#,##0"}}、画像 {{%photo |
      fit:cover}}、エスケープ \{{。区間の方法は {{#items | rows}} / {{#rows | slots}} / {{#pages | pages}}
    fullwidth_braces: IME 対策で全角の ｛｛ ｝｝ も受け付ける
    repeat_scope: 'Excel（実装済み）: 同じセル → 文字の中、別のセル → 行の区間（rows / slots / pages）。行の区間の行はすべて項目のスコープ。Word と PowerPoint は未実装'
    run_merging: Word は校正・書式で、PowerPoint は言語ごとに run を分けるので、段落内の run をつないでタグを探す。Word は測り済みの文字 item に平らになった段階なら自動的に解消する
  data:
    root: YAML / JSON はそのまま根
    tables: -data items=lines.csv のように名前付き配列。1 行目が見出し。ブックはシート名ごとの配列
    page_arrays: 固定行数明細のデータは呼び出し側がページ単位の配列で渡す（2026-10-13 決定）。繰越額もその要素に入る
    batch: -each rows.csv でレコードごとに 1 文書。1 つの BDF にまとめる出力（印刷向け。静的部分は内容アドレスで 1 回）と、ファイルごとの出力（配布向け。segment と組み合わせて本人だけに封印）
    types: 数値は数値のまま（Excel の表示形式と右揃えが効く）、日付はシリアル値、null は空、真偽はチェックボックス
  cli_sketch:
    fill: bdf fill -data order.yaml -data items=lines.csv invoice.xlsx out.bdf（実装済み）
    each: bdf fill -each orders.csv invoice.xlsx 'out/{{no}}.bdf'（実装済み。レコードごとに 1 ファイル）
    compile: bdf template compile -sample sample.yaml invoice.xlsx invoice.bdft（実装済み）
    schema: bdf template schema invoice.bdft（実装済み）
    fonts: bdf template fonts（未実装。フォント規則と一緒に）
    registry: Format "bdft" の登録は未実装（milestone:form-m1 の registry-format）
  dedup_benefit: 静的な Object はテンプレートと同じハッシュになる。1000 枚の請求書を 1 つの BDF にしても枠は 1 回。分割形式なら文書をまたいで CDN が共有する
  delivery:
    current_milestone: form-m1（2026-10-14 実装済み、milestone:form-m1）
    outcome: 固定ページ式・固定行数明細のページ複製・行挿入式の 3 形態を、Excel を第 1 の入力として穴埋めから .bdf まで通す。前提の Excel 印刷ビューを含む
    scope_decided: 2026-10-13 利用者が推奨案を選択
    proposed_order:
    - Excel の印刷ビューと PDF 書き出し（互いに独立、単体で価値）
    - フォント規則ファイル（generate にも効く）
    - 穴埋めの核と Excel（固定ページ・固定行数ブロック・行挿入）、CLI fill、.bdft compile / schema
    - PowerPoint（図形ごとの収め直し、スライド複製）、Word（表の行の複製、固定箱）
    - -each バッチ、QR とバーコード、タグ付き PDF / PDF/A、ブラウザ内の穴埋め、examples の帳票サーバー
    later:
    - Word の流れる文章
    - ラベル・連帳・レシートの出力先
    - エディタ
  risks:
  - 帳票の利用者は Excel の印刷結果とピクセルで見比べる。Excel はプリンタ解像度で行高・列幅を丸めるので「Excel 風」で「同一」ではない
  - サーバーの日本語フォント。MS 明朝・ゴシックは同梱できない。BIZ UD / IPAex / Noto を既定に（decision:font-rules）
  - .bdft の私的な部分（Word の docx 本体、Excel の幾何）のバージョン結合。元ファイルを残せば再コンパイルで逃げられる
history:
  proposed:
    summary: 2026-10-13 利用者がチャットで提案。設計の議論を経て、OOXML 書き換え案を捨てて「.bdf だけを出す、継ぎ目で穴埋め」に改めた
