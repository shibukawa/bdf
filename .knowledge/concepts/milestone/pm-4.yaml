non_goals:
- 保管庫の Object Lock の見出し・1 日の一覧の鎖・検索項目（pm-2。archive はその土台）
- CUPS-Move-Job と job-hold-until（インボックスがその役）
- 規則で振り分けるフィルター（名前・利用者で宛先を変える）
- branch の route（pm-1 のまま 501）
- 画面の図（表だけ）
acceptance:
  s1-fanout:
    text: キュー（to が 2 つの場所）に送った 1 件が両方のボードに別の伝票として出る。文書は 1 つ。送った側の Cancel-Job で開いている伝票が下がる。keep の後、伝票が消え、文書を要る記録が無くなったジョブは文書ごと消える
    verified_by:
    - manager-tests
    - browser-admin
  s2-class:
    text: クラス（round-robin）に送った 4 件が 2 台に交互に送られる。failover のクラスで先頭が落ちていれば次のメンバーに送られ、Tried と RetryAt が残る。期限の前は再試行しない。管理者の retry は今すぐ送る
    verified_by:
    - manager-tests
    - browser-admin
  s3-inbox:
    text: インボックスに着いたジョブは pending-held。to に無い先へは流せない。流すと先のノードに着く（伝票、プリンタへの Delivery）。名指さなければ to の全部へ。捨てる・取り消しで終わる。項目を持つインボックスは消せない。keep の後に項目が消える
    verified_by:
    - manager-tests
    - browser-admin
  s4-archive:
    text: 保管に着いたジョブの .bdf と記録の JSON が保存先に 1 回だけ書かれる（2 度目は書かない）。悪い保存先の URL は PUT で断る
    verified_by:
    - manager-tests
    - browser-admin
  s5-nodes:
    text: 種類・辺・名前の重なり・自分への辺・閉路を PUT で断る。送り先にされているノード・場所・プリンタ（fallback も）は消せない。GET /api/topology が全ノードを返す
    verified_by:
    - manager-tests
  s6-cups:
    text: ipp.Client.CupsGetPrinters が /ipp/print で全ノードを返す（クラスは printer-type の印、device-uri は種類か URL）。サーバーそのものはプリンタでない
    verified_by:
    - manager-tests
  s7-direct:
    text: プリンタの名前に送ればそのプリンタに刷る。プロセス（Background）では tick なしで送られる
    verified_by:
    - manager-tests
    - browser-admin
  s8-endpoint:
    text: エンドポイントを作ると鍵が 1 度だけ返る（API はハッシュも返さない）。POST /in/<名前> は鍵なし・別の鍵を 401 で断り、文書を受けて to に流し、JSON でテンプレートの id とデータを受けて差し込んだ形を流す。テンプレートの制限（templates）、無いテンプレート、鍵の回転（古い鍵は断る）、名指されたテンプレートは消せない
    verified_by:
    - manager-tests
    - browser-admin
  s9-canvas:
    text: /admin のキャンバスに全ノードが描かれ、ドラッグで動かした位置が /api/layout に残り、口から別のノードへのドラッグで辺が足され、辺のクリックで外れる。消えたノードの位置は落ちる
    verified_by:
    - manager-tests
    - browser-admin
