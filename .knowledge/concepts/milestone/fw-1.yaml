facts:
  implementation:
    date: '2026-10-26'
    core: 'docflow/fields.go（Text・Field・FieldType・Choice、checkSettings・SettingsOf・SetSettings）、kind.go（Kind の Titles・Help・Group・Icon・Doc・Picks・Fields・Handler・Access、KindInfo の拡張、GroupSource …、AccessTopology …、required()・prints()・group()）、model.go（Node.Settings）、nodes.go（checkSettings を Check の前に）、http.go（Kind.Handler を /api/<kind>/{name}/ に、Access で門）、kinds_core.go と io/*・render（Titles・Help・Icon・Picks）'
    web: 'cmd/docflow/handlers・help・public・tailwind → docflow/web（package web）、messages → docflow/webmessages（docflow/web の下だと pw が生成物を掃くため）。DocflowConfig → Config。main.go（Options・Main・Run）、assets.go（/_docflow/）、app.go（Open に Options、Manager・Viewer、Routes）、auth.go の publicPaths。pages.pw.html の固定のパレットを空の ul に、pages.yaml の kind-*・palette-* を削除。help.go の withKindDocs（Kind.Doc を /help/nodes の末尾に）、help.Appended'
    editor: 'canvas.js の表を setKinds で API から、DEFAULT_ICONS。admin.js の KINDS を loadKinds で。topology.js の buildPalette・ownKind・fieldsForm・settingsFormOf。jobs.js・admin-jobs.js も loadKinds。ja.js の種類名の文を消し、4 つ足した'
    reference_app: 'cmd/docflow は RegisterConfig と Main(Options{Public: publicTree()})。pw 0.5.16 は public.go を求めるので、空の public の木（public/.gitkeep、dist/public/.keep、manifest）を持つ。popcornweb.toml の [generate] と [i18n].catalog を移し、[assets] は cmd/docflow の空の木'
    example: 'examples/docflow-custom：go.mod（replace ../..）、popcornweb.toml（generate は空、assets は public）、main.go、public.go、kinds/folder、config.dev.toml、devidp.toml、README。CI に go vet・go test・pw build の段'
    ci: 'ci.yml：go generate ./docflow/web、pw generate、差分は docflow/web と cmd/docflow。examples/docflow-custom の段。pw generate は examples/docflow-custom/public_manifest_pw_gen.go を「purpose の外」と警告する（入れ子のモジュールを歩く。失敗ではない）'
    not_in_fw1: 'Field の catalog・Open（fw-2）、Kind.Pick・独自の口（fw-4）、Options.Routes の先の Page・API・Nav（fw-3。Routes の口と App.Manager・Viewer だけ）'
