id: requirement:docflow-file-transfer
type: requirement
title: Docflow の FTP / SFTP — 出口（ftp・sftp）と見回りの入口（ftp-poll・sftp-poll）。SCP と HULFT は入れない
summary: >-
  2026-10-27 利用者「ftp, sftp で scp なしでお願いします。/knowledge-memory で要件整理をお願いします。他に対応すべき転送プロトコルは
  ありますか？ hulft はプロプライエタリなのでなしでよいかと」。Docflow は FTP・SFTP・SCP のどれにも対応していなかった（docflow/io は
  http・smtp・s3・ipp・notify、go.mod に ssh・ftp の部品なし、ftp は fl-1・fl-2 の non_goals で fl-4 送り）。入れるのは FTP（FTPS の
  明示的 TLS を含む。Claude の読み）と SFTP。出口は folder の雛形の遠隔版（一時名に上げて rename、あるものは書いた扱い）、入口は
  相手のサーバーを Tick で見回る（rename で取り置き → 読む → 消すか移す。Claude の推奨、答え待ち）。部品は x/crypto/ssh（既にある）の上の
  自前の SFTP クライアントと、stdlib の上の自前の FTP(S) クライアント（依存 0。Claude の推奨）。設定は fw-1 の Node.Settings + Kind.Fields。
  叙述は knowledge-inputs/print-plan/docflow-file-transfer.ja.md。他の転送プロトコルの調査は survey:transfer-protocols（次は WebDAV、
  SMB・NFS はマウント + folder、EDI 級は保留）。同日、利用者「暫定の選択（入口は Tick の見回り、ftp と sftp の 2 種類、自前の
  クライアント、AUTH TLS を要求、取ったら消す）のまま milestone:fl-4a を実装してください」で 5 つの問いが決まり、fl-4a を実装した
  （docflow/io/transfer・sftp・ftp、Kind.Tick と KindState。偽のサーバーの試験と、OpenSSH の sftp-server・sshd、vsftpd の実物で確認）。
lifecycle: active
authority: authored
aliases:
- FTP
- FTPS
- SFTP
- ftp node
- sftp node
- ftp-poll
- sftp-poll
- file transfer
- ファイル転送
- 転送プロトコル
- transfer protocol
- 見回り
- polling entry
- host key
- ホスト鍵
- SCP
- HULFT
- AUTH TLS
- RFC 4217
- posix-rename
constraints:
- 入れるのは FTP（平文と FTPS の明示的 TLS、ftps:// の暗黙の TLS）と SFTP（SSH の上の version 3）。SCP は入れない（2026-10-27 利用者）。HULFT などプロプライエタリの手順は入れない（同）
- 出口は at-least-once の delivery（fl-2 の制約のまま）：一時名 .<delivery の ID>.part に上げてから最終の名前へ rename（FTP は RNFR/RNTO、SFTP は SSH_FXP_RENAME か posix-rename@openssh.com）。再試行は、最終の名前があれば done（overwrite が無ければ）、無ければ上げ直す
- 入口は 2 つのインスタンスが同じファイルを取らない：読む前に rename で取り置く（<name>.docflow-<node>.taking）。rename に負けたら飛ばす。取り置きのまま残ったものは同じノードが次の tick で拾い直す
- 入口は常駐に頼らない（pm-1）：見回りは Tick の中（POST /api/tick かプロセスのタイマー）。ノードの every を守るため、最後に見回った時刻をノードの状態（Store.PutState）に置く
- 資格は名前で指し、値は環境変数かファイル（requirement:print-manager-auth・fl-2 の制約のまま）。URL にパスワードを書いたノードは PUT で断る。SFTP の秘密鍵は PEM をファイルの資格に置く（暗号化された鍵は当面断る）。値はログ・API・TickReport に出さない
- SFTP のホスト鍵は必ず留める（host_key）。鍵の検証を外す設定は作らない。Kind.Discover が接続して鍵を取ってくるので、エディタで見てから保存する
- FTP は受動（EPSV、無ければ PASV）とバイナリ（TYPE I）だけ。FTPS のデータ接続は制御接続の TLS セッションを再利用する
- パスの差し込みは {{meta.<key>}} だけ（式言語なし）。.. と頭の / は落とす（ExpandPath）
- 入口の MaxDocument（http.go・ipp.go と同じ上限）を超えるファイルは取らずに TickReport に出す
- 新しい種類の設定は Node.Settings + Kind.Fields（fw-1）。平らな Node の欄（url・credential・path）は使わない
- 各社の SDK を入れない方針のまま：SSH は golang.org/x/crypto/ssh（既に go.mod にある）、SFTP と FTP のクライアントは自前（Claude の推奨。open_questions.libraries）
non_goals:
- SCP（2026-10-27 利用者。OpenSSH 9.0 以降の scp は中身が SFTP）
- HULFT・JP1・EDI-Master などプロプライエタリの転送（同）
- Docflow 自身が FTP / SFTP のサーバーになること（open_questions.server-mode。別の口が要る）
- FTP の能動モード（PORT/EPRT。入りのポートが要る）、ASCII モード、FXP、REST による再開、SITE の命令
- SSH の agent・証明書・GSSAPI、暗号化された秘密鍵、known_hosts のファイル（後。ノードごとの host_key で足りる）
- 入口の「取ったものを覚えて残す」（keep。名前と更新時刻の記録が要る。delete か move だけ）
- 取ったファイルの順序の保証（名前順に取るだけ）
- WebDAV・SMB・AS2 などの他の手順（survey:transfer-protocols の判定のとおり別に）
