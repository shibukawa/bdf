      speedup: 1.421871592770102
  scope_status: warm72_300_and_semantic_tests_completed_other_metrics_deferred
  regression_checks:
    repository: all packages passed across sandbox go test ./... and unsandboxed rerun
      of converter/html + segment
    ebitengine: go test ./... passed in raster/ebitenginebdf
    race: imagebdf and cmd/bdf passed
    initial_suite_limitation: httptest could not bind loopback sockets inside sandbox;
      no test code was changed to bypass it
