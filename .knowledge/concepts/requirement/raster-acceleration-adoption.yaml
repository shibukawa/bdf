id: requirement:raster-acceleration-adoption
type: requirement
title: 明示AA OFFと有望な3施策を通常実装へ採用する
summary: 利用者の採用指示に基づき、完成画像LRU・独立ページ並列・文字列全体mask LRUを実装。AA未指定は従来品質、OFFは明示選択。
authority: authored
lifecycle: accepted
scope:
  topic: raster-acceleration
constraints:
- AAのdpi自動切替を追加しない
- 返却画像の変更がcacheを破壊しない
- 文書更新時に明示的に無効化できる
- 並列callbackは選択順、workerは終了を待って戻る
- 文字被覆率は既存走査と互換、描画状態は各回適用
capabilities:
  completed-images:
    state: implemented
    verified_by:
    - production
  parallel-pages:
    state: implemented
    verified_by:
    - production
  whole-text-masks:
    state: implemented
    verified_by:
    - production
acceptance:
  ownership-budget:
    text: 画像の所有権分離、LRU上限、無効化、FontFS更新を検証
    verified_by:
    - production
  text-pixels:
    text: 3文書72/300dpi、AA on/offで文字cache有無とcold/warmが一致
    verified_by:
    - production
  parallel-contract:
    text: 順序、重複、警告、cancel、callback error、共有資源のraceを検証
    verified_by:
    - production
  explicit-aa:
    text: Default/Onは従来品質、Offは明示指定のまま、CLI batchへ伝搬
    verified_by:
    - production
