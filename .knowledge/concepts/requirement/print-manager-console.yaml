id: requirement:print-manager-console
type: requirement
title: Print Manager の管理コンソール — 1 ページ 1 項目、Blueprint 風のトポロジーのエディタ（ノードを置いてつなぎ、サイドバーで設定）、プリンタと表示もノード、エンドポイントの持ち物（テンプレート・資格）、一般の利用者にも見える流れ
summary: >-
  requirement:print-manager の画面（milestone:pm-4 の /admin）を組み直す、2026-10-21 の利用者の要件。/admin に縦に並ぶ項目
  （Topology・Templates・インボックス・Jobs・Deliveries・Printers・Displays）を 1 ページ 1 項目にし、トポロジーは Blueprint のような
  ビジュアルのグラフエディタ（ノードを置いてつなぐ。ノードごとのサイドバーで設定）にする。プリンタと表示（display）もトポロジーの中で
  ノードとして定義する。API エンドポイントのノードは、受けるもの（テンプレート印刷かファイル印刷か）の選択、テンプレートの一覧、
  入口（「ポート設定」）、認証（client credentials）を持つ。表示のノードは初期化用の QR（URL）を出し、つないだ端末がデバイス認証を
  経て使えるようになる。プリンタのノードはプロトコルと宛先。偽プリンタ（仮想プリンタ）を置き、最新のファイルをトポロジーの上で
  見られてもよい。トポロジーは一般の利用者にも読むだけで見せ、ジョブの流れと溜まっている作業をビジュアルで見せる。
  2026-10-21 に利用者が答えた：テンプレートはエンドポイントの持ち物、「ポート設定」はエンドポイントごとの TCP のポート（Lambda ではエンドポイントごとに
  別のインスタンスを立ててそこから繋ぐ）、アプリはエンドポイントと別に登録してエンドポイントに許すアプリを選ぶ、仮想プリンタは sink のノードと偽プリンタの絵の両方。
  続けて利用者が正した：API のノードは IPP の口ではなく、印刷機能を持った Web サービスと REST で繋がる口。IPP（CUPS）の口はそれとは別の CUPS サーバーのノード。
  一般の利用者には全体のノードと、自分の権限で見られるジョブなどだけを見せる。CUPS サーバーのノードは全ノードを一旦見せる。サーバーレスは外部からの API 連携の入口で、
  Manager が入口ごとにインスタンスを立てるのではなく、外部の Lambda が入力ノードの ID をパスに持つ REST API（POST /in/{node}）を叩く。API のノードは受けるもの（file / template / both）に加えて
  受けるファイルの形式（PDF だけ、など）を持ち、余計なファイルを受けない。milestone は pm-5・pm-5b・pm-5c に分ける（合意済み）。残る問いは node-edit-live（deferred）だけ。
lifecycle: active
authority: authored
aliases:
- 管理画面
- 設定画面
- 管理コンソール
- admin console
- topology editor
- トポロジーのエディタ
- グラフエディタ
- graph editor
- Blueprint
- node editor
- サイドバー
- sidebar
- canvas
- キャンバス
- live view
- 流れの表示
constraints:
- 画面の項目は 1 ページに 1 つ（/admin に全部を縦に並べない）。項目の間はナビで移る
- プリンタと表示（display）はトポロジーのノードとして置き、編集する。別の節・別の表で足す形を残さない
- ノードの設定はそのノードのサイドバーで行う（種類ごとの欄）。確かめはサーバー（pm-4 の PUT のまま：名指す先の存在、名前の重なり、閉路、送り先にされているノードは消せない）
- テンプレート・資格（鍵）・端末の登録は、それぞれエンドポイント・表示のノードの持ち物として、そのノードのサイドバーから扱う
- 一般の利用者にはトポロジーを変える口を出さない（読むだけ）。見える数と流れは requirement:print-manager-auth の範囲（CanSee・CanSendTo）に従い、人ごとに違ってよい。scope・owner・鍵のハッシュ・保管の store の URL は利用者に出さない
- 画面は decision:print-manager-ui-daisyui の下（Tailwind + daisyUI、実行時の CDN なし、Node/npm なし）。エディタに外のライブラリを使うなら daisyUI と同じく版と sha256 を固定した 1 ファイルを置く
- 画面の文は英語（pm-4 のまま。多言語の仕組みは作らない）
- インスタンスに状態を持たない（pm-1）。流れの表示はポーリング（版・ETag）、プロセスでは SSE も。キャンバスの位置は /api/layout の記録のまま
- 端末の資格は端末に閉じた鍵（requirement:print-manager の device_auth）。QR の URL は 1 回きり・短い期限で、写しても別の端末では登録できない
- 変更の確かめ・鍵の表示と回転・端末の追加と削除は監査の記録に残る（pm-4 のまま）
- API エンドポイントのノードは REST（HTTP）の口で、印刷機能を持った Web サービスが繋ぐ。IPP は話さない。IPP と CUPS の口は CUPS サーバーのノード（2026-10-21 利用者）
- 一般の利用者に見せるのは全体のノード（名前と種類と辺）と、自分の権限で見られるジョブなど（CanSee）だけ（2026-10-21 利用者）
non_goals:
- トポロジーの版の管理（下書き・公開・差し戻し）。編集は今のまま PUT ごとに効く（open_questions.node-edit-live）
- 複数のトポロジー（サイト・テナントごとのキャンバス）。1 つの名前の空間（pm-4）のまま
- ジョブをドラッグで動かす（CUPS-Move-Job）。インボックスの「流す」がその役（pm-4 の non_goals のまま）
- 規則で振り分ける filter ノード（requirement:print-manager の topology-kinds のまま。エディタの種類の表に 1 行で足せる形は保つ）
- デバイスフロー（pm-auth-3）とアプリの /oauth/token（pm-auth-2）そのもの。ここでは画面の置き場所と形を決める
