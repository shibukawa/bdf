- predicate: bi_publisher_carry_forward
  value: show-brought-forward / show-carry-forward (first | last | exceptfirst | exceptlast)
  authority: observed
  evidence:
    url: https://docs.oracle.com/middleware/12212/bip/BIPRD/GUID-048C89F1-CFF6-48B3-9175-8C5A68167D15.htm
- predicate: bi_publisher_last_page_block
  value: '<?start@last-page:body?>…<?end body?>'
  authority: observed
  evidence:
    url: https://docs.oracle.com/en/middleware/bi/analytics-server/design-publish/template-features.html
- predicate: carbone_repeat_sentinel
  value: "{d.items[i].x} and {d.items[i+1].x}"
  authority: observed
  evidence:
    url: https://carbone.io/documentation/design/repetitions/with-arrays.html
- predicate: docxtemplater_table_loop_rule
  value: open in first cell, close in last cell of the row
  authority: observed
  evidence:
    url: https://docxtemplater.com/docs/tag-types/
- predicate: templater_has_loop_syntax
  value: false
  authority: observed
  evidence:
    url: https://github.com/ngs-doo/TemplaterExamples
- predicate: smart_forms_window_model
  value: one flowing main window + fixed truncating secondary windows
  authority: observed
  evidence:
    url: https://help.sap.com/saphelp_470/helpdata/en/70/e17a37dec511d3b575006094192fe3/content.htm
