id: milestone:form-m3
type: milestone
title: form-m3 — PDF の影、QR コードとバーコード
summary: 3 つ目の実装のまとまり。PDF の書き出しで影を描き、帳票のテンプレートの画像タグで QR コードとバーコードを描く。2026-10-14 に実装し、Go のテスト・fuzz・ZXing と python-qrcode での突き合わせ・Ghostscript と Quartz での読み取りが通った。利用者向けの説明は
  docs/forms.ja.md、設計は docs/design.md §3.34・§3.35。
lifecycle: active
authority: authored
scope:
  milestone: form-m3
  input: xlsx, docx, pptx
  output: bdf, pdf
constraints:
- 記号は画素の画像にしない。暗いモジュールを矩形のパスにして FILL_PATH 1 つで塗る（ビューア・ラスタライザ・PDF で同じ形）
- PDF の影は影だけを画像にし、影を落とす図形はベクタのまま残す
- 記号は作るだけで読まない。値の意味（実在の商品か）は見ない
non_goals:
- バーコードの下の目視文字、ITF-14 のベアラバー
- カスタマバーコード（郵便）、DataMatrix、PDF417、QR コードの漢字モード・ECI・連結
- タグ付き PDF・PDF/A・PDF の暗号化、フォントの対応規則（別トラック）
capabilities:
  barcode-encode:
    state: implemented
    about: capability:barcode/encode
  form-code-tags:
    state: implemented
    about: capability:form/code-tags
  pdf-shadows:
    state: implemented
    about: capability:pdfbdf/shadows
  raster-group-shadow:
    state: implemented
    about: capability:imagebdf/group-shadow
facts:
  tag_syntax: '画像タグのオプション: qr（qr:L / M / Q / H）、barcode:<種類>（jan, ean13, ean8, upca, code39, code128, gs1-128, itf, itf14, nw7）、quiet:N（0 は余白なし）。構文は Claude の案で、利用者の確認はまだ'
  placement: Excel はタグのセル（結合セルならその範囲）、Word と PowerPoint は代替テキストにタグを書いた画像の枠。QR は正方形のまま収め、バーコードは枠いっぱいに伸ばす。DrawingML には InjectDrawing で描く関数を渡す
  field_code: tpl の fields の image に code が付く（spec §4.5）
  pdf_shadow: 影を落とす図形 1 つを同じ状態で imagebdf に描かせ、アルファを internal/gauss でぼかし、影の色の SMask つき画像にしてページに平行な空間で図形の下に置く。300 dpi、1 つ 4,194,304 画素、文書全体で 2.56 億画素まで
  group_shadow: GROUP_BEGIN を囲む状態の影はグループ全体の影（Canvas が一時キャンバスを drawImage するときの影。draw.io の図形）。Go のラスタライザはこれを描いていなかったので直した。PDF はグループの命令を記録して bdf.NewReplay で写し、グループだけを描き直して影にする
  found_on_the_way: Excel で空のセルに置いた画像タグは、使用範囲に数えられずページから外れていた。穴埋めした画像のセルを使用範囲に入れた
acceptance:
  codes-readable:
    text: 全種類の記号が外部の読み取り実装で元の文字に読める。QR コードは全バージョン・全レベル。穴埋めした帳票の画像と、PDF を Ghostscript と Quartz で描いた画像からも読める
    verified_by:
    - barcode-unit
    - barcode-external
    - form-codes
    - form-codes-pdf
  shadows-in-pdf:
    text: 影のある文書を PDF にすると、読み直した絵が元の文書の絵と一致する。グループの影は 1 つで、図形の下にある
    verified_by:
    - pdf-shadow-tests
    - pdf-sweep-2
  unchanged:
    text: 帳票のサンプル以外の fixture は変わらない。CI の fixture 検査を amd64 のビルドで再現して差分なし
    verified_by:
    - fixtures-replay
verification:
  barcode-unit:
    state: passed
    method: unit
    test: go test ./image/barcode (TestQR, TestLinear, TestPath, FuzzEncode 20 秒)
    authority: observed
    evidence:
      path: image/barcode/barcode_test.go
      locator: テストの中だけにある QR コードの復号で全バージョン・全レベルを往復。バーコードは幅の並びとチェックデジット
  barcode-external:
    state: passed
    method: manual
    test: BARCODE_DUMP で書いた記号を test/barcode/read.py で zxing-cpp に読ませ、python-qrcode とマスクを固定して比較
    authority: observed
    evidence:
      path: test/barcode/read.py
      locator: ZXing が 255/255 を読み、python-qrcode と 56/56 がモジュール単位で一致（venv はリポジトリに入れていない）
  form-codes:
    state: passed
    method: unit
    test: TestFillCodes（converter/xlsx・converter/pptx・converter/docx）、TestCodes（form/tag）
    authority: observed
    evidence:
      path: converter/pptx/template_test.go
      locator: 矩形の数と枠、図の代替テキスト、fields の code、入らない値の警告と厳密時のエラー、値なしは何も描かない
  form-codes-pdf:
    state: passed
    method: manual
    test: 3 形式の form-fixed を穴埋め → bdf render と bdf pdf → Ghostscript 300 dpi と Quick Look の画像を zxing-cpp で読む
    authority: observed
    evidence:
      path: testdata/form/pptx-fixed.pdf
      locator: QR と JAN がすべて読めた。Ghostscript の 216 dpi・アンチエイリアスなしでは、幅 120 pt の JAN だけ読めない（解像度の限界）
  pdf-shadow-tests:
    state: passed
    method: integration
    test: go test ./vector/pdfbdf (TestShadows, TestGroupShadow, FuzzWrite 40 秒)、go test ./raster/imagebdf (TestGroupShadow)、go test . (TestReplay)
    authority: observed
    evidence:
      path: vector/pdfbdf/pdfbdf_test.go
      locator: PDF を converter/pdf で読み直した絵との差が 1.5/255 以下。影の画像の数と描画順
  pdf-sweep-2:
    state: passed
    method: manual
    test: testdata の 121 文書を bdf pdf → Ghostscript → bdf render と比較
    authority: observed
    evidence:
      path: vector/pdfbdf/shadow.go
      locator: エラーと Ghostscript のメッセージは 0 件。draw.io の影つきの図形がブラウザの golden と同じ影になった
  fixtures-replay:
    state: passed
    method: integration
    test: ci.yml の fixture 検査を GOARCH=amd64 のビルドで再生
    authority: observed
    evidence:
      path: .github/workflows/ci.yml
      locator: form-fixed の 6 文書と pptx-fixed.pdf、pages.bdft を更新した後は差分なし。golden は Docker で form-fixed-1・form-docx-fixed-1・form-pptx-fixed-1 を作り直した
relations:
- relation: follows
  to: milestone:form-m2
- relation: implements
  to: requirement:form-template
- relation: implements
  to: requirement:pdf-export
