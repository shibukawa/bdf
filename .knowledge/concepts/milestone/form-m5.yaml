id: milestone:form-m5
type: milestone
title: form-m5 — タグ付き PDF と PDF/A、PDF フォームと pdfme のテンプレート
summary: 5 つ目の実装のまとまり。PDF の書き出しにタグ付き PDF と PDF/A（2b・2u・2a、3b・3u・3a）を足し、場所の決まったフィールドを持つ 2 つの形式をテンプレートにした。入力欄のある PDF（AcroForm）と、pdfme
  のデザイナーが保存する JSON。どちらも form.Fill・Fields・Schema・.bdft・デモサイトのフォームのページで、タグのテンプレートと同じに扱える。2026-10-14 に実装し、Go のテスト、veraPDF、Node 版 pdfme
  との突き合わせ、サイトのスモークテスト、実ブラウザでの確認が通った。説明は docs/forms.ja.md、設計は docs/design.md §3.34・§3.35。
lifecycle: active
authority: authored
scope:
  milestone: form-m5
  input: pdf (AcroForm), pdfme template json, xlsx, docx, pptx, bdft
  output: bdf, pdf (tagged, PDF/A-2/3 b/u/a), JSON Schema
constraints:
- 出力は .bdf だけ（PDF は bdf pdf で書く）。埋めた PDF フォームに入力欄は残さない
- pdfme の生成器（6.2.4）と同じ規則で埋める。式は自前の評価器で、任意のコードは動かさない
- 同じテンプレートと同じデータから同じバイト列（amd64 と arm64 でも）。式の date と dateTime は時計から読まず、データの値にする
- データは JSON の値で受ける（pdfme の文字列の入力ではない）
non_goals:
- PDF/UA を名乗ること（構造は書くが、文書そのもののタイトル・言語・見出しの順序が要る）
- PDF/A-1（透明を持てない）
- pdfme のテキストの中の Markdown 風の書式、japanpost・upce・gs1datamatrix・pdf417 のコード
- pdfme のデザイナーそのものを組み込むこと（テンプレートの JSON を読むだけ）
- PDF の暗号化
capabilities:
  tagged-pdf:
    state: implemented
    about: capability:pdfbdf/tagged
  pdfa:
    state: implemented
    about: capability:pdfbdf/pdfa
  pdf-form-template:
    state: implemented
    about: capability:form/pdf-form
  pdfme-template:
    state: implemented
    about: capability:form/pdfme
  site-form-page:
    state: implemented
    about: capability:site/form
facts:
  tagged: MARK を構造木に写す（P・H1〜H6・L/LI・Table/TR/TH/TD・Figure・Link）。内容は MCID の印、装飾の役割のレイヤーと影と枠線は Artifact。フォームの中は StructParents と MCR の Stm、リンク注釈は OBJR。行のそろっていない表は空の
    TD で長方形にする
  pdfa: sRGB の出力インテント（ICC は自前で作る）、pdfaid の XMP、Interpolate なし、.notdef を描かない（どのフォントにもない文字は省いて警告）、レベル a は私用領域の文字に警告
  pdf_form: converter/pdf の FormFields が入力欄を読み、Options.Form で欄の見せ方を変える（ボタンは状態の外観、テキストは /Tx の中だけ消す）。converter/pdfform が値を描く（pdf.js の外観の規則。1 行は中央、複数行は上から、大きさ
    0 は収まる大きさ、comb）。フォームのフォント名は書体の手がかりだけにして、文字を持つマシンのフォントで描く
  pdfme: converter/pdfme。テキストの置き方（アセントと行間の調整）、dynamicFontSize（0.25 pt 刻み）、表（列幅の百分率、行の高さ、縞、repeatHead）、白紙の土台の動的レイアウト（単位の高さをページに詰める）、staticSchema、式（expr.go）、PDF
    の土台は converter/pdf で変換して上に描く。デザイナーに残した content はサンプル（Defaults）
  shared: converter/internal/formbox が値を描く部分（フォントの選択と計測、折り返し、文字・画像・記号・印）を持ち、pdfform と pdfme が使う
  fields: tag.Field に type・options・labels・label・default・maxLength・multiline を足した。スキーマでは型と format、enum、default、maxLength、title、x-bdf.labels になる。pdfme の式が読むデータの名前（「合計
    {total}」の total、date、dateTime）もフィールドに出す
  site: フォームのページが .pdf と pdfme の .json を受け取り、サンプルを 3 つ足した（12 テンプレート）。enum は選択肢、default は最初の値。PDF は通常・タグ付き・PDF/A-2b/2u/2a から選ぶ。bdf-form.wasm は PDF の変換器が入って約 26 MB（gzip
    7.0 MB）になった（それまで 18 MB、5.1 MB）
  found_on_the_way:
  - PruneGlyphs が、最後の全幅メトリックを共有するグリフの送り幅を 0 にしていた（veraPDF 6.2.11.5 で見つかった）。直した
  - PDF の注釈の外観のキャッシュが、直接書かれた状態の辞書で衝突していた（チェックなしのボックスにラジオの外観が出る）。状態のストリームごとの鍵にした
  - image/barcode の Path が arm64 で積和を融合して amd64 と下位ビットが違っていた（原点が 0 でない場所に描いたとき）。積を丸めてから足すようにした
  - formbox の文字の幅に、文字間の最後の 1 つ分が入っていなかった（PDF の書き出しが文字列を縮めていた）
  differences_from_pdfme: バーコードの下の文字は 1 行で置く（pdfme は bwip-js の SVG を枠に引き伸ばす）。QR コードとバーコードは内容は同じでもマスクやコードセットの選び方が違う。SVG は枠に全体を収める（pdf-lib は横長の枠で切り落とす）。チェックボックスの角は丸い。フォントの合字（fi）は使わない
acceptance:
  pdfa-valid:
    text: testdata の全文書が PDF/A-2b と 2u の検査に通る。2a は私用領域の文字を持つ文書を除いて通る
    verified_by:
    - verapdf-sweep
  tagged-same-picture:
    text: タグ付きの PDF は、タグなしと同じ絵になる
    verified_by:
    - pdfbdf-unit
    - ghostscript-compare
  pdf-form:
    text: 入力欄のある PDF をデータで埋めると、値が欄の場所に入り、スキーマに選択肢・最大文字数・既定値が出る
    verified_by:
    - form-unit
    - site-smoke
    - browser-check
  pdfme-parity:
    text: 同じテンプレート・データ・フォントで、pdfme の生成器と文字の位置・表の行の高さ・ページの切れ目・押し下げの量が一致する
    verified_by:
    - pdfme-oracle
    - form-unit
  deterministic:
    text: 新しい fixture（PDF フォーム、pdfme の 2 つ、PDF/A-2a の PDF）が amd64 と arm64 で同じバイト列になる
    verified_by:
    - fixture-replay
verification:
  verapdf-sweep:
    state: passed
    method: integration
    test: testdata の 124 文書を bdf pdf -pdfa 2b / 2u / 2a で書き出し、veraPDF（Homebrew）で検査
    authority: observed
    evidence:
      path: vector/pdfbdf/pdfa.go
      locator: 2b 124/124、2u 124/124、2a 122/124（font/stix と pdf/weasyprint-webfonts は私用領域の文字。警告のとおり）
  pdfbdf-unit:
    state: passed
    method: unit
    test: go test ./vector/pdfbdf（TestTagged、TestTaggedDocuments、TestPDFA、FuzzWrite）
    authority: observed
    evidence:
      path: vector/pdfbdf/tags_test.go
      locator: 構造木と MCID の対応、表、装飾、PDF/A の出力インテントと XMP
  ghostscript-compare:
    state: passed
    method: manual
    test: Ghostscript でタグ付きとタグなしを描いて比べる（厳格モードでメッセージなし）
    authority: observed
  form-unit:
    state: passed
    method: unit
    test: go test ./form ./converter/pdfform ./converter/pdfme ./converter/pdf（TestFillPlaced、TestLayout、TestBasePDF、TestValues、TestFormFields、FuzzFill、FuzzExpr）
    authority: observed
    evidence:
      path: converter/pdfme/pdfme_test.go
      locator: 行の高さ（10 pt と余白）、24 行と 10 行のページ割り、押し下げられた合計の位置、式、日付の書式、テンプレートの誤り
  pdfme-oracle:
    state: passed
    method: manual
    test: Node の @pdfme/generator 6.2.4 を同じフォント（M PLUS 1p のサブセット）で動かし、Ghostscript で描いて重ねる
    authority: observed
    evidence:
      path: test/pdfme/gen.py
      locator: invoice（2 ページ）と certificate、機能を並べた 1 枚（3 ページ）。残る差は QR コードとバーコードの符号化、画像の補間、チェックボックスの角
  site-smoke:
    state: passed
    method: integration
    test: node site/build.mjs && node test/site.mjs
    authority: observed
    evidence:
      path: test/site.mjs
      locator: form モジュールで 12 テンプレートを fields・fill・pdf（通常、タグ付き、PDF/A-2a）。pdfme は自分のサンプルで 1 ページに埋まる
  browser-check:
    state: passed
    method: manual
    test: アプリ内ブラウザで site/dist のフォームのページを開いて操作
    authority: observed
    evidence:
      path: site/form/main.ts
      locator: PDF フォーム（選択肢、チェック、マス目）、pdfme の 2 つ、PDF/A-2a の保存（%PDF-1.7、pdfaid、StructTreeRoot を確認。ダウンロードは発生させていない）
  fixture-replay:
    state: passed
    method: integration
    test: ci.yml の fixture の検査を amd64 のビルドで再生し、arm64 のビルドの出力と cmp
    authority: observed
    evidence:
      path: .github/workflows/ci.yml
      locator: testdata/form/pdf-application.bdf、pdfme-invoice.bdf、pdfme-certificate.bdf、pdfme-invoice.pdf（PDF/A-2a。veraPDF も合格）
open_questions:
  font-mapping:
    state: open
    text: テンプレートのフォント名（pdfme の fontName、PDF フォームの DA）と、組むマシンのフォントの対応規則。いまは名前で探して、なければ代わりのフォント
    resolution: 未決。フォントの対応規則（利用者が必要としている、未実装）を作るときに決める
  barcode-text:
    state: deferred
    text: pdfme のバーコードの下の文字を bwip-js と同じ配置にするか（EAN の左の数字、ガードバーの長さ）
    resolution: いまは 1 行で置く。pdfme のテンプレートでバーコードの見た目の一致を求められたら見直す
