  ipp-server:
    state: implemented
    about: capability:print/ipp-server
  raster-intake:
    state: implemented
    about: capability:print/raster-intake
  mdns-advertise:
    state: implemented
    about: capability:print/mdns-advertise
  wide-area-dns-sd:
    state: implemented
    about: capability:print/wide-area-dns-sd
  airprint:
    state: implemented
    about: capability:print/airprint
  infra-proxy:
    state: implemented
