id: requirement:partial-fill
type: requirement
title: 一部だけ埋めた帳票（.bdff）と、手書きサイン・印影の画像欄
summary: >-
  .bdft のパラメータを全部は与えず、一部を空欄のまま残した「記入中の帳票」を .bdff として作る。
  契約書なら自分の名前などを入れて相手に渡し、相手がウェブサイト（または手元）で残りを埋めると .bdf が完成する。
  .bdff は .bdft と同じ BDF コンテナで、テンプレート（src、同じハッシュ）・埋めた値・残りのフィールド名と、
  残りだけの JSON Schema を持つ。あわせて、テキストではなく絵を受ける欄として、手書きのサイン（描画パッド）と印影（画像の取り込み）を
  画像のフィールドの入力の種類として足す。2026-10-22 利用者の提案。設計は Claude の案で、未確定の論点は open_questions。
lifecycle: active
aliases:
- .bdff
- 部分入力
- 記入中の帳票
- partial fill
- サイン欄
- signature field
- 印影
authority: authored
constraints:
- .bdff は BDF コンテナ（spec §4.5 の .bdft と同じ Part の型 src と tpl）。ビューア・サムネイル・テキスト抽出はふつうの文書として開ける。ページは埋めた値で穴埋めし、残りの欄は空のまま描く
- src は .bdft のものをそのまま持つ（同じバイト列なので同じハッシュ。テンプレートを配った側とで内容アドレスが共有される）
- 残りを埋めるときは .bdff の値と新しいデータを合わせて元のテンプレートを 1 回で穴埋めする（.bdff のページの上に描き足さない）。結果は .bdft＋全部のデータで埋めたものと同じバイト列になる（決定性）
- 新しいデータが埋めた値を書き換えることは許さない（同じ名前を与えたら誤り）。残りの名前に無い名前も誤り
- サインの欄は画像のフィールドの一種で、値は画像（Options.Files の FS か data URL）。テンプレートの側は画像の欄と同じ箱で、新しい描き方は足さない
- 手書きのサインの画像は電子署名ではない。改ざんの検出や本人性の証明をこの機能が名乗らない（ドキュメントにもそう書く）
non_goals:
- 電子署名そのもの（requirement:tamper-evidence で扱う）
- 誰がどの欄を埋めるかの役割と順序の管理（DocuSign の受信者の役割に当たるもの）。最初は「残り」1 組だけ（open_questions.roles）
- 配列（明細の行）の一部の項目だけを残すこと。区間は全部埋めるか全部残すか
- ページの上に入力欄を重ねる画面（ページの横のフォームで足りる。欄の座標が要るので後で）
open_questions:
  extension-name:
    text: 拡張子と呼び名。利用者案は .bdff。.bdft のまま tpl に filled を足すだけにする案もある
    state: answered
    resolution: >-
      2026-10-22 利用者「順に実装をお願いしたい」で暫定案のまま form-m7 として実装（milestone:form-m7）。暫定案（Claude）：.bdff を採る。テンプレート（だれでも何度でも埋める）と記入中の 1 通の書類（相手が残りを埋めて 1 回で終わる）は扱いが違い、
      ファイルの一覧や受け渡しの画面で見分けられる方がよい。中身は同じ tpl の形で、filled のある tpl を .bdff と呼ぶ。spec §4.5 に節を足す
  open-list:
    text: 残す欄をどう決めるか。(a) 明示した名前だけを残し、ほかの欠けは誤り、(b) データが与えなかった名前を全部残す
    state: answered
    resolution: 2026-10-22 利用者「順に実装をお願いしたい」で暫定案のまま form-m7 として実装（milestone:form-m7）。暫定案（Claude）：(a)。送る側が名前を書き漏らしたまま相手に送る事故を防ぐ。CLI は bdf fill -open party_b,signature_b。(b) は -open '*' で選べる
  open-granularity:
    text: 残す単位。スキーマのプロパティの道（party_b.name のようにドットで入れ子）で、配列（区間）は丸ごと。オブジェクトの一部だけ残せる
    state: answered
    resolution: 2026-10-22 利用者「順に実装をお願いしたい」で暫定案のまま form-m7 として実装（milestone:form-m7）。この単位で実装
  integrity:
    text: 受け取った人が .bdff の埋めた値（tpl の filled）を書き換えられる。改ざんをどう扱うか
    state: answered
    resolution: >-
      2026-10-22 利用者「bdf やそこから生成される pdf への改ざん防止機能はまた欲しい」。requirement:tamper-evidence で扱う。
      送る側は .bdff の値（src のハッシュ・filled・open）に CMS で署名し、完成品はその署名を tpl に持ったまま、受け手か立会人が文書全体にもう 1 度署名する。
      ウェブで埋める使い方ではサーバーが .bdff を持つので、署名がなくても相手は値を書き換えられない
  roles:
    text: 3 者以上の書類（申請者・承認者・保証人）で、残りを何組かに分けて順に埋めるか。.bdff をさらに一部だけ埋めて .bdff を作れば連鎖はできる
    state: deferred
    resolution: 最初は .bdff → .bdff の連鎖だけを許し（残りの一部を埋めると残りの少ない .bdff）、役割の名前は持たない。役割ごとの欄の割り当てが要る例が出たら見直す
  signature-format:
    text: 描画パッドの出力を SVG（線のパス）にするか PNG にするか
    state: answered
    resolution: >-
      2026-10-22 利用者「順に実装をお願いしたい」で暫定案のまま form-m7 として実装（milestone:form-m7）。暫定案（Claude）：SVG。線の座標だけなので小さく、PDF でも拡大してもぼけない（spec §6.2 は SVG の画像を持てる。vector/pdfbdf も SVG を描く）。
      サイトのパッドは Pointer Events の筆圧を線の太さにする。取り込みの画像（印影・スキャンしたサイン）は PNG / JPEG のまま
  seal-mode:
    text: 印影（判子の画像）を別の入力の種類にするか。透過（白を抜く）と朱色の単色化、円や角の切り抜きを入力の側でするか
    state: answered
    resolution: 2026-10-22 利用者「順に実装をお願いしたい」で暫定案のまま form-m7 として実装（milestone:form-m7）。暫定案（Claude）：signature（描く）と seal（画像を選んで白を抜く）の 2 つ。どちらも値は画像で、テンプレートの側は同じ画像の欄
  signed-metadata:
    text: サインした日時・名前を一緒に残すか
    state: answered
    resolution: 2026-10-22 利用者「順に実装をお願いしたい」で暫定案のまま form-m7 として実装（milestone:form-m7）。暫定案（Claude）：テンプレートの側の別の欄（日付の値）として作者が置く。サインの欄そのものは画像だけを持つ。監査の記録は Docflow の trace（人の操作のノード）の仕事
