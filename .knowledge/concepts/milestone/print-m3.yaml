open_questions:
  pdf-copies-raw:
    text: 9100 と LPD に PDF を送るとき、部数を PJL（QTY・COPIES）で頼むか、ページの繰り返しで持つか
    state: answered
    resolution: ページの繰り返し。PJL の部数の意味は機種で違う（QTY は丁合、COPIES は丁合なし）ため。PostScript は NumCopies と Collate
  lpd-begun:
    text: LPD で「始めた」を制御ファイルの前に記録すると、制御ファイルを送る前に落ちたジョブも保留になる
    state: answered
    resolution: そのとおりにした。記録と送信の間に落ちたのか送信の後に落ちたのかは分けられないので、安全な側（保留）に倒す
facts:
  delivery:
    plan: knowledge-inputs/print-plan/print-m3.ja.md（2026-10-20）
    implemented:
      date: '2026-10-20'
      commits: [17d5576 S1 Apple Raster と PCLm, 9fa9d4a S2 vector/psbdf と平坦化, 00db930 S3 PostScript を IPP で, 781edee S4 9100 と LPD]
      changed_from_plan:
      - 'psbdf.Options の両面は Duplex と Tumble でなく Sides（IPP の名前）。空ならプリンタに任せ、IPP の sides の属性を PostScript が打ち消さない'
      - '9100 と LPD の文書づくりは print.PrintRaw（print/raw は搬送路だけで print に依らない）。print.RawCapabilities がスプールとサーバーの能力'
      - 'LPD の「始めた」は制御ファイルを送る直前。制御ファイルの拒否（\0 でない応答）は送り直せる'
      - '9100 は送り終えたら送信側を閉じ、プリンタが閉じるのを 10 秒まで待つ。その前のリセットは ErrPartial'
      - 'スプールは 9100 と LPD のプリンタに、動いていると分かっている間は接続を試さない（monitor）。送れなかったら試す'
      - 'IPP USB はこの機械の応答者に 127.0.0.1:5353 で直接問う（Linux の lo にマルチキャストが無いため）。マルチキャストのあるループバック（macOS の lo0）は他のインターフェースと同じに聞く'
    slices:
    - 'S1 print/raster の urf.go と pclm.go と読み手、ipp.Printer の pclm-*、ipptest、形式の選び方、-format urf|pclm'
    - 'S2 vector/psbdf（Type 3 のフォント、画像、shfill、setpagedevice、DSC）と vector/internal/flatten、Ghostscript のテストと fuzz'
    - 'S3 PostScript を IPP で、print.PlacePS、形式の順 PDF → PostScript → PWG → URF → PCLm、PDF を拒まれたら PostScript'
    - 'S4 print/raw（9100、LPD、PJL）と rawtest、print.PrintRaw、bdf print の URL、スプールとサーバーのプリンタ、照合の規則'
    - 'S5 IPP USB（ループバック）、docs（cli、print-server、design §3.36、api）、CI（Ghostscript、PostScript の ippeveprinter、9100）、.knowledge'
  measurements:
    ghostscript_vs_imagebdf: 'testdata の文書を Ghostscript（72 dpi、文字と図形のアンチエイリアス 4）で描いた PostScript と imagebdf の絵の差は、PDF を同じく Ghostscript で描いたときとほぼ同じ（form/fixed 2.99 対 3.12、xlsx の 2 ページ目 9.30 対 9.57、docx/vertical は 2.57 対 2.15。差は文字の縁の塗り方）'
    file_sizes: 'form/fixed 40 KB、pptx/basic 648 KB（5 ページ、絵 1）、pdf/chrome-masks 808 KB（ページ全体が絵）'
