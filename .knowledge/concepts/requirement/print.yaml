history:
  vector-paths:
    summary: 2026-10-19 利用者「PDF 以外のベクトルデータを使う仕組みも多いと思う。Microsoft のやつとか」。PDF 以外のベクタの経路（OS のパイプライン、直接受ける PDL、常駐フォーム）を調べて §3.4 にまとめ、PostScript を第 2 のベクタ経路、Windows は GDI、HP-GL/2 を CAD の出口とした。前の版の「OpenXPS を XPS_PASS で渡す」は XPS_PASS がパイプラインを飛ばす直送だと分かり取り下げた
  format-decision:
    summary: 2026-10-19 利用者「ベクトルデータもあるのでそちらで印刷できるならそれを優先したい」。既定を Raster 優先から PDF（ベクタ）優先に改め、Raster を PDF を受けないプリンタの後ろ盾にした
  proposed:
    summary: 2026-10-19 利用者がチャットで提案（「ラスタライズなども含めてかなりの機能が揃ってきた。プリンタに繋いで印刷。スプール管理も含めてシステム化。最終段の接続は新しいプロトコルから。Windows / mac / Linux。ローカルプリンタと、複数台のリモートプリンタを制御するプリントサーバー」）。同日に Web 調査と要件の整理
