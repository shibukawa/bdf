acceptance:
  s1-urf-pclm:
    text: Apple Raster（UNIRAST、32 バイトのページの見出し、PWG Raster と同じ行の符号）と PCLm（PDF 1.7、%PCLm 1.0、帯の画像）を書き、自前の読み手で戻した画素が描いた画素と一致し、PCLm は Ghostscript でも開ける。urf-supported と pclm-* から色・解像度・帯・圧縮・裏面を選ぶ。-format urf|pclm
    verified_by:
    - raster-unit
    - print-formats
  s2-postscript:
    text: testdata の文書（帳票、PowerPoint、Word、Excel の印刷ビュー、PDF 由来のソフトマスク、draw.io、写真、縦書き）を PostScript にして Ghostscript で描いた絵が、imagebdf の絵と PDF を Ghostscript で描いたときと同じ差に収まる。透明な所だけが絵になり（数を確かめる）、DSC と setpagedevice、限界（入れ子、再利用、閉じない q）と fuzz
    verified_by:
    - psbdf-ghostscript
    - psbdf-fuzz
  s3-postscript-ipp:
    text: PostScript だけのプリンタ（ipptest）に、用紙に置いた PostScript を送る（グレー、両面、printer-resolution）。PDF を拒むプリンタには PostScript を先に送る。形式の順は PDF → PostScript → PWG Raster → Apple Raster → PCLm
    verified_by:
    - print-formats
  s4-raw:
    text: 9100 と LPD の偽のプリンタ（rawtest）に PostScript と PDF（PJL）を送り、受けないチケットは警告し、途中で切れた 9100 は ErrPartial、制御ファイルの前で切れた LPD は送り直せる。スプールは届かないプリンタに送り直し、切れたジョブと始めた後で落ちたジョブを保留し、始める前で落ちたジョブを送り直す。bdf print -printer socket://…、printd.yaml の socket:// と lpd://
    verified_by:
    - raw-unit
    - raw-spool
    - cli-raw
  s5-ipp-usb:
    text: この機械の応答者（127.0.0.1:5353）に直接問い、ループバックで広告された USB の IPP 機を Local の印つきで見つける。bdf printers に this machine と出る
    verified_by:
    - browse-loopback
