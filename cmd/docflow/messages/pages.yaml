# The apps.
apps-title:
  locales:
    en: "Apps · BDF Docflow"
    ja: "アプリ · BDF Docflow"
apps-note:
  rich: true
  locales:
    en: "Applications with credentials of their own. A backend takes a token at <token>POST /oauth/token</token> with its id and secret (client credentials), sends to the endpoints that list it among their apps, and reads the HTTP (pull) nodes that list it (the scope export); over IPP it sends the same id and secret as Basic, to the CUPS servers that list it. The secret is shown once. A public client is a frontend in people's browsers: it has no secret, and gets a token of the person using it at <authorize>/oauth/authorize</authorize> (the authorization code grant with PKCE), sent back to one of its redirect URIs, to read the HTTP (pull) nodes as that person. The scopes tick and admin are for a scheduler and for scripts."
    ja: "自前の資格情報を持つアプリケーションです。バックエンドは id とシークレットで <token>POST /oauth/token</token> からトークンを受け取り（クライアントクレデンシャル）、自分をアプリに挙げたエンドポイントに送り、自分を挙げた HTTP (pull) ノードを読みます（スコープ export）。IPP では、自分を挙げた CUPS サーバーに、同じ id とシークレットを Basic で送ります。シークレットは 1 度だけ表示されます。公開クライアントは人のブラウザで動くフロントエンドです。シークレットを持たず、使っている人のトークンを <authorize>/oauth/authorize</authorize>（PKCE 付きの認可コードグラント）で受け取り、リダイレクト URI の 1 つに戻して、その人として HTTP (pull) ノードを読みます。スコープ tick と admin は、スケジューラとスクリプトのためのものです。"
