id: milestone:pm-5b
type: milestone
title: pm-5b — 誰でも見られる読むだけのトポロジー（/topology）と、自分の権限で見えるジョブの数と流れ
summary: >-
  requirement:print-manager-console の 2 つ目の段。サインインした人は誰でも /topology でトポロジーの全体（ノードの名前・種類・辺。設定は出さない）を
  見られ、数と流れは自分の権限で見られるジョブ（CanSee：自分のものとグループのもの、管理者は全部）の分だけ。GET /api/topology を利用者に開き
  （管理者以外には scope・owner・store・url・formats などの設定と数を落とす）、GET /api/topology/live（ノードごとの held・open・pending・
  failed・recent と、直近 10 分の足跡 flows。ETag で 4 秒ごとに問う）を足した。キャンバスは canvas.js に切り出して管理者のエディタと共有し、
  数のバッジと、辺の上を走る点（animateMotion）を両方に出す。ノードをクリックすると自分のジョブの一覧と、送れるノードなら印刷のフォーム。
  2026-10-21 実装。
lifecycle: active
authority: authored
scope:
  milestone: pm-5b
constraints:
- 一般の利用者にトポロジーを変える口を出さない。/api/layout の PUT と /api/nodes は管理者のまま
- 利用者への /api/topology は設定を出さない（scope・owner・key_hash・store・collection・url・route・formats・accept・keep・templates・in と、管理者向けの数）
- 数と流れは CanSee で絞る。ポーリングは版（ETag）つきで、変わらなければ 304
- 依存なしの SVG（decision:print-manager-ui-daisyui）。点の動きは SMIL の animateMotion
capabilities:
  user-topology-view:
    state: implemented
    about: capability:print-manager/user-topology-view
  live-flow:
    state: implemented
    about: capability:print-manager/live-flow
  live-in-editor:
    state: implemented
    about: 管理者のエディタも同じ活動（全ジョブ）を 4 秒ごとに読み、バッジと点を出す
non_goals:
- SSE（プロセスで動くときの押し出し）。requirement:print-manager の notify-transport のまま後
- 利用者からの文書のダウンロード以外の操作（刷り直し・取り消しは /jobs のまま）
- pm-5c（ポート、CUPS サーバーのノード、sink、偽プリンタの絵）
acceptance:
  s6-user-view:
    text: サインインした一般の利用者が /topology で全体のノードと辺を見られ、変える口が無く、数と流れは自分が見えるジョブの分だけ。管理者には全部。利用者への /api/topology の答えに scope・owner・url が無い
    verified_by: [scope-tests, login-tests, browser-view]
  s7-live:
    text: ジョブを送ると、数秒のうちに通ったノードのバッジが増え、辺の上を点が流れる。版が同じなら 304
    verified_by: [scope-tests, browser-view]
verification:
  scope-tests:
    state: passed
    method: integration
    test: go test -race ./docflow/
    authority: observed
    evidence:
      path: docflow/scope_test.go
      locator: 'TestScope の末尾：alice の /api/topology は 200 で scope・owner・url が無く 6 ノード、root には scope がある、誰でもない人は 401、/api/layout は利用者も 200。/api/topology/live は alice（wh-a open 2、office 1、alice-desk 1、wh-b 0、team-a recent 1、flows に team-a→wh-a）、bob（wh-b 1、office 1）、root（office 2）で違い、If-None-Match で 304、ジョブを送ると版が変わる。TestTokens の管理者だけの道は /api/deliveries に。2026-10-21 macOS'
  login-tests:
    state: passed
    method: integration
    test: go test ./cmd/docflow/...
    authority: observed
    evidence:
      path: cmd/docflow/handlers/login_test.go
      locator: 'サインインしていない /topology は IdP へ、alice の /topology は 200 で topology-view.js を読み topology.js は無い、alice の /api/nodes は 403'
  browser-view:
    state: passed
    method: manual
    authority: observed
    evidence:
      path: cmd/docflow/public/topology-view.js
      locator: '2026-10-21 pw dev を内蔵ブラウザで Mina Member（warehouse-a）として：/topology に全 5 ノードと辺、group warehouse-a の queue both に管理トークンで送ったジョブが both 1/h・wh-a 1 open 1/h・バッジ 1 として出て、管理者が review に送った保留のジョブは数に出ない。Live の表示が 4 秒ごとに更新。ノードのクリックで数・印刷のフォーム・自分のジョブの一覧'
facts:
  delivery:
    implemented:
      date: '2026-10-21'
      packages:
      - 'docflow/live.go：Live・LiveNode・Flow、Manager.Live（直近 500 件のジョブを CanSee で絞り、足跡から数える。display の open は Slip の状態、Live > 0 のジョブだけ読む。版は分の刻みとジョブ・伝票の状態の digest）、publicTopology（設定と数を落とす）'
      - 'docflow/http.go：GET /api/topology を userOnly に（管理者以外は publicTopology）、GET /api/topology/live（ETag、304）、GET /api/layout を userOnly に'
      - 'cmd/docflow：/topology（TopologyView、public/topology-view.js）、AppBar に Topology、public/canvas.js（エディタと共有：パン・ズーム・ピンチ、ドラッグ、口、下書き、数のバッジ、点の animateMotion）、topology.js はキャンバスを canvas.js に任せて 4 秒ごとに live を読む'
    decisions:
    - '利用者向けの数はトポロジーの数（管理者の全件）でなく /api/topology/live の自分の分。エディタも live があれば live の数を出す（無ければトポロジーの数）'
    - '点は直近 10 分の足跡のうち、ページがまだ走らせていないもの（job:from>to の鍵）だけ、2 分より古いものは走らせない'
    - 'ノードの右上の丸いバッジは held・open・pending・failed の合計（failed があれば赤）'
    - '/api/layout の GET は利用者にも（位置に秘密は無い）'
    unverified:
    - '点が走る瞬間の目視（4 秒の間隔と 1.6 秒の動きのため、スクリーンショットには写らなかった。#flows の circle は DOM に出る）'
    - 'ピンチと携帯の幅、SSE'
    known_gaps:
    - 'ジョブの一覧は /api/my/jobs の 200 件から絞る（ノードごとの索引は無い）'
    - 'recent の数は 1 時間の窓で、版が 1 分ごとに変わる（ポーリングの 200 が 1 分に 1 回はある）'
    - '表示の open は Slip を 1 件ずつ読む（Live > 0 のジョブだけ。規模が大きければ場所の状態の記録から数える方に変える）'
relations:
- relation: implements
  to: requirement:print-manager-console
- relation: follows
  to: milestone:pm-5
- relation: constrained_by
  to: decision:print-manager-ui-daisyui
