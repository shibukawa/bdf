id: requirement:print-manager-export
type: requirement
title: Print Manager のデータ取り出し口 — archive が書いたものを認証で取り出す export のノード、メタデータの持ち主で絞り他人のものは 404、バックエンドは client credentials、フロントエンドは公開クライアントの認可コード + PKCE
summary: >-
  2026-10-22 利用者「print manager にデータ取り出しのエンドポイントという sink を作りたい。認証で archive から取り出す。メタデータでフィルタをして、
  送信したユーザーの ID にマッチしなければ 404 みたいなこともしたい。バックエンドサーバーから client credential でアクセス以外に、oauth でフロントエンドから
  アクセスとかも考えたい」。Claude の形：新しい種類 export（今の sink は画面で最新を見るもので文書を手放すので別にした）。archive に to を足し、書き終えたら
  後ろへ続ける。export は archive の後ろにだけ置け（PUT で道を確かめ、実行時は経路が最後の archive の鍵を運ぶ）、項目を記録して GET /out/<名前> で出す。
  文書は archive から読むのでジョブの記録が消えても残る。持ち主はメタデータの鍵 by の値で、人の email・sub・id・group と比べ、合わなければ 404。
  バックエンドは export の apps に載ったアプリが scope export で全部を読み ?owner= で絞る。フロントエンドは公開クライアント（秘密なし、redirect URI）として
  登録し、Manager の /oauth/authorize（認可コード + PKCE S256、同意の画面なし）で人の 1 時間のトークンを取り、/out と /api/me だけに使う（CORS は登録した origin）。
  叙述は knowledge-inputs/print-plan/print-manager-export.ja.md。
lifecycle: active
authority: authored
aliases:
- export
- データ取り出し
- 取り出し口
- data export
- sink
- /out
- 持ち主
- owner
- public client
- 公開クライアント
- authorization code
- 認可コード
- PKCE
- frontend
- フロントエンド
- BFF
constraints:
- 取り出すのは archive が書いたものだけ。export は archive の後ろ（archive の to）に置き、archive を通らない道は PUT で 400、export に直接送るジョブは 400、途中のノードに直接送られたジョブは export で error の足跡。export は宛先の一覧に出ない
- 文書は archive から読む（ジョブの job-documents ではない）。ジョブの記録が JobKeep で消えても項目と文書は残る
- 読めないものは 404（他人の持ち主、無いジョブ、別の export のジョブ、?owner= で他人）。資格が無ければ 401、読む権限の無い主体（submit トークン、載っていないアプリ、scope の無いアプリ・トークン）は 403
- 持ち主は送り手の名乗り（requirement:document-flow のメタデータの制約のまま）。入口に送れる者が誰の文書かを決める。文書化する
- 人のトークンは役割を持たず、/out と /api/me にだけ効く。要求ごとに人の記録とクライアントを読み直す（無効化・scope の縮小が即座に効く）
- 保存先に取り出して使える秘密を置かない（requirement:print-manager-auth のまま）。公開クライアントは秘密を持たない。code はログインの状態と同じ置き場に 5 分、1 度だけ
- redirect URI は登録したものと完全一致。登録に無いクライアントと redirect URI にはリダイレクトしない
- 文書の取り出しは監査に残す（export-document）。code とトークンの発行と失敗も（oauth-code、user-token、code-refused）
non_goals:
- 一覧の取り出しの監査（文書だけ）
- 同意の画面（社内のフロントエンドの想定。登録が同意）
- refresh token（期限が来たら authorize をもう一度）
- 外の IdP が出したアクセストークンの確かめ（open_questions.frontend-token-source）
- presigned URL での直接の取り出し
