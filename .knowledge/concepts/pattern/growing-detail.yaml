id: pattern:growing-detail
type: pattern
title: 行挿入で伸びる帳票（明細が増えると下が押し下がりページが増える）
summary: テンプレートには明細行が 1 行だけあり、データの件数ぶん行を挿入する。下の合計欄や注記は押し下げられ、 用紙の高さを超えたらページが割れ、見出し行は各ページで繰り返す。Excel なら「行を挿入して印刷」、Word なら「表の行が増える」と同じ挙動。
lifecycle: active
authority: authored
aliases:
- 可変帳票
- 行挿入式
- banded detail
facts:
  sources:
    excel: 開始と終了のタグが同じ行にある → その行を行テンプレートにして挿入。印刷範囲は数式と同じ規則で広がり、下の手動改ページはずれる。印刷タイトルが見出し行の繰り返し。縦 1 ページ固定の「ページに合わせる」だと全体が縮むので、コンパイルの報告で指摘する（requirement:xlsx-print-view）
    word: 表の行を複製して flow を走らせる。行の分割・見出し行の繰り返し・keepNext・PAGE はそのまま効く（component:wordproc-pagination）
    pptx: 表の行は内容で伸びるが、図形は押し合わずスライドの下にはみ出す。あふれたらスライドを複製して続ける（pattern:slide-repeat）
  fill:
    excel_formulas: 変換器は数式を計算せずキャッシュ値を使うので、穴埋め後に合計が空になる。条件付き書式の評価器（四則・SUM・IF・ROUND・文字列・日付）で、値の変わったセルに依存する式だけ再計算。未対応の関数は警告して空。SUM(D10:D12)
      は挿入分だけ広がる
    row_height: 折り返しで行が高くなる場合は、行テンプレートを「高さに対して相対的な罫線と塗り」として持つ
    shared_strings: Excel の文字列セルは sharedStrings で共有されるので、タグのあるセルは inlineStr 相当に切り替える
  aggregates: 明細の直後に合計が来る（流れる位置）。繰越は不要
  typical_forms:
  - 請求明細
  - 発注書
  - 作業報告
  - 一覧表
  implementation: Excel で実装済み。同じ行の {{#items}}…{{/items}}。数式は複製ごとに自分の行を読み、SUM の範囲は全複製に広がる。{{#groups | rows}} で複数行のまとまりも繰り返せる。testdata/form/rows.bdf
relations:
- relation: member_of
  to: taxonomy:form-layout-axes
- relation: depends_on
  to: requirement:xlsx-print-view
- relation: contrasts_with
  to: pattern:fixed-rows-paged-detail
