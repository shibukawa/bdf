id: component:imagebdf-rasterization
type: component
title: imagebdfの現行ラスタライズ経路と負荷
summary: 明示AA Default/On/Off、完成画像LRU64MiB、fill text被覆率LRU32MiB、独立ページ並列を実装。一般被覆率とcanvasは従来のfloat32。
authority: observed
lifecycle: active
scope:
  topic: raster-acceleration
aliases:
- raster/imagebdf
- subSamples
- scratch.rasterize
- PageDPI
facts:
  observation_date: '2026-10-15'
  options: Options.Antialias Default/On/Off。未知値はAAと警告
  coverage:
    y_samples:
      default_on: 16
      'off': 1
    x: AAは部分被覆長、OFFは画素中心の整数スパン
    storage: 描画命令の外接矩形にfloat32配列
  canvas:
    bytes_per_pixel: 16
    format: premultiplied float32 RGBA
    output: image.RGBAへ最終変換
  text: 元glyph輪郭に加えwhole fill-text coverage LRUを保持。stroke textは従来経路
  existing_optimizations:
  - Rendererのキャンバス再利用
  - 走査線間の辺の順序再利用
  - 整数矩形の暗黙全面被覆
  - 範囲外パス除外
  - source-overの一部の専用ループ
  geometry: 曲率上限から分割数を求める等間隔パラメータ分割。分割済み形状の永続キャッシュは別案
  propagation_points:
  - 一般パス
  - 文字とstroke
  - rectMask
  - 画像の外周
  - 幾何clip
  - SVG内の直接rasterize
  thin_strokes: 1pxへ拡幅し元幅をalphaへ反映する経路。境界AAとは別
  resolution:
    page_units: pt (1/72 inch)
    PageDPI: dpi/72をPageへ渡す
    Region: 横縦倍率が独立
    standalone_SVG: CSS px
  concurrency: Renderer自体は並行使用不可。Pagesは独立workerのmutable資源を分離し、immutable maskとlock付きLRUを共有
  historical_measurements:
    source: docs/cpu-security-review.ja.md
    environment: Apple M3、-cpu 1、warm renderer、過去記録
    page_ms:
      pdf: 13.2
      pptx: 6.2
      drawio: 2.22
    not_new_candidate_measurements: true
  new_optimizations:
  - explicit non-AA scan/rectangle
  - completed image LRU with owned returns
  - whole fill-text mask LRU
  - persistent independent-page workers with ordered callbacks
  production_report: knowledge-inputs/raster-acceleration/implementation.ja.md
