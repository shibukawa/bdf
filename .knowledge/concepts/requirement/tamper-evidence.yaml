id: requirement:tamper-evidence
type: requirement
title: BDF と、そこから書き出す PDF の改ざん検知（電子署名とタイムスタンプ）
summary: >-
  .bdf に電子署名を付け、だれが・いつ・どの内容に署名したかを検証できるようにする。PDF の書き出し（vector/pdfbdf）でも PAdES の署名と
  RFC 3161 のタイムスタンプを付け、Adobe Acrobat などふつうの PDF の読み手が検証できるようにする。一部だけ埋めた帳票（requirement:partial-fill）では、
  送る側が自分の値に署名し、残りを埋めた完成品にもう一度署名する連鎖にする。2026-10-22 利用者の要望「bdf やそこから生成される pdf への改ざん防止機能はまた欲しい」。
  設計は Claude の案で、未確定の論点は open_questions。
lifecycle: active
aliases:
- 改ざん防止
- 改ざん検知
- 電子署名
- digital signature
- PAdES
- タイムスタンプ
- bdf sign
- bdf verify
authority: authored
constraints:
- 署名がするのは改ざんの「検知」。書き換えそのものを止める（防止）のは保管の側（Docflow の archive の S3 Object Lock）と暗号化の役目で、ドキュメントでもそう分けて書く
- 署名は全部の Part の SHA-256 を 32 バイトのまま覆う。Part 名（先頭 16 バイト）は衝突への強さが 64 ビットしかなく、テンプレートを作った側が衝突する 2 つの Part を用意できる立場にあるので、Part 名だけを署名しない
- 署名は manifest を書き換えずに付け足せる。署名のない既存の .bdf にも後から署名でき、single ↔ split の組み替えで署名が壊れない
- 署名を知らない読み手（TypeScript のビューア、libbdf、古い Go）は署名付きの文書をそのまま開ける
- 署名の形式は CMS（RFC 5652）の SignedData と X.509 の証明書。BDF と PDF で同じ実装・同じ鍵・同じ証明書を使う
- 決定性は崩さない。署名とタイムスタンプは文書の本体の外にあり、本体のバイト列は署名の前後で同じ
- 鍵の秘密を BDF の処理系がファイルに書かない。署名は crypto.Signer を受けて行い、鍵の置き場（ファイル、PKCS#12、AWS KMS、HSM）は呼び出し側が選ぶ
non_goals:
- 法的な効力の判断（電子署名法の推定効、電子帳簿保存法の要件を満たすかどうか）。満たすための部品（本人の証明書での署名、認定タイムスタンプ）は用意するが、適合を名乗らない
- 認証局の運営、証明書の発行
- 署名した PDF をさらに編集する機能（増分の保存での注釈・フォームの追記）
- 署名の画像（手書きのサイン）と電子署名を同じものとして扱うこと。見た目の欄としてつなげるだけ（facts.pdf.appearance）
open_questions:
  signer-model:
    text: だれの鍵で署名するか。当事者型（署名する本人の証明書。マイナンバーカードの署名用証明書や民間の認証局）と立会人型（Docflow のサーバーの鍵で「この人がこの操作をした」と署名）
    state: answered
    resolution: >-
      2026-10-23 sig-3b で立会人型（Docflow の sign ノード）を実装、当事者型は bdf sign・bdf fill -sign-key で同じ API。暫定案（Claude）：処理系は両方を同じ API で扱う（crypto.Signer と証明書の鎖を受けるだけ）。最初に通すのは立会人型（Docflow の人の操作のノードが、サインインした人の名前と操作を
      署名の属性に入れてサーバーの鍵で署名する）。ウェブで残りを埋める流れに合い、相手に証明書を求めない。当事者型はファイルの鍵で同じコードを通して確かめる
  bdf-placement:
    text: 1 ファイル形式で署名をどこに置くか。(a) Part の領域の後ろに付ける末尾のブロック（"bdfs" の印と長さ。ヘッダーの flags は立てない）、(b) ヘッダーの flags に新しいビット、(c) 別ファイル（foo.bdf.sig）
    state: answered
    resolution: >-
      2026-10-23 sig-1 で実装（milestone:sig-1）。暫定案（Claude）：(a)。分割形式では manifest.json の隣の signatures.json。(b) は今の読み手が未定義のビットを拒否する（spec §3.3）ので、
      署名を知らない読み手で開けなくなる。(c) は 1 ファイルで配れない。Go の OpenSingle は範囲がファイルに収まるかだけを見て末尾の余りを拒否しないことを読んだ（reader.go）。
      TypeScript のビューアと libbdf が末尾の余りを受け入れるかは未確認
  cms-implementation:
    text: CMS をどう持つか。自前（encoding/asn1 と crypto/x509 で、署名に要る SignedData だけ）か、github.com/digitorus/pkcs7 などのライブラリか
    state: answered
    resolution: >-
      2026-10-23 sig-1 で実装（milestone:sig-1）。暫定案（Claude）：自前。必要なのは SignedData の 1 つの形（署名属性の contentType・messageDigest・signingCertificateV2、署名なし属性のタイムスタンプ）と、
      検証での読み取りだけで、読み取りは信頼できない入力になる（ほかの読み手と同じく上限と fuzz を置く）。openssl cms -verify と pyHanko で突き合わせる
  algorithms:
    text: 署名のアルゴリズム
    state: answered
    resolution: 2026-10-23 sig-1 で実装（milestone:sig-1）。暫定案（Claude）：ECDSA P-256 と RSA（PKCS#1 v1.5 と PSS、2048 ビット以上）、ハッシュは SHA-256。Ed25519 は Adobe Acrobat が検証しないので PDF では使わない
  encrypted-documents:
    text: 暗号化した文書（spec §3.5）に署名するとき、署名を外に見せるか（鍵なしで検証できるが、署名した人の証明書が外から読める）、封印するか
    state: open
    resolution: sig-1 は格納の形（外側の manifest と封印した Part）に署名した（鍵なしで署名・検証でき、証明書は外から見える）。次の暫定案はまだ実装していない。暫定案（Claude）：平文の文書に署名し、署名のブロックも封印する（AAD は ASCII の signature）。鍵を持つ人だけが署名した人を知る。区間の文書（§3.6、要求ごとの封印）は後
  timestamp:
    text: タイムスタンプ局（TSA）。試験は FreeTSA などの公開の局、本番は認定タイムスタンプ（電子帳簿保存法で使う、日本データ通信協会の認定）を設定で選ぶ
    state: open
  ltv:
    text: 長期の検証（PAdES B-LT / B-LTA。証明書の失効情報を PDF の DSS に入れ、文書のタイムスタンプを重ねる）をいつ入れるか
    state: deferred
    resolution: 最初は B-B と B-T。証明書の期限（多くは 1〜3 年）を過ぎても検証させたいという要望が出たら B-LT
  viewer-verify:
    text: ビューアで署名の検証結果を見せるか
    state: deferred
    resolution: >-
      いずれ見せる。bdf-preview.wasm は Go なので crypto/x509 で鎖の検証ができ、TypeScript に ASN.1 を持たなくてよい。信頼する根の証明書の一覧をどこから持つかが論点。
      最初は bdf verify とサーバーの検証だけ
