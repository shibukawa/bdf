history:
  pm-4-topology:
    summary: 2026-10-21 利用者「print manager 上で CUPS の仕組みを使って、トポロジー構造を構成できるようにしたい。…外から見える仮想プリンタを 3 つつくり、1 つは監査用書き込み専用ストレージにそのまま入れる。もう 1 つは特定の拠点の実プリンタにラウンドロビンで流す。もう 1 つは 2 つに分岐して、それぞれ仮想プリンタに入れて閲覧できるようにする…流れてきたら勝手に保存し、手動でピックアップしたものを手動で後続に流すフィルターというかインボックスみたいな仕組み」。pm-4 を pm-2 の前に出し、facts.topology の形で実装した（milestone:pm-4）
  pm-4-endpoints-canvas:
    summary: 2026-10-21 利用者「入口のノードとしては API エンドポイントも欲しいです。…bdft ファイルが複数登録でき、データとテンプレート ID を渡すとプリントが行える…UI は全部英語に…SDN の様なソフトウェア定義の帳票ネットワーク…必ずしも紙に限定するわけではなく」「GUI でレイアウトできると良い」。同じ milestone に endpoint・テンプレート・英語の画面・キャンバスを足し、枠組みを帳票ネットワークに広げた（facts.topology の endpoint・framing・canvas）
  pm-1-implemented:
    summary: 2026-10-20 利用者「一旦実装をお願いします」（/goal）。pm-1（現場の表示）を print/manager と cmd/printmanager に実装した（milestone:pm-1）。popcornweb の pw はプロジェクトの直下に go.mod を求めるので popcornweb.toml をリポジトリの直下に置き、pw generate --code-only の生成物をコミットした。端末のセッションは popcornweb の session でなく manager の HMAC のクッキー。S3 互換（rustfs）で記録も文書も置く形を確かめ、DynamoDB と実際の Lambda は未確認
  on-prem-vault:
    summary: 2026-10-20 利用者「オンプレでサーバープロセスを動かしながら、保存用ストレージだけ S3 というユースケースもあり得るかと思います」。配置の 1 つとして足し、資格情報（Roles Anywhere は Provider の注入）、回線の断の間の outbox とディスク、WORM になるまでの遅れの記録、時計、保持の起点を facts.on_prem_vault に書いた
  platform-storage-serverless:
    summary: 2026-10-20 利用者「print manager server の要件を整理して欲しい。ウェブフレームワークには https://github.com/shibukawa/popcornweb これを利用して欲しい。電子帳簿保存用ストレージは S3 だが、普段のスプールのストレージは yuruidb が使えるものは利用できるように。print manager はサーバーレスでも使えると良い」。popcornweb（5af5b03）と yuruidb（004439a）を読み、土台・保存の分け方・サーバーレスの制約を足した。first-worm-store は S3 で答えた。Object Lock の口は yuruidb にも popcornweb にも無い。続けて問いに答えた：置き場所は bdf の cmd/、サーバーレスは Lambda、Object Lock は yuruidb の Blob。printd-relation は「サーバーレスでは A が動かない」を Direct Connect の事例で退け、プリンタごとの route（direct・branch）にした
  order-and-shape-answered:
    summary: 2026-10-20 利用者「偽プリンタをまずきちんと作って、テストを全てそれをベースに行うのを先にしたい」「bdf printd とは別にサービスを作りたい」。順番は print-m6 が先、形は別のサービス。bdf printd との関係（printd-relation）は pm-1 のときに決める
  paperless-answered:
    summary: 2026-10-20 利用者「基本的にはペーパーレスで、伝票を見せる、という用途を考えていた。現場の倉庫ごとの仮想プリンタを作り、タブレットからアクセス。デバイス認証とかで認証してその端末からのみ見せる、といったことを想定していた」。§7 を表示先（display://）とデバイス認証に書き直し、順番を現場の表示が先に並べ替えた
  proposed:
    summary: 2026-10-20 利用者「BDF Print Manager 的な CUPS サーバーとしても振る舞う Web サービスがあっても良いと思った。電子帳簿保存法対応で、印刷されたものをオブジェクトストレージに BDF で保存。vault lock で上書き・削除できないモードでファイルを書き出す。日付やファイル名、その他メタデータや本文の検索もできる、Google Drive 的なビューアを持つ。…実プリンタを何台もぶら下げられる。スプール機能を持ち、クライアントから任意のプリンタに直接送ることもできる。グループになっているプリンタにラウンドロビンで送るのもできる。キャンセルなどもできる。仮想プリンタを複数作ることもできて、特定のユーザーに見せる（ペーパーレス）のも可能」。続けて /knowledge-memory で設計を求めた。既存の bdf printd と並べ、print-manager.ja.md に設計を書いた
