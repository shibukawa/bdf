history:
  accepted:
    summary: 2026-10-20 利用者「偽プリンタをまずきちんと作って、テストを全てそれをベースに行うのを先にしたい」。print-m6 を印刷の次の実装に決め、テストの全部の移行と偽物そのものの確かめ（fake-printers.ja.md §10）を範囲に入れた
  proposed:
    summary: 2026-10-20 利用者「このプロジェクトのテストのために、フェイクプリンタを作ると良さそうな気がしている。ネット上にラベルプリンタなどは見かけたが。他のプロトコルも」。続けて /knowledge-memory で設計を求めた。既存の ipptest・rawtest・pdl のテストの読み手と外の偽物（system:printer-emulators）を調べ、fake-printers.ja.md に設計を書いた
