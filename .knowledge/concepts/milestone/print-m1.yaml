id: milestone:print-m1
type: milestone
title: print-m1 — IPP で手元／LAN の 1 台に .bdf を印刷する（bdf print）
summary: >-
  印刷の最初の実装のまとまり。IPP のクライアントと DNS-SD の探索、PDF の送信（既定。ベクタのまま、pdfbdf）、
  PWG Raster の書き手（PDF を受けないプリンタの後ろ盾。imagebdf の帯から流す）、形式の自動選択、主要なチケット項目を、bdf print と bdf printers として通す。プリンタ直結と、macOS / Linux の CUPS のキューの両方。
  スプールはメモリ上（1 ジョブを送って終わる）。サーバーは print-m2。2026-10-19 利用者が「print-m1 を最初に」と決め、
  ファイル単位の実装案を knowledge-inputs/print-plan/print-m1.ja.md に書いた。要件は print-requirements.ja.md §6。
lifecycle: active
authority: authored
scope:
  milestone: print-m1
  protocol: ipp
  output:
  - pdf
  - pwg-raster
constraints:
- OS のドライバを使わない。cgo なし。wasm / TinyGo のビルドに入れない
- 文書形式は PDF（既定。ベクタのまま）と PWG Raster（PDF を受けないプリンタの後ろ盾）。URF / PCLm は m3
- Raster に落ちるときは imagebdf の PagesRows の帯を行の符号化に直結し、ページ全体の画像を持たない
- チケットの名前は IPP の属性。ジョブの状態は IPP の job-state
- IPP の符号化と DNS-SD は自前（requirement:print の open_questions が決まるまでの仮）
- 同じ文書・同じチケット・同じフォントなら同じ Raster のバイト列
non_goals:
- ディスクのスプール、キュー、再送、履歴、サーバー（m2）
- OS のスプーラ経由（Windows の winspool）、9100、LPD、IPP USB（m3）
- サーバーを IPP プリンタとして見せること（m4）
- ラベル・レシート・連帳（m5）
- OAuth、Get-Notifications（任意。機種差が大きいので後）
capabilities:
  ipp-codec:
    state: implemented
    about: capability:print/ipp-codec
  ipp-client:
    state: implemented
    about: capability:print/ipp-client
  dns-sd-browse:
    state: implemented
    about: capability:print/dns-sd-browse
  pwg-raster-writer:
    state: implemented
    about: capability:print/pwg-raster-writer
  pdf-send:
    state: implemented
    about: capability:print/pdf-send
  format-select:
    state: implemented
    about: capability:print/format-select
  ticket:
    state: implemented
    about: capability:print/ticket
  cli-print:
    state: implemented
    about: capability:print/cli-print
acceptance:
  s1-codec:
    text: RFC 8010 の全ての属性の型（integer、boolean、enum、keyword、name、text、uri、dateTime、resolution、rangeOfInteger、collection、1setOf、out-of-band）を読み書きでき、往復で同じバイト列になり、fuzz で panic しない。unsupported-attributes の応答を解釈する
    verified_by:
    - codec-unit
  s2-attributes:
    text: bdf printers -url ipp://… が Get-Printer-Attributes から用紙（media-ready、media-col-database）、トレイ、両面、色、解像度、文書形式、仕上げ、認証、TLS を表にして見せる。DNS-SD で LAN の _ipp._tcp / _ipps._tcp のプリンタを列挙する
    verified_by:
    - fake-printer
    - manual-devices
  s3-raster:
    text: PDF を受けないプリンタのために、文書のページを printer-resolution の PWG Raster にし、自前の読み手で戻すと imagebdf の PageDPI の画像と一致する。モノクロは sgray_8 と sgray_1、両面の裏面は pwg-raster-document-sheet-back に従って回る。用紙への合わせ方（fit / actual / shrink＋自動回転）が効く。A4 600 dpi を帯の記憶量で流す
    verified_by:
    - raster-golden
  s4-print:
    text: bdf print file.bdf -printer ipp://… が Validate-Job → Create-Job → Send-Document で送り、job-state が completed になるまで待って終わる。既定では application/pdf を受けるプリンタに pdfbdf の PDF をベクタのまま送り、受けないプリンタには自動で PWG Raster に落ち、-format pwg-raster で明示できる。-copies、-collate、-sides、-media、-source、-mono、-resolution、-pages、-skip-roles が効く（PDF では IPP の属性でプリンタに任せ、unsupported なら送信側で肩代わり）。ipps は初回の指紋を記録し、以後の不一致はエラー。converter の入力はその場で変換して印刷する
    verified_by:
    - fake-printer
    - cups-queue
    - manual-devices
  s5-failure:
    text: 接続できない、属性が拒否された（unsupported）、プリンタが stopped、ジョブが aborted、のそれぞれを区別した理由で終わり、終了コードが違う。Ctrl-C で Cancel-Job を送る
    verified_by:
    - fake-printer
verification:
  codec-unit:
    state: passed
    method: unit
    test: 'go test ./print/ipp/（TestRoundTrip、TestBytes、TestCollectionBytes、TestLimits、TestMalformed、TestEncodeErrors、FuzzDecode）'
    authority: observed
    evidence:
      path: print/ipp/message_test.go
      locator: '全ての値の型の往復、RFC 8010 の手組みのバイト列、限界、壊れた入力。FuzzDecode 53 万回で失敗なし'
  raster-golden:
    state: passed
    method: unit
    test: "go test ./print/raster/ ./raster/imagebdf/ -run 'Place|RoundTrip|Documents|Fit|Back'"
    authority: observed
    evidence:
      path: print/raster/raster_test.go
      locator: 'black_1 / sgray_1 / sgray_8 / srgb_8 の往復が描いた画素と一致、testdata の 4 文書を 100 dpi で書いて同じ倍率の Region と一致し 2 回書いて同じバイト列。PlaceRows は PageRows と同じ画素、四分の一回転と鏡映は回した画像と端で 7 階調以内。FuzzRead で失敗なし'
  fake-printer:
    state: passed
    method: integration
    test: "go test ./print/ ./print/ipp/ ./cmd/bdf/ -run 'Print|Printer|Client|Unsupported|Auth|Trust'"
    authority: observed
    evidence:
      path: print/print_test.go
      locator: 'ipptest に対して PDF、PWG Raster、PDF を拒まれたときの切り替え、部数を作れないプリンタ、受けない属性と -strict、停止・中止・取り消し・待ち時間切れ、両面の裏面（flipped）、レイヤーの省略、bdf print の終了コード 0/2/3/4/5、TOFU（自己署名の証明書 2 枚）'
  cups-queue:
    state: passed
    method: integration
    test: '手元で cupsd 2.4.7 の raw のキューと IPP Everywhere のキュー（-m everywhere）に bdf print'
    authority: observed
    evidence:
      path: test/print/ci.sh
      locator: '2026-10-19 Ubuntu 24.04 の作業環境で、CUPS が Validate-Job・Create-Job・Send-Document を successful-ok で受け、PDF と PWG Raster（150 dpi の A4 3 ページ）をスプールに置き、IPP Everywhere のキューから偽のプリンタまで PDF が届いた。ippeveprinter はこの環境に IPv6 がなく起動しないので、CI（ubuntu-latest）の print ジョブで確かめる'
  manual-devices:
    state: not_run
    method: manual
    test: 国内で多い機種で PDF（ベクタ）と PWG Raster、両面、JIS B5、はがき、トレイを確かめ、PDF の絵が違う機種の癖を .knowledge に記録
open_questions:
  pdf-direct-default:
    text: PDF 対応のプリンタで auto が Raster を選ぶ既定でよいか（requirement:print の default-format）
    state: answered
    resolution: PDF（ベクタ）優先に決定。2026-10-19 利用者。Raster は PDF を受けないプリンタの後ろ盾
  sheet-back-transforms:
    text: pwg-raster-document-sheet-back の flipped / rotated / manual-tumble で裏面に掛ける変換と、ヘッダーの CrossFeedTransform / FeedTransform の値。CUPS の rastertopwg に合わせ、実機で確かめる
    state: open
  chunked-send:
    text: HTTP の chunked 送信を受け付けない IPP 実装があるか。あれば Content-Length のために一時ファイルへ描いてから送る経路を足す
    state: open
facts:
  delivery:
    plan: knowledge-inputs/print-plan/print-m1.ja.md（2026-10-19）
    implemented:
      date: '2026-10-19'
      commits: [575d3e3 S1 符号化, 618e66e S2 クライアントと探索, b7392ab S3 配置と PWG Raster, 6809903 S4 print と bdf print]
      changed_from_plan:
      - 'imagebdf は RegionRows と Options.Rotate ではなく、Place（用紙の画素数、倍率、四分の一回転、位置、鏡映）と PlaceRows にした。両面の裏面の鏡映が要ったため。PageRows と帯の描き方を共有する'
      - 'page-ranges を送らず、PDF のページの選択（pdfbdf.Options.Pages）だけにした。プリンタごとの page-ranges の扱いの差を避ける'
      - 待ち時間切れに終了コード 6 を足した
      - sheet View は印刷ビューが無ければ「シートにはページが無い。Excel は -param views=print」のエラー（m1 の決めどおり）。bdf print は Excel の入力を views=print で変換する
    slices:
    - 'S1 IPP の符号化（print/ipp: message.go、tags.go、attrs.go、testdata、FuzzDecode）。何にも依らない'
    - 'S2 クライアント、Printer（能力）、DNS-SD（QU ビットで一時ポートに単一応答）、ipptest（偽のプリンタ）。bdf printers'
    - 'S3 imagebdf.RegionRows と Options.Rotate、print/raster の書き手と読み手、用紙への配置（fit / actual / shrink、自動回転、裏面の向き）。S1 と並行可'
    - 'S4 Ticket、media（PWG 5101.1）、select（明示 > PDF > PWG Raster）、doc、print.go、pdfbdf.Options.Pages、bdf print。合流点'
    - 'S5 失敗の扱いと終了コード、TLS の指紋（TOFU）、Ctrl-C の Cancel-Job、converter の入力、CI の print ジョブ（ippeveprinter と CUPS）、docs'
    provisional_choices:
      ipp_codec: 自前（print/ipp/message.go）。goipp は実機の応答を JSON にする参照に使うだけで依存にしない。替えるなら message.go だけ
      dnssd: '自前の最小実装。224.0.0.251:5353 に QU ビットの PTR を一時ポートから送り、5353 を束縛しない（Avahi / Bonjour と衝突しない）。単一 DNS の DNS-SD は m2 以降'
      package: print/。改名は import パスの置換だけ
      imagebdf_additions: RegionRows（Region の帯版。PageRows はその特殊形）と Options.Rotate（0 / 90 / 180 / 270）。描画の行列に前置するだけ
      pdfbdf_addition: Options.Pages（page-ranges を受けないプリンタのため）
      trust_store: $XDG_CONFIG_HOME/bdf/printers.json（os.UserConfigDir）。葉の証明書の SHA-256 を printer-uuid か host で
      exit_codes: 0 completed、1 canceled / aborted / Ctrl-C、2 usage、3 接続と証明書、4 unsupported（-strict）と client-error、5 printer stopped
      limits: IPP の応答 4 MiB / 属性 10,000 / 値 64 KiB / 深さ 8。DNS-SD 1,000 件。-max-impressions 10,000。-wait 10 分
      sheet_views: m1 は sheet View に印刷ビューが無ければエラー（PDF 書き出しと同じ扱いは m2）
    cli_sketch:
      printers: bdf printers（DNS-SD）、bdf printers -url ipp://host/ipp/print（能力）、bdf printers -cups（localhost:631 のキュー）
      print: bdf print -printer ipp://host/ipp/print -sides two-sided-long-edge -media jis_b5_182x257mm -copies 3 -mono invoice.bdf
      format: 既定は PDF（ベクタ）。bdf print -format pwg-raster -resolution 300 … で Raster に
      cups: bdf print -printer ipp://localhost:631/printers/office …
relations:
- relation: part_of
  to: requirement:print
- relation: depends_on
  to: requirement:pdf-export
- relation: informed_by
  to: system:ipp-driverless
