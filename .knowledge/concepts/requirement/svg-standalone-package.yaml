id: requirement:svg-standalone-package
type: requirement
title: SVG パーサの単独パッケージ化
summary: 'raster/imagebdf の中にある SVG パーサを、ラスタライザなしで使える公開パッケージ（候補: image/svg）に切り出す。 読める範囲・寛容さ・上限は今のまま、出力型をラスタライザから切り離し、imagebdf
  はその上に乗る。 標準ライブラリの image との互換（image.Image / RegisterFormat）は不要。'
lifecycle: active
aliases:
- image/svg
- svg parser standalone
authority: authored
constraints:
- 読める SVG の範囲（要素・CSS・色・長さ・transform・パスデータ）は現状と同じか広い。狭めない
- 寛容さを保つ。エラーまでに読めた分を返し、svg ルートがない時だけ失敗にする
- 深さ 256・要素数 1M・CSS 照合 4M の上限と、超過時の「打ち切って警告」を保つ。既定値は現状の定数と同じ
- XML は internal/xmltree.Open 経由で読む（リポジトリの XML 読み取り方針。encoding/xml は使わない）
- ルートモジュールに新しい外部依存を足さない（xmlro・htmlentity・x/net/html/charset は既存）
- 切り出し後も raster/imagebdf の描画結果はピクセル単位で変わらない（golden テストが基準）
- 新パッケージはラスタライザ（raster/imagebdf）を import しない。依存は一方向
non_goals:
- image.Image の実装、image.RegisterFormat / image.Decode への登録（利用者が明示的に不要と判断）
- ラスタライズ。描画は raster/imagebdf とビューア（ブラウザ）のまま
- CSS の属性セレクタ・擬似クラス・@media などの対応拡張（現状どおり未対応のまま）
- mask・pattern・marker・filter・foreignObject の意味づけ（木には残るが解釈はしない）
- ビューア（TypeScript 側）の SVG 処理の変更
