history:
  proposed:
    summary: 2026-10-19 利用者がチャットで提案（「ラスタライズなども含めてかなりの機能が揃ってきた。プリンタに繋いで印刷。スプール管理も含めてシステム化。最終段の接続は新しいプロトコルから。Windows / mac / Linux。ローカルプリンタと、複数台のリモートプリンタを制御するプリントサーバー」）。同日に Web 調査と要件の整理
