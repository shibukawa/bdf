id: requirement:docflow-framework
type: requirement
title: Docflow をフレームワークにする — static import で独自の種類・設定・カタログ（pulldown）・プリセットのトポロジー・独自の画面を足した 1 つのバイナリを組む
summary: >-
  2026-10-26 利用者「docflow はひととおりできた。docflow をベースに、static import でちょっとアレンジして独自ノードを追加するなどして、
  アレンジできるようなフレームワーク化をしたい。また、popcornweb ベースなので、構造体を登録するだけで設定は自由に足せるはず。
  S3 の接続先のような設定も、そこで定義した設定をプルダウンで選べたりする、トポロジーもプリセットのを組み込んでスタンドアロンアプリと
  できる、独自管理画面やユーザー向け画面を足せる、みたいなことが実現できると良いと思う」。Go のモジュールが bdf を import し、init の
  登録と main の数行で 1 つのバイナリを pw build で作る形。叙述は knowledge-inputs/print-plan/docflow-framework.ja.md。
  拡張点は 5 つ：種類（Node.Settings と Kind.Fields、API から作るパレットとフォーム）、設定（pw.RegisterConfig のまま）、カタログ
  （設定からの pulldown：connections・credentials）、プリセット（seed・managed・locked と YAML の出し入れ）、画面（Shell/AppBar の
  export、Page/API、ナビとロールの登録、自前の資産の配信）。設計は Claude の暫定（open_questions）。
lifecycle: active
authority: authored
aliases:
- Docflow framework
- docflow フレームワーク
- フレームワーク化
- static import
- 独自ノード
- custom node kind
- custom kind
- Node.Settings
- Kind.Fields
- カタログ
- catalog
- connections
- 接続先
- pulldown
- プルダウン
- プリセット
- preset topology
- standalone app
- スタンドアロン
- 独自管理画面
- custom pages
- docflow/web
- RegisterNav
- RegisterRole
- RegisterCatalog
- flowtest
constraints:
- 組み立ては Go の static import と init の登録だけ。動的なプラグイン・Wasm・別プロセスの種類は作らない（別プロセスの変換は requirement:document-flow の外部サービスのまま）
- 芯（docflow、docflow/io/...、docflow/render）は popcornweb を import しない（2026-10-26 に go list -deps で 0 を確かめた）。popcornweb に触るのは docflow/web とアプリの側
- 独自の種類の設定は Node.Settings（その種類だけのオブジェクト）。芯の種類と今のアダプタの平らな欄は当面そのまま（df-1 の利用者の答えを覆さない。移すかは open_questions.adapters-to-settings）
- 独自の種類の次のノードは芯の欄 to・on_error で指す。独自の口（branch の case のような）は fw-4 まで無い
- エディタは GET /api/kinds だけで種類を知る（パレット・アイコン・役割の表・フォームの欄）。pages.pw.html と canvas.js の固定の表はやめる
- PutNode は Settings を Kind.Fields に照らして形（型・必須・カタログの値）を確かめ、それから Check。確かめの本元はサーバー（requirement:docflow-node-editing と同じ）
- アプリの [i18n] は docflow/web と同じ locales・default_locale（en, ja / en）と cookie_routes ["/"] を宣言する（pwruntime.RegisterLocales は違う集合で panic。2026-10-26 に確かめた）
- docflow/web の画面は WriteHTMLChain(w, r, nil, leaf) で描き、プロジェクトの document.pw.html で包まれない（アプリは自分の document を持ってよい）
- docflow/web の JS・CSS は pw の /public でなく自前の prefix（暫定 /_docflow/）で配る。middlewares.RegisterPublicManifest は 1 つの表だけ（2 度目は置き換え。2026-10-26 に確かめた）
- カタログは名前を返す。資格の値は出さない（credentials カタログは DOCFLOW_CRED_* とファイルの名前だけ）。接続の保存は名前で、送る時に解決する
- プリセット・書き出しの YAML に鍵と資格の値は含めない（requirement:docflow の yaml-secrets の暫定のまま）
- managed のノードは画面も API も読み取り専用（PUT・DELETE・rename は 409）。locked は全部
non_goals:
- 動的なプラグイン（Go の plugin、Wasm、別プロセスの種類）
- 画面で接続と秘密を足して保存先に封をして置くこと（requirement:document-flow の credentials-store の問いのまま）
- 古い API・保存の形との互換（接続の欄・settings は足すだけで、今のノードはそのまま動く）
- 独自の口（複数の出力ポート）、独自のコレクション、定期の仕事、at-node の節：fw-4 に回す
- 外部のマイクロサービスの変換（requirement:document-flow の fl-3）
