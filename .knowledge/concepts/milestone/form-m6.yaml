acceptance:
  s1-parse:
    text: 前書き（cpi、lpi、columns、lines、margin、skip、title、font）と本文を読み、タグの位置（行、桁）を持つ。前書きなしの本文だけでも既定（10 cpi、6 lpi、80 桁、66 行）で通る。タグだけの行は行を占めない
    verified_by:
    - text-unit
  s2-width:
    text: width / right / center が東アジア幅（全角 2 桁）で揃う。超えたら既定は切らずに警告、| cut で切る、| wrap で次の行に続く（rows なら行が増え、固定ページなら押し下げ、用紙長を超えたらエラー）。幅のないタグは値の長さで伸び縮みし、桁数の超過はコンパイル時に警告
    verified_by:
    - text-unit
  s3-sections:
    text: 同じ行の区間は文字の繰り返し、別の行は枠（余った行は空行、_blank が効く）、| rows は行を増やして用紙長で改ページし title を繰り返す、| pages はページ単位の複製で _page / _pages が効く
    verified_by:
    - text-golden
  s4-bdf:
    text: fixed View のページが columns / cpi × lines / lpi インチになり、文字がセルに正確に揃う（どの等幅フォントでも）。lines 0 は高さ可変の 1 ページ。{{#preprinted}} の行は background の層。MARK が行と枠に付く。golden で描画を固定
    verified_by:
    - text-golden
  s5-text-part:
    text: t:text の Part に幾何とページごとの行と用紙の層が JSON で入り、プレーンテキストに戻すと本文（穴埋め後）と一致する。bdf fill … out.txt が同じものを書く。Go と TS の読み手がこの Part を無視して開ける
    verified_by:
    - text-golden
    - reader-tolerance
  s7-double-size:
    text: '{{#_wide}} / {{#_tall}} / {{#_big}} の中の文字が半角 2 桁・全角 4 桁で数えられ、BDF では 2 倍に伸びて描かれ、_tall と _big の行は 2 行を占め、t:text の Part に範囲が残る'
    verified_by:
    - text-golden
  s6-bdft:
    text: bdf template compile が format "text" の .bdft を書き、bdf fill が .bdft と .txt のどちらからでも同じ .bdf を出し、bdf template schema がフィールドを出す
    verified_by:
    - bdft-roundtrip
verification:
  text-unit:
    state: passed
    method: unit
    test: "go test ./converter/textform/ ./form/textpart/ ./form/tag/（前書き、判別、東アジア幅、幅の filter、区間、ページ、倍角と用紙の層、run と MARK、Plain、FuzzFill、FuzzParse）"
    authority: observed
    evidence:
      path: converter/textform/textform_test.go
      locator: 'TestFrontMatter、TestIsTemplate、TestValues、TestMissing、TestSections、TestPages、TestAttributes、TestLayout、TestFontFile、TestShow、TestPlain、TestLimits、FuzzFill（2026-10-20 に 5 分、124 万回）。form/textpart の TestWidth・TestCells・TestText・TestEncodeDecode・TestRead、form/tag の TestParseText'
  text-golden:
    state: passed
    method: integration
    test: 'go test ./converter/textform/ -run TestForms（4 つの帳票の印字像を testdata/want/*.txt と比較）、CI の testdata の比較（testdata/form/text-{slip,rows,pages,receipt}.bdf、text-slip.bdft、Shift_JIS の text-slip.txt）'
    authority: observed
    evidence:
      path: converter/textform/testdata/want
      locator: 'slip（固定のページ、用紙の層、倍角、cut と wrap）、rows（3 ページ、title）、pages（枠と | pages、倍幅・倍高）、receipt（ロール紙）。画素の golden は #99 で無くなったので bdf render の絵を目で確かめた（罫線がつながること）'
  reader-tolerance:
    state: passed
    method: integration
    test: 'node --test packages/core/test/core.test.mjs（form of text opens with its print image aside）、go test ./conformance/（part/unreferenced-types と testdata/form/text-*）、form/textpart の TestRead'
    authority: observed
    evidence:
      path: conformance/inputs.go
      locator: part/unreferenced-types（t text と x-future の Part を持つ文書が開き、どちらも読める）
  bdft-roundtrip:
    state: passed
    method: integration
    test: go test ./form/ -run TestFillText
    authority: observed
    evidence:
      path: form/form_test.go
      locator: 'TestFillText（判別、フィールド、スキーマ、サンプルで穴埋めした .bdft が同じバイトの帳票を作る、サンプルなしの .bdft はタグのままのページ、1 KiB より後のタグ）'
open_questions:
  text-part-shape:
    text: t:text の JSON の形（幾何、pages[].lines[]、preprinted の行の印、倍角の範囲）。Part に決まった（2026-10-19）ので実装案で決める
    state: answered
    resolution: '版 1。{version, cpi, lpi, columns, lines, margin{left,top}, skip, ambiguousWide, font, pages[].lines[]{text, paper[]{col,cols}, size[]{col,cols,size}}}。lines[i] は上の余白の下の i 行目で、倍高の行の次は空の行。col は印字の桁（倍幅を含む）。型と読み手は form/textpart（form も変換器も import しない）。2026-10-20 Claude が決めた（暫定）。叙述は form-m6.ja.md §2'
  ambiguous-width:
    text: 罫線素片など東アジアの幅が「あいまい」な文字を何桁と数えるか
    state: answered
    resolution: '既定は 1 桁（叙述の例はそうでないと揃わず、多くのエディタもそう見せる）。前書きの ambiguous: wide で 2 桁（ESC/P-J の漢字モードは罫線素片を全角で印字する）。Part の ambiguousWide に残す。2026-10-20 Claude が決めた（暫定。利用者に確認していない）'
  escp-box-drawing:
    text: 1 桁の罫線素片を ESC/P-J・ESC/POS の漢字モードでどう印字するか（PC437 などの 1 バイトの罫線か、全角にして ambiguous wide を勧める警告か）。print-m5 で決める
    state: answered
    resolution: 'ESC/P は半角の漢字（FS ! のビット 1。FS SI と同じ）で 1 桁に。ESC/POS は罫線素片をコードページ 437、× などを 850 の 1 バイトで、どちらにも無い文字は ? にして ambiguous: wide を勧める警告。2026-10-20 Claude が決めた（暫定。milestone:print-m5 の text_mode）'
facts:
  delivery:
    plan: knowledge-inputs/print-plan/form-m6.ja.md（2026-10-20）
    implemented:
      date: '2026-10-20'
      slices:
      - 'S1 converter/textform の frontmatter.go・parse.go、form/tag の ParseText'
      - 'S2・S3 converter/textform の fill.go（幅、cut・wrap、区間、ページ分け、印字像）'
      - 'S4 converter/textform の layout.go（等幅フォント、run の advance、MARK、background の層）、テストのフォント（BIZ UDゴシックのサブセット）'
      - 'S5 form/textpart、bdf.PartText、Plain、spec §4、conformance の事例'
      - 'S6 form.go の FormatText、cmd/bdf fill の out.txt、docs（forms、cli、api、design §3.34）、CI のテストデータ、packages/core のテスト'
      changed_from_plan:
      - '埋め手のパッケージは form/text ではなく converter/textform（converter/internal の fontset と canvas を使うため。pdfme・pdfform と同じ並び）。Part の型と読み手は form/textpart'
      - '前書きは go.yaml.in/yaml/v3 でなく自前の小さな読み手（キーと値、margin の流れ形式とブロック、コメント）。YAML の依存は TinyGo のビルドから外しているため'
      - '前書きに ambiguous（narrow / wide）を足した。あいまいな幅の文字の桁数。既定 narrow'
      - '-param に newline（crlf）と paper（preprinted）を足した'
      - '画素の golden（TestGoldenPages）は #99 で無くなっていたので、印字像のテキストの比較（testdata/want）と CI の testdata の比較にした'
      - 'run は「フォントでの幅 ÷ 桁数」が等しい文字でまとめる（半角・全角で分けるだけでは、全角の幅を持つ罫線素片が 1 桁のとき run の中で縦線がずれた）'
      - 'MARK の CELL は 1 列（列の区切りはテンプレートから決まらない）'
    slices:
    - 'S1 前書きと本文の読み込み、タグの位置（form/text: parse.go）'
    - 'S2 幅と揃えの filter（form/text: width.go。東アジア幅）'
    - 'S3 区間の展開: slots / rows / pages、title の繰り返し、FF（form/text: fill.go）'
    - 'S4 BDF の fixed ページ（form/text: layout.go。等幅フォント、advance、MARK、background の層）'
    - 'S5 t:text の Part とプレーンテキストの出力（form/text: image.go）、spec §4 の追記'
    - 'S6 form.go の判別と分岐、.bdft、schema、docs/forms.ja.md'
