id: milestone:print-m4
type: milestone
title: print-m4 — サーバーを IPP プリンタとして見せる（IPP Everywhere・AirPrint、DNS-SD の広告、拠点の代理）
summary: >-
  印刷の 4 つ目の実装のまとまり。bdf printd のキューを、Windows（IPP クラスドライバ）・macOS と iOS（AirPrint）・Android（Mopria）・
  ChromeOS と Linux（CUPS）がドライバなしで追加できる IPP Everywhere のプリンタにする。受けた PDF・ラスタ・画像はスプールの .bdf に
  なって今までどおり刷られる。mDNS の応答者で LAN に広告し、別のサブネットには広域 DNS-SD のレコードと AirPrint の構成プロファイルを
  書き出す。NAT の向こうの拠点は自分の bdf printd で本社のキューのジョブを IPP INFRA で取りに行く。
  叙述の実装案は knowledge-inputs/print-plan/print-m4.ja.md（2026-10-20）。
lifecycle: active
authority: authored
scope:
  milestone: print-m4
constraints:
- キューごとに /ipp/print/<キュー> の IPP Everywhere のプリンタ。操作は PWG 5100.14 の必須（Print-Job、Validate-Job、Create-Job、Send-Document、Close-Job、Cancel-Job、Cancel-My-Jobs、Get-Job-Attributes、Get-Jobs、Get-Printer-Attributes、Identify-Printer）と Hold-Job・Release-Job
- ジョブの id・uuid・状態はスプールのもの。Create-Job は Spool.ReserveID で id を先に取り、文書が来るまでメモリに持つ（300 秒）。1 ジョブ 1 文書
- 受ける形式は PDF を先頭に（送る側がベクタを選ぶ）、URF、PWG Raster、JPEG、PNG、.bdf、octet-stream（中身で見分け、変換器の形式も）。ラスタは 1 ページを帯ずつ読んで絵のページの .bdf にする
- ipp と ipps は 1 つのポート（最初のバイトで TLS を見分ける）。証明書は設定のものか、自己署名を 1 回作って作り直さない
- auth は none（requesting-user-name）か basic（トークン）。basic と require-tls は別の機械からの ipp を HTTP 426 で断り、_ipps._tcp だけを広告する
- mDNS の応答者は自前（x/net の ipv4・ipv6・dnsmessage）で、5353 を OS の応答者と共有する。告げるホスト名は自分のもの（<機械>-bdf.local）。OS の名前の A / AAAA を告げると OS が衝突とみなして機械の名前を変える
- AirPrint の条件（URF の TXT、image/urf、_universal のサブタイプ、ipps、MDM 向けの固定の rp）を満たす
- 拠点の代理は IPP INFRA（PWG 5100.18）の部分集合。ジョブは受けた代理に結びつけて他に渡さない。拠点は上流のジョブの uuid を Job.Origin に持ち、取り直さない
- 代理の操作は proxy の役割のトークンの Basic 認証だけ（ipp.auth によらない）
- 足す依存は無い
non_goals:
- IPP の通知（Create-*-Subscriptions、Get-Notifications）。IPP Everywhere でも任意。代理はポーリングで足りる
- 複数文書のジョブ、Print-URI・Send-URI（サーバーが外を取りに行く穴になる）
- 受けた PDF の素通し（変換せずに PDF のプリンタへ。スプールが .bdf でない文書を送れるようにする変更が要る）
- IPP System Service（PWG 5100.22）、OAuth、WSD
- Windows・iOS・Android・ChromeOS の実機での確認（利用者が行う。手順は docs/print-server）
