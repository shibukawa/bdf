history:
  proposed:
    summary: >-
      2026-10-21 利用者の構想（facts.request）を /knowledge-memory で整理した。main（#126 まで）の print/manager（model.go・nodes.go・submit.go・
      route.go・deliver.go）を読んで現状（facts.current_state）を書き、種類の置き場・ペイロードの列・メタデータ・ノードの足し算・入出力・拡張の案
      （facts.design）と、利用者の一覧に無い発展（facts.expansions）、考慮すべきこと（facts.considerations）、段の切り方（facts.delivery）を立てた。
      暫定の選択と推奨は Claude のもので未確認。問いは open_questions
  answered-1:
    summary: >-
      2026-10-21 利用者が答えた（facts.answers_2026_10_21）：メタデータは受けたものも決まるものも全部、at-least-once でよい、本命は ECS・Cloud Run、
      通知ノード（失敗も）、描画ノードは入れるが .bdf のままの出力も残す、人の入力とスタンプ・署名の人の操作、テンプレートはテンプレート変換ノードへ
      （エンドポイントは暗黙の変換なし）、変換は登録した外部のマイクロサービス、S3 は入口が Trigger で出口は書きっぱなし。template-owner・extension-mode・
      render-node・builtin-scope・s3-trigger-shape を answered に、template-migration・service-auth・notify-shape・signature-meaning を新しく立て、
      通知・人の操作・人の入力・外部サービスを capabilities と facts.design.nodes に足し、段の案を 4 つに組み直した
  answered-2:
    summary: 2026-10-22 利用者「テンプレートは移行せず、管理者がテンプレート変換ノードに上げ直すでよい（互換なし）」。template-migration を answered に。fl-1 の前の問いは無くなった
  fl-1-implemented:
    summary: >-
      2026-10-22 利用者「fl-1 の実装を始めてください。暫定の既定はそのままで」。milestone:fl-1 に実装した：kinds.go・meta.go・transform.go、
      ジョブのペイロードの列とメタデータ、入口の accept と output、テンプレート変換とコンバートのノード、filter の meta と kind、
      キャンバスの色。暫定の選択（kinds_on_ports・payload_versions・async_steps・rules_re2・meta_keys）はそのまま実装に入った。
      分かったこと：CSV・Parquet の表の文書にはページが無く印刷できない（変換器の側）。lifecycle を active に
