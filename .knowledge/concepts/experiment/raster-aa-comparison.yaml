open_questions:
  mask-or-spans:
    text: 既存二値mask経由を先に作るか、span直接合成まで含めるか
    state: answered
    resolution: 初期実装は既存maskを0/1で生成する方式。直接スパン合成は今後の別実装
  quality:
    text: 非AAを許容できる内容・解像度はどの範囲か
    state: open
    resolution: 実寸画像と印刷の比較が必要。一般的な100dpi境界は仮定しない
relations:
- relation: verifies
  to: requirement:raster-quality-control
- relation: evaluates
  to: technique:binary-scanline-rasterization
