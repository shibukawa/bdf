id: system:pdf-forms-xfa
type: system
title: PDF AcroForm と XFA — 名前付きフィールド、positioned と flowed のサブフォーム、break と leader / trailer
summary: >-
  AcroForm はページ上の固定位置のフィールド（名前は T を . でつないだ完全修飾名）。XFA はサブフォームに position（固定）と
  tb / lr-tb / row / table（流し込み）のレイアウトがあり、マスターページの content area をデータが流れ、min / max count で繰り返し、
  breakBefore / breakAfter と leader / trailer であふれを制御する。固定と流し込みを 1 つの形式で持つ設計の前例。
lifecycle: active
authority: observed
aliases:
- AcroForm
- XFA
- LiveCycle Designer
- AEM Forms
facts:
  acroform: フィールド辞書のキー FT / Parent / Kids / T / TU / TM / Ff / V / DV / AA。FT は Btn / Tx / Ch / Sig。完全修飾名は Parent の連鎖の T を . で結ぶ（ISO 32000-1 Table 220）
  xfa_layout: サブフォームの layout は position（既定、x / y オフセット）、tb、lr-tb、rl-tb（予約）、row、table
  xfa_flow: マスターページが content area を定義し、データはページをまたいで content area を流れる。サブフォームの min / max count が繰り返しを決め、入れ子にして XML のタグ名と対応させる
  xfa_breaks: breakBefore / breakAfter に startNew、trailer、targetType（auto）、target、leader。overflowLeader / Trailer は XFA 2.8 で leader / trailer に置き換え。条件付き改ページ（次の偶数ページ、前のサブフォームの後、入らないときだけ）。表は flowed な親が要る
  relevance: 「固定の箱」「流し込み領域」「繰り返しの min / max」「見出し行（leader）と繰越行（trailer）」は、帳票テンプレートの語彙としてそのまま使える。繰越（trailer）と前頁より繰越（leader）に名前があるのは XFA だけ
relations:
- relation: exemplifies
  to: pattern:fixed-page-form
- relation: exemplifies
  to: pattern:growing-detail
- relation: exemplifies
  to: pattern:fixed-rows-paged-detail
