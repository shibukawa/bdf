id: system:report-engines-banded
type: system
title: 帯（band）モデルの帳票エンジン — JasperReports / Crystal Reports / ActiveReports Section / Stimulsoft / FastReport / Telerik / DevExpress / Pentaho
summary: >-
  海外の帳票エンジンの主流は「帯」モデル。タイトル・ページヘッダー・列ヘッダー・グループヘッダー・明細・グループフッター・列フッター・ページフッター・サマリー・背景の帯を縦に積み、
  帯の中は絶対座標で部品を置く。明細帯がデータ件数ぶん繰り返され、あふれは「伸びる / 伸びない、まとめる、新しいページで見出しを繰り返す、下端に置く」の属性で制御する。
  SVF の海外対応物の 1 つの系統で、もう 1 つは CCM（system:ccm-suites）。
lifecycle: active
authority: observed
aliases:
- banded report
- JasperReports
- JRXML
- Crystal Reports
- Stimulsoft
- FastReport
- Telerik Reporting
- DevExpress Reporting
- Pentaho Reporting
facts:
  formats:
    jasperreports: XML の .jrxml を .jasper にコンパイル。Jaspersoft Studio
    crystal: 独自バイナリ（OLE2）の .rpt。デザイナ専用
    activereports_section: XML の .rpx、イベント駆動のコード
    stimulsoft: .mrt（XML でも JSON でも）、.mrz 圧縮、.mrx 暗号化
    fastreport: XML の .frx（デザイナに生 XML タブ）
    telerik: .trdx（XML）、.trdp（ZIP＋資源、ローカライズ）、.trbp（Report Book）
    devexpress: .repx（XML）、.prnx（描画済みスナップショット）
    pentaho: .prpt（ODF 風の ZIP バンドル）
  band_set:
    universal: [report title / summary, page header / footer, group header / footer, detail, column header / footer]
    extras: background / overlay / watermark（Jasper、Stimulsoft、FastReport、Pentaho、Crystal の underlay）、lastPageFooter（Jasper）、noData（Jasper）、EmptyData（Stimulsoft）、child / sub band、margin band（DevExpress、Pentaho）
  overflow_vocabulary: [CanGrow / CanShrink, KeepTogether（帯・グループ・見出しと最初の明細）, RepeatOnNewPage / PrintOnAllPages / RepeatStyle, PrintAtBottom / StackAtBottom, StartNewPage / NewColumn, isPrintWhenDetailOverflows, PrintOn First / Last / Odd / Even]
  columns: 新聞型の多段（Jasper の columnCount と printOrder、Crystal の Multiple Columns、Stimulsoft の AcrossThenDown / DownThenAcross、DevExpress の MultiColumn）
  totals:
    page_count: 総ページ数は 2 パスか遅延評価が要る（Crystal は全描画、FastReport と Stimulsoft は DoublePass、Jasper は evaluationTime=Report）
    running: ActiveReports の SummaryType（GrandTotal / PageTotal / PageCount）と SummaryRunning（Group / All）。「繰越」という名前の機能は見つからず（UNVERIFIED）
  filler_rows: 空行で埋める機能を持つのは Stimulsoft の EmptyData、ActiveReports Page の RepeatBlankRows、List & Label の fixed size table だけ
  data: データセット、フィールド、パラメータ、変数（resetType Report / Page / Column / Group、Sum / Count / Average …）、式は Java / Groovy / JavaScript / C# 系。グループ化・ソート・集計はエンジンが行う
  outputs: PDF、Excel、Word、HTML、画像、CSV がほぼ共通。生のプリンタ言語は稀（FastReport の ZPL と VCL のドットマトリクス ESC、Stimulsoft のテキスト出力のエスケープコード、Oracle Reports の PCL / PostScript / ASCII）
  renderer_dependence: ページ分割は出力先のレンダラに依存する（SSRS の soft / hard page break、Telerik、BIRT の emitter 差）
  terminology: banded（帯の設計面に自由配置）vs page based（自由なページに表オブジェクト）。Crystal のウィザード Standard / Cross-Tab / Mailing Label / OLAP、DevExpress の Table / Vertical / Cross-Tab / Labels
  relevance_to_bdft: 帯モデルは pattern:growing-detail と同型。.bdft は帯をテンプレートに明示せず Office の表や印刷範囲から推定する点が違う。「伸びる / まとめる / 見出しを繰り返す / 下端に置く」の語彙はタグの属性名の参考になる
relations:
- relation: exemplifies
  to: pattern:growing-detail
- relation: exemplifies
  to: pattern:label-sheet
- relation: compared_with
  to: system:svf
assertions:
- predicate: jasper_sections
  value: [title, pageHeader, columnHeader, groupHeader, detail, groupFooter, columnFooter, pageFooter, lastPageFooter, summary, background, noData]
  authority: observed
  evidence:
    url: https://jasperreports.sourceforge.net/api/net/sf/jasperreports/engine/JRSection.html
- predicate: stimulsoft_filler_band
  value: EmptyData
  authority: observed
  evidence:
    url: https://www.stimulsoft.com/manuals/en/user-manual/report_internals_empty_band.htm
- predicate: fastreport_zpl_export
  value: since 2018.1, one page per label
  authority: observed
  evidence:
    url: https://www.fast-report.com/blogs/print-report-zpl-format
- predicate: total_pages_needs_second_pass
  value: true
  authority: observed
  evidence:
    url: https://fast-report.com/public_download/docs/FRNet/online/en/api/FastReport.Data.PageNofMVariable.html
