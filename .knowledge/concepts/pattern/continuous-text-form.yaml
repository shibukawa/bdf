id: pattern:continuous-text-form
type: pattern
title: 連続帳票・テキスト式テンプレート（ドットインパクト）
summary: >-
  連続用紙（ミシン目つき、複写）にドットインパクトプリンタで印字する伝票。行送り（6 / 8 LPI）、桁ピッチ（10 / 12 / 15 CPI）、
  用紙長（インチまたは行数）、左右マージン、ミシン目スキップで決まる「行×桁」の格子にテキストを置く。罫線や項目名はプレ印刷用紙が持つことが多い。
lifecycle: proposed
authority: authored
aliases:
- 連帳
- 連続用紙
- ドットインパクト
- 複写伝票
facts:
  grid_model: ページは行数 × 桁数の格子。フォントは固定ピッチ（10 CPI = 1 桁 7.2 pt、6 LPI = 1 行 12 pt）。縮小（17 CPI の圧縮文字）と倍角
  template_style: 項目は（行, 桁）と桁数で置く。行の中の桁位置で列を揃える。歴史的には COBOL の帳票定義や固定長レコードの印字と同じ
  preprinted: 罫線・社名・項目名はプレ印刷用紙。印字するのは可変部分だけ（pattern:preprinted-overlay）。位置合わせの微調整（上下左右のオフセット）が運用で必要
  multipart: 複写（2〜5 枚複写）で控え・納品先・運送用を同時に作る。電子化では pattern:copy-variants
  bdf_mapping:
    page: 用紙長を 1 ページとする fixed View。15 × 11 インチ、10 × 11 インチなど
    text: 等幅フォントで格子に置く。BDF には格子の概念はないので、コンパイル時に pt に落とす
    destination: 画面と PDF ならそのまま。実機に印字するなら ESC/P などのプリンタ言語への書き出しが別に要る。Windows のドライバ経由で PDF を印刷すれば、位置ずれの調整はドライバ側
  source_question: Word / Excel からこの形態をどう作るか。Excel の等幅フォント＋固定行高のシートを格子とみなすか、専用のテキスト形式のテンプレート（行送りとマージンを設定ファイルで持つ）を別に定義するかは未決
  typical_forms: [納品書, 受領書, 出荷伝票, 給与明細（旧来）, 銀行の帳票]
relations:
- relation: member_of
  to: taxonomy:form-layout-axes
- relation: inherits_from
  to: pattern:preprinted-overlay
