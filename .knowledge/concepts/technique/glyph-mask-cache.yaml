  key_candidates:
  - font内容hash
  - glyph ID
  - 倍率・transform
  - 小数画素位置
  - 合成太字・斜体
  - 解決済みAA方式
  memory: 容量上限とLRU等。設定が異なるmaskを混用しない
  tradeoffs:
  - 小数位置量子化による見た目と再利用率
  - 回転・非等方変換のfallback
  - stroke文字は別扱い
  priority: early-for-text
  experiment: experiment:raster-non-aa-comparison
  limit: 'TextCacheBytes: zero=32MiB, negative=disabled, positive=bytes'
